<title>Resumen lo que lee la IA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--page:#dfe3ea;--font-body:'Figtree';--font-mono:'JetBrains Mono'}
*{box-sizing:border-box}
body{margin:0;background:var(--page);font:400 15px/1.5 'Figtree',system-ui,sans-serif;color:#0b1426;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit;text-decoration:none}
.rv{max-width:1560px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.rv h1{font-size:18px;font-weight:600;margin:0}.rv p{margin:2px 0 0;font-size:13px;color:#5f6b7e;max-width:80ch}
.seg{display:flex;flex-wrap:wrap;background:#fff;border-radius:99px;padding:3px;gap:2px;border:1px solid #e3e6eb}
.seg button{border:0;background:none;font:600 13px 'Figtree',sans-serif;padding:7px 14px;border-radius:99px;color:#5f6b7e;cursor:pointer}
.seg button[aria-pressed=true]{background:#0b1426;color:#fff}
.stage{max-width:1560px;margin:0 auto;display:flex;gap:24px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.desk{flex:1 1 900px;max-width:1140px;min-width:0;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.phone{width:390px;max-width:100%;border-radius:34px;overflow:hidden;border:10px solid #0b1426;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.app{background:var(--canvas);padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.phone .app{padding:12px}
.pairx{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@container (min-width:760px){.pairx{grid-template-columns:1fr 1fr}}
/* CONSOLE-INSTRUMENTO-1 · tokens (log §349). Acotados a `.ins` (pantallas ya
   migradas) y `.ins-shell` (menú, cabecera y marco): la web pública y las
   pantallas aún sin migrar no los ven. Claro por defecto; el oscuro solo con
   `data-theme="dark"` en <html> (lib/ins/theme.ts), nunca por el sistema. */
.ins,.ins-shell{
 --canvas:#eceef2;--surface:#ffffff;--surface-2:#f6f7f9;--surface-3:#eff1f4;
 --ink:#0b1426;--ink-2:#3b4759;--ink-3:#5f6b7e;--ink-4:#9aa4b3;
 --rule:#e3e6eb;--rule-2:#eef0f3;--tick-off:#d3d9e2;
 --blue:#2563eb;--blue-ink:#1b4fd6;--blue-tint:#ecf2ff;--blue-soft:#c9dbff;
 --warm:#c2410c;--warm-tint:#fff3eb;--warm-rule:#fbd3bb;
 --pos:#0f7a54;--pos-tint:#e8f6ef;
 --shadow:0 1px 2px rgba(11,20,38,.04),0 12px 40px -12px rgba(11,20,38,.12);
 --card-shadow:0 1px 0 rgba(11,20,38,.02);
 --font:var(--font-body),'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
 --mono:var(--font-mono),'JetBrains Mono',ui-monospace,monospace;
 --d1:120ms;--d2:200ms;--d3:320ms;--d4:600ms;
 --std:cubic-bezier(.2,0,0,1);--out:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.4,.5,1);
 color-scheme:light;
}
:root[data-theme="dark"] .ins,:root[data-theme="dark"] .ins-shell{
 --canvas:#05080f;--surface:#0c121e;--surface-2:#111929;--surface-3:#162034;
 --ink:#eef2f8;--ink-2:#bcc6d6;--ink-3:#8c97aa;--ink-4:#5a6579;
 --rule:#1e2737;--rule-2:#172031;--tick-off:#273147;
 --blue:#5b93ff;--blue-ink:#8db4ff;--blue-tint:#13224a;--blue-soft:#24407c;
 --warm:#ff8f57;--warm-tint:#2a170d;--warm-rule:#5a2f17;
 --pos:#43d39a;--pos-tint:#0f2a20;
 --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 50px -16px rgba(0,0,0,.6);
 color-scheme:dark;
}
.ins,.ins *{box-sizing:border-box}
.ins{color:var(--ink);font:400 15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
.ins button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.ins a{color:inherit;text-decoration:none}
.ins .num{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1}
.ins .mono{font-family:var(--mono);font-size:.92em;letter-spacing:-.01em}
.ins .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ins .i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ins .i.sm{width:15px;height:15px}
.ins :focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
/* --- css/3-components.css --- */
/* ===== type & blocks ===== */
.ins .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:10px}
.ins .eyebrow::after{content:"";flex:1;height:1px;background:var(--rule)}
.ins .eyebrow.bare::after{display:none}
.ins h1{font-size:44px;line-height:1.05;font-weight:300;letter-spacing:-.035em}
.ins h2{font-size:24px;font-weight:400;letter-spacing:-.025em;line-height:1.2}
.ins h3{font-size:14px;font-weight:600;letter-spacing:-.005em}
.ins .lead{font-size:17px;color:var(--ink-2);max-width:640px;margin-top:14px;line-height:1.55}
.ins .lead a{color:var(--ink);font-weight:600;background:linear-gradient(var(--blue),var(--blue)) 0 100%/100% 1px no-repeat;padding-bottom:1px}
.ins .lead a:hover{color:var(--blue)}
.ins .pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.ins .chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border:1px solid var(--rule);border-radius:99px;font-size:12.5px;font-weight:550;color:var(--ink-2);white-space:nowrap;background:var(--surface)}
.ins .chip .dt{width:6px;height:6px;border-radius:50%;background:var(--pos)}
.ins button.chip:hover{border-color:var(--ink-4);color:var(--ink)}
.ins .badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.ins .badge .i{width:12px;height:12px;stroke-width:2}
.ins .b-pos{background:var(--pos-tint);color:var(--pos)}
.ins .b-blue{background:var(--blue-tint);color:var(--blue-ink)}
.ins .b-warm{background:var(--warm-tint);color:var(--warm)}
.ins .b-line{border:1px solid var(--rule);color:var(--ink-3)}
.ins .card{border:1px solid var(--rule);border-radius:20px;background:var(--surface);box-shadow:var(--card-shadow)}
.ins .card-h{display:flex;align-items:center;gap:10px;padding:18px 22px 0}
.ins .card-h .see{margin-left:auto;font-size:12.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:2px}
.ins .card-h .see:hover{color:var(--blue)}
.ins .card-b{padding:16px 22px 22px}
.ins .sec{margin-top:48px}
.ins .sec>.eyebrow{margin-bottom:16px}
.ins .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ins .grid57{display:grid;grid-template-columns:5fr 7fr;gap:16px}
.ins .grid2>*,.ins .grid57>*,.ins .inst>*,.ins .scan>*,.ins .plan>*{min-width:0}
.ins .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:99px;font-size:13.5px;font-weight:600;white-space:nowrap;transition:background var(--d1) var(--std),transform var(--d1) var(--std),color var(--d1)}
.ins .btn:active{transform:scale(.97)}
.ins .btn.ink{background:var(--ink);color:var(--surface)}
.ins .btn.ink:hover{background:var(--ink-2)}
.ins .btn.blue{background:var(--blue);color:#fff}
.ins .btn.line{border:1px solid var(--rule);color:var(--ink)}
.ins .btn.line:hover{border-color:var(--ink-4)}
.ins .btn.ghost{color:var(--ink-3)}
.ins .btn.ghost:hover{color:var(--ink)}
.ins .btn.sm{height:34px;padding:0 13px;font-size:13px}
/* Legacy variants still used by screens that keep their old markup (Google,
   Auditoría técnica, Comercio agéntico). `.ins button` resets them to plain text. */
.ins .btn.btn-sm{height:34px;padding:0 13px;font-size:13px}
.ins .btn.btn-primary{background:var(--ink);color:var(--surface)}
.ins .btn.btn-primary:hover:not(:disabled){background:var(--ink-2)}
.ins .btn.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.ins .btn.btn-ghost{border:1px solid var(--rule);color:var(--ink)}
.ins .btn.btn-ghost:hover:not(:disabled){border-color:var(--ink-4)}
.ins .btn.btn-ghost:disabled{opacity:.45;cursor:not-allowed}
.ins .btn.warm{background:var(--warm);color:var(--surface)}

/* alert: the one warm accent */
.ins .alert{display:flex;align-items:center;gap:14px;margin-top:28px;padding:14px 14px 14px 18px;border:1px solid var(--warm-rule);border-left:3px solid var(--warm);border-radius:14px;background:var(--warm-tint)}
.ins .alert .i{color:var(--warm)}
.ins .alert .tx{flex:1;min-width:0;font-size:14px;color:var(--ink-2)}
.ins .alert .tx b{color:var(--ink);font-weight:600}

/* rolling counter */
.ins .roll{display:inline-flex;align-items:baseline;line-height:1;vertical-align:baseline}
.ins .roll .col{display:inline-block;height:1em;overflow:hidden;position:relative}
.ins .roll .col>span{display:flex;flex-direction:column;transition:transform var(--d4) var(--out);transition-delay:var(--rd,0ms)}
.ins .roll .col>span>i{font-style:normal;height:1em;line-height:1;display:block}
.ins .roll .st{display:inline-block;line-height:1}

/* tick bars */
.ins .tk{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;height:12px;align-items:end}
.ins .tk i{display:block;height:100%;width:2px;border-radius:1px;background:var(--tick-off);justify-self:center;transition:background 0s linear var(--td,0ms)}
.ins .tk.lit i.on{background:var(--blue)}
.ins .tk.lit.ink i.on{background:var(--ink-2)}
.ins .tk.lit.warm i.on{background:var(--warm)}
.ins .tk i.mj{height:150%}

/* ===== overlays ===== */
.ins .scrim{position:fixed;inset:0;background:rgba(5,8,15,.32);z-index:80;opacity:0;transition:opacity var(--d2) var(--std)}
.ins .scrim.on{opacity:1}
.ins .cmdk{position:fixed;left:50%;top:14vh;width:min(580px,calc(100vw - 32px));transform:translateX(-50%) scale(.98);opacity:0;z-index:81;background:var(--surface);border:1px solid var(--rule);border-radius:20px;box-shadow:0 30px 80px -20px rgba(5,8,15,.45);overflow:hidden;transition:opacity var(--d2) var(--std),transform var(--d2) var(--out)}
.ins .cmdk.on{opacity:1;transform:translateX(-50%) scale(1)}
.ins .cmdk .q{display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--rule)}
.ins .cmdk input{flex:1;height:56px;border:0;outline:0;background:transparent;font:400 16px var(--font);color:var(--ink)}
.ins .cmdk input::placeholder{color:var(--ink-4)}
.ins .cmdk kbd{font:500 11px var(--mono);border:1px solid var(--rule);border-radius:6px;padding:1px 6px;color:var(--ink-3)}
.ins .cmdk .list{max-height:min(380px,56vh);overflow-y:auto;padding:8px}
.ins .cmdk .g{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:10px 10px 6px}
.ins .cmdk .it{display:flex;align-items:center;gap:12px;width:100%;height:42px;padding:0 10px;border-radius:10px;font-size:14px;text-align:left;color:var(--ink-2)}
.ins .cmdk .it .i{color:var(--ink-3)}
.ins .cmdk .it[aria-selected="true"]{background:var(--surface-3);color:var(--ink)}
.ins .cmdk .it[aria-selected="true"] .i{color:var(--blue)}
.ins .cmdk .it .k{margin-left:auto;font-size:12px;color:var(--ink-4)}
.ins .cmdk .empty{padding:24px;text-align:center;color:var(--ink-3);font-size:14px}
.ins .notes{position:fixed;top:60px;right:24px;width:min(420px,calc(100vw - 32px));max-height:calc(100vh - 90px);overflow-y:auto;z-index:81;background:var(--surface);border:1px solid var(--rule);border-radius:20px;box-shadow:0 30px 80px -20px rgba(5,8,15,.45);padding:22px 24px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity var(--d2) var(--std),transform var(--d2) var(--out)}
.ins .notes.on{opacity:1;transform:none;pointer-events:auto}
.ins .notes h2{font-size:20px}
.ins .notes ul{padding-left:18px;margin-top:12px;display:grid;gap:9px;font-size:13.5px;color:var(--ink-2)}
.ins .notes .cl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ins .notes .x{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3)}
.ins .toasts{position:fixed;right:28px;bottom:28px;z-index:90;display:grid;gap:8px;width:min(380px,calc(100vw - 32px))}
.ins .toast{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:16px;background:var(--ink);color:var(--surface);box-shadow:0 18px 40px -16px rgba(5,8,15,.5);font-size:13.5px;animation:ins-tin var(--d3) var(--out)}
.ins .toast .i{color:var(--blue-soft)}
.ins .toast .tx{flex:1;min-width:0}
.ins .toast .tx span{display:block;opacity:.7;font-size:12.5px}
.ins .toast .btn{height:30px;padding:0 12px;color:var(--surface);border:1px solid rgba(255,255,255,.25);font-size:12.5px}
.ins .toast.out{animation:ins-tout var(--d2) var(--std) forwards}
@keyframes ins-tin{from{opacity:0;transform:translateY(10px) scale(.98)}}
@keyframes ins-tout{to{opacity:0;transform:translateY(6px)}}



/* ===== instrument: dial, engine row, evolution ===== */
.ins .inst{display:grid;grid-template-columns:340px 1fr;gap:0;margin-top:36px}
.ins .dialw{position:relative;padding:26px 30px 22px;border-right:1px solid var(--rule)}
.ins .dial{display:block;width:100%;max-width:280px;margin:0 auto;overflow:visible}
.ins .dial .t{stroke:var(--tick-off);stroke-width:1.6;stroke-linecap:round;transition:stroke 0s linear var(--d,0ms)}
.ins .dial.lit .t.on{stroke:var(--blue)}
.ins .dial .t.mj{stroke-width:2}
.ins .dial .lbl{font:500 10px var(--font);fill:var(--ink-3);font-variant-numeric:tabular-nums}
.ins .dial .needle{stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
.ins .dialbox{position:relative;max-width:280px;margin:0 auto}
.ins .dial-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;padding-top:6px}
.ins .dial-c .big{font-size:84px;font-weight:300;letter-spacing:-.05em;line-height:1}
.ins .dial-c .of{font-size:13px;color:var(--ink-3);margin-top:6px}
.ins .bands{display:flex;justify-content:center;gap:14px;margin-top:6px;font-size:11.5px;color:var(--ink-3)}
.ins .bands span{display:flex;align-items:center;gap:6px}
.ins .bands span::before{content:"";width:8px;height:1.5px;background:var(--tick-off)}
.ins .bands span.on{color:var(--ink);font-weight:600}
.ins .bands span.on::before{background:var(--blue);height:2px}
.ins .inst-r{padding:24px 28px 22px;display:flex;flex-direction:column;min-width:0}
.ins .inst-r .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ins .inst-r .meta{font-size:12.5px;color:var(--ink-3);margin-left:auto}
.ins .evo{margin-top:14px;flex:1;min-height:150px}
.ins .evo svg{display:block;width:100%;height:auto;overflow:visible}
.ins .evo .ax{font:500 10.5px var(--font);fill:var(--ink-3);font-variant-numeric:tabular-nums}
.ins .evo .ax.s{fill:var(--ink);font-weight:650}
.ins .evo-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:6px}
.ins .engs4{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule)}
.ins .eng{padding:18px 22px 20px;border-right:1px solid var(--rule);min-width:0}
.ins .eng:last-child{border-right:0}
.ins .eng .h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);font-weight:550}
.ins .eng .h svg{width:16px;height:16px;color:var(--ink)}
.ins .eng .v{font-size:34px;font-weight:300;letter-spacing:-.04em;margin:10px 0 10px;line-height:1}
.ins .eng .v small{font-size:15px;color:var(--ink-3);margin-left:2px;letter-spacing:0}

/* scan strip with pendulums */
.ins .scan{margin-top:28px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0;overflow:hidden}
.ins .pend{padding:14px 18px 12px;border-right:1px solid var(--rule)}
.ins .pend svg{display:block;width:100%;height:auto}
.ins .pend .rail{stroke:var(--ink-4);stroke-width:1}
.ins .pend .str{stroke:var(--ink-3);stroke-width:1}
.ins .pend .arc{fill:none;stroke:var(--rule);stroke-width:1;stroke-dasharray:1.5 4}
.ins .pend .bob{fill:var(--surface);stroke:var(--rule)}
.ins .pend-l{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.ins .scan-r{padding:20px 24px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.ins .scan-r .k{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);font-weight:650}
.ins .scan-r .k .pulse{width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 0 var(--blue-soft);animation:ins-pulse 1.6s var(--std) infinite}
@keyframes ins-pulse{0%{box-shadow:0 0 0 0 var(--blue-soft)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.ins .scan-r .n{font-size:40px;font-weight:300;letter-spacing:-.04em;line-height:1}
.ins .scan-r .n small{font-size:15px;color:var(--ink-3);letter-spacing:0;margin-left:6px}
.ins .scan-r .tk{height:14px;gap:2px}
.ins .scan-r .s{font-size:13px;color:var(--ink-3)}
.ins .shimmer{background:linear-gradient(90deg,var(--ink-3) 0%,var(--ink-3) 40%,var(--ink) 50%,var(--ink-3) 60%,var(--ink-3) 100%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:ins-shim 2.2s linear infinite}
@keyframes ins-shim{from{background-position:100% 0}to{background-position:-150% 0}}

/* kpis */
.ins .kpis{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.ins .kpi{padding:18px 20px 18px 0;margin-right:20px;border-right:1px solid var(--rule);min-width:0}
.ins .kpi:last-child{border-right:0;margin-right:0}
.ins .kpi .l{font-size:12.5px;color:var(--ink-3)}
.ins .kpi .v{display:flex;align-items:baseline;gap:8px;margin-top:8px;flex-wrap:wrap}
.ins .kpi .v b{font-size:38px;font-weight:300;letter-spacing:-.04em;line-height:1}
.ins .kpi .v .u{font-size:15px;color:var(--ink-3);margin-left:-6px;margin-right:4px}
.ins .kpi svg.sp{display:block;width:100%;height:30px;margin-top:12px;overflow:visible}
.ins .kpi .sent{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px;margin-top:22px}
.ins .kpi .sent i{display:block}
.ins .kpi .lg{display:flex;gap:12px;font-size:11.5px;color:var(--ink-3);margin-top:8px}

/* ===== plan progress ticks, deck, cards ===== */
.ins .ptk{display:flex;align-items:center;gap:6px;margin-top:18px}
.ins .ptk button{position:relative;height:24px;flex:1;display:flex;align-items:flex-end;padding:0}
.ins .ptk button i{display:block;width:100%;height:3px;border-radius:2px;background:var(--tick-off);transition:background var(--d2) var(--std),height var(--d2) var(--std)}
.ins .ptk button.done i{background:var(--blue)}
.ins .ptk button.cur i{height:6px;background:var(--ink)}
.ins .ptk button.cur.done i{background:var(--blue)}
.ins .ptk button span{position:absolute;left:0;top:0;font-size:11px;color:var(--ink-3);font-weight:500}
.ins .ptk button.cur span{color:var(--ink);font-weight:650}
.ins .ptk .cnt{flex:none;width:52px;text-align:right;font-size:13px;color:var(--ink-3)}
.ins .navb{width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;color:var(--ink);transition:border-color var(--d1),opacity var(--d1)}
.ins .navb:hover{border-color:var(--ink-4)}
.ins .navb:disabled{opacity:.35;cursor:default}

.ins .deck{position:relative;margin-top:22px;transition:height var(--d3) var(--out)}
.ins .dk{position:absolute;left:0;right:0;top:0;border:1px solid var(--rule);border-radius:26px;background:var(--surface);box-shadow:0 1px 2px rgba(11,20,38,.04),0 24px 60px -30px rgba(11,20,38,.28);transform-origin:50% 100%;transition:transform var(--d3) var(--out),opacity var(--d3) var(--out);overflow:hidden;touch-action:pan-y;will-change:transform}
.ins .dk .in{padding:30px 34px 30px;transition:opacity var(--d2) var(--std)}
.ins .dk[data-pos="0"]{z-index:3}
.ins .dk[data-pos="1"]{z-index:2;transform:translateY(14px) scale(.965)}
.ins .dk[data-pos="2"]{z-index:1;transform:translateY(28px) scale(.93)}
.ins .dk[data-pos="1"] .in,.ins .dk[data-pos="2"] .in,.ins .dk[data-pos="far"] .in{opacity:0}
.ins .dk[data-pos="far"]{z-index:0;transform:translateY(28px) scale(.93);opacity:0}
.ins .dk[data-pos="prev"]{z-index:4;transform:translateX(-112%) rotate(-5deg);opacity:0;pointer-events:none}
.ins .dk[data-pos="1"],.ins .dk[data-pos="2"],.ins .dk[data-pos="far"]{pointer-events:none}
.ins .dk.drag{transition:none}
.ins .dk-top{display:flex;align-items:flex-start;gap:16px}
.ins .dk-ix{font-size:44px;font-weight:300;letter-spacing:-.04em;line-height:.9;color:var(--ink-4);min-width:56px}
.ins .dk-ch{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:4px}
.ins .dk-ch .k{font-size:12.5px;color:var(--ink-3)}
.ins .dk-imp{margin-left:auto;text-align:right;flex:none}
.ins .dk-imp .v{font-size:44px;font-weight:300;letter-spacing:-.04em;color:var(--blue);line-height:1}
.ins .dk-imp .v small{font-size:17px;margin-left:3px;letter-spacing:0}
.ins .dk-imp .t{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.ins .dk-imp .w{font-size:15px;font-weight:550;color:var(--ink-2);padding-top:10px}
.ins .dk .do-k{margin-top:26px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:650}
.ins .dk h3.do{font-size:30px;font-weight:400;letter-spacing:-.03em;line-height:1.2;margin-top:8px;max-width:760px}
.ins .dk h3.do code.p{font-size:.8em}
.ins .dk .why{color:var(--ink-3);font-size:15.5px;margin-top:12px;max-width:640px}
.ins .seen{margin-top:20px;border-top:1px solid var(--rule-2);padding-top:12px}
.ins .seen>button{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:550;color:var(--ink-2);height:32px}
.ins .seen>button .e{display:inline-flex;gap:5px}
.ins .seen>button .e svg{width:14px;height:14px;color:var(--ink)}
.ins .seen>button .i{transition:transform var(--d2) var(--std)}
.ins .seen.open>button .i{transform:rotate(180deg)}
.ins .seen ul{list-style:none;padding:4px 0 0;display:grid;gap:2px}
.ins .seen li{font-size:14px;padding:8px 0;border-bottom:1px dashed var(--rule);color:var(--ink-2)}
.ins .seen li:last-child{border-bottom:0}
.ins .dk-act{display:flex;align-items:center;gap:12px;margin-top:24px;flex-wrap:wrap}
.ins .dk-act .hint,.ins .hint2{font-size:12.5px;color:var(--ink-3)}
.ins .hint2{margin-top:12px}
.ins .im-m{display:none}
.ins .goal{margin-top:22px;padding:16px 18px;border-radius:16px;background:var(--surface-2)}
.ins .goal .gh{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--ink-3);flex-wrap:wrap}
.ins .goal .gh b{color:var(--ink);font-weight:600;font-size:14px}
.ins .goal .gh span:last-child{margin-left:auto}
.ins .gscale{display:grid;grid-template-columns:repeat(20,1fr);height:34px;margin-top:12px;align-items:end;position:relative}
.ins .gscale i{display:block;width:2px;height:12px;background:var(--tick-off);justify-self:center;border-radius:1px}
.ins .gscale i.p1{background:var(--pos);opacity:.55}
.ins .gscale i.tr{background:var(--blue)}
.ins .gscale i.now{height:22px;background:var(--ink);width:2.5px}
.ins .gscale i.goalt{height:22px;background:var(--pos);opacity:1}
.ins .gscale-l{display:grid;grid-template-columns:repeat(20,1fr);font-size:10.5px;color:var(--ink-3);text-align:center;margin-top:4px}

/* slide to confirm */
.ins .slide{position:relative;width:340px;max-width:100%;height:56px;border-radius:99px;background:var(--surface-3);border:1px solid var(--rule);overflow:hidden;user-select:none;-webkit-user-select:none}
.ins .slide .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--blue-tint);width:56px}
.ins .slide .lab{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-left:48px;font-size:14px;font-weight:600;pointer-events:none}
.ins .slide .knob{position:absolute;left:4px;top:4px;width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;touch-action:none;cursor:grab;box-shadow:0 4px 12px -4px rgba(11,20,38,.4)}
.ins .slide .knob:active{cursor:grabbing}
.ins .slide.back .knob,.ins .slide.back .fill{transition:transform var(--d3) var(--spring),width var(--d3) var(--spring)}
.ins .slide.ok{background:var(--blue);border-color:var(--blue)}
.ins .slide.ok .lab{color:#fff}
.ins .slide.ok .knob{background:#fff;color:var(--blue)}
.ins .slide.nudge .knob{animation:ins-nudge var(--d4) var(--spring)}
@keyframes ins-nudge{0%,100%{transform:translateX(0)}40%{transform:translateX(26px)}}
.ins .donebar{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;border-radius:99px;background:var(--pos-tint);color:var(--pos);font-weight:600;font-size:14px}
.ins .donebar .btn{margin-left:auto;color:var(--pos)}
.ins .gen{margin-top:20px;border:1px solid var(--rule);border-radius:16px;padding:16px 18px}
.ins .gen .gh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.ins .gen .gh .btn{margin-left:auto}
.ins .gen ol{padding-left:20px;margin-top:10px;font-size:14px;color:var(--ink-2);display:grid;gap:4px}
.ins .gen p{font-size:12px;color:var(--ink-3);margin-top:10px}
.ins .think{display:flex;align-items:center;gap:10px;margin-top:20px;font-size:14px;font-weight:550}
.ins .think .dots{display:inline-flex;gap:4px}
.ins .think .dots i{width:5px;height:5px;border-radius:50%;background:var(--blue);animation:ins-bob 1s var(--std) infinite}
.ins .think .dots i:nth-child(2){animation-delay:.15s}.ins .think .dots i:nth-child(3){animation-delay:.3s}
@keyframes ins-bob{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-4px);opacity:1}}

/* ===== pills, list rows, history ===== */
.ins .pacc{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.ins .pill{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 8px 0 14px;border-radius:99px;border:1px solid var(--rule);font-size:13.5px;font-weight:550;color:var(--ink-2);background:var(--surface);transition:background var(--d2) var(--std),color var(--d2),border-color var(--d2)}
.ins .pill:hover{border-color:var(--ink-4)}
.ins .pill .p{font-size:12.5px;color:var(--pos);font-weight:600}
.ins .pill .c{min-width:22px;height:22px;border-radius:99px;background:var(--surface-3);display:grid;place-items:center;font-size:11.5px;color:var(--ink-3)}
.ins .pill .i{transition:transform var(--d2) var(--std);width:15px;height:15px}
.ins .pill[aria-expanded="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.ins .pill[aria-expanded="true"] .p{color:var(--blue-soft)}
.ins .pill[aria-expanded="true"] .c{background:rgba(255,255,255,.14);color:var(--surface)}
.ins .pill[aria-expanded="true"] .i{transform:rotate(180deg)}
.ins .pbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--d3) var(--out)}
.ins .pbody.open{grid-template-rows:1fr}
.ins .pbody>div{overflow:hidden}
.ins .pbody .desc{font-size:13.5px;color:var(--ink-3);padding:16px 0 4px}
.ins .lrow{border-bottom:1px solid var(--rule-2)}
.ins .lrow>button{display:grid;grid-template-columns:1fr auto 18px;gap:16px;align-items:center;width:100%;text-align:left;padding:16px 4px}
.ins .lrow .tt{min-width:0}
.ins .lrow .tt .ch{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.ins .lrow .tt b{font-weight:500;font-size:16px;letter-spacing:-.01em;display:block}
.ins .lrow .tt span.w{display:block;font-size:13.5px;color:var(--ink-3);margin-top:3px}
.ins .lrow .im{font-size:14px;font-weight:600;color:var(--blue);white-space:nowrap}
.ins .lrow .im.lo{color:var(--ink-3);font-weight:500;font-size:13px}
.ins .lrow>button>.i{color:var(--ink-3);transition:transform var(--d2) var(--std)}
.ins .lrow.open>button>.i{transform:rotate(180deg)}
.ins .lrow .ex{padding:0 4px 18px}
.ins .lrow .ex p{font-size:14px;color:var(--ink-2);max-width:640px}
.ins .lrow .ex .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:4px}
.ins .lrow .ex .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.ins .inl{display:inline-flex;align-items:center;gap:6px;height:34px;border-radius:99px;border:1px solid var(--rule);padding:0 4px 0 12px;font-size:13px}
.ins .inl .btn{height:26px;padding:0 10px;font-size:12.5px}
.ins .hist{display:flex;gap:14px;align-items:flex-start;padding:16px 4px;border-bottom:1px solid var(--rule-2)}
.ins .hist .i{color:var(--pos);margin-top:2px}
.ins .hist .b{flex:1;min-width:0}
.ins .hist h4{font-size:15.5px;font-weight:500;margin-top:6px}
.ins .hist p{font-size:13px;color:var(--ink-3)}


/* ===== chips, favicons ===== */
.ins code.p{font:500 .86em var(--mono);background:var(--surface-3);border-radius:6px;padding:1px 5px;color:var(--ink);white-space:nowrap}
.ins .src{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap;background:var(--surface)}
.ins .src svg{width:11px;height:11px}
.ins .src.ia{color:var(--blue-ink);border-color:var(--blue-soft);background:var(--blue-tint)}
.ins .src.ia .i{width:11px;height:11px;stroke-width:2}
.ins .src.ag .i{width:12px;height:12px}

.ins .src.src-ia,.ins .src.ia{color:var(--blue-ink);border-color:var(--blue-soft);background:var(--blue-tint)}
.ins .fav{width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;flex:none;overflow:hidden}
.ins .fav.w{background:#fff;box-shadow:inset 0 0 0 1px rgba(11,20,38,.1)}
.ins .fav svg{width:100%;height:100%}
.ins .fav.xs{width:16px;height:16px;border-radius:4px}
.ins .fav.lg{width:30px;height:30px;border-radius:8px}

/* ===== thin bar with end marker (replaces tick bars outside the dial) ===== */
.ins .tb{position:relative;height:4px;border-radius:2px;background:var(--rule-2);--c:var(--blue)}
.ins .tb>i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--c);width:0;transition:width var(--d4) var(--out) var(--bd,0ms)}
.ins .tb>b{position:absolute;top:50%;left:0;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--c);transform:translate(-50%,-50%);transition:left var(--d4) var(--out) var(--bd,0ms)}
.ins .tb.lit>i{width:var(--w)}
.ins .tb.lit>b{left:var(--w)}
.ins .tb.thin{height:3px}
.ins .tb.thin>b{width:8px;height:8px;border-width:1.75px}
.ins .tb.ink{--c:var(--ink-4)}
.ins .tb.warm{--c:var(--warm)}
.ins .tb.nomark>b{display:none}

/* ===== breakdown rows (thin bar) ===== */
.ins .brk{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:end;padding:14px 0;border-bottom:1px solid var(--rule-2)}
.ins .brk:last-child{border-bottom:0}
.ins .brk .n{font-size:14px;font-weight:550}
.ins .brk .n span{display:block;font-size:12px;color:var(--ink-3);font-weight:400}
.ins .brk .v{font-size:24px;font-weight:300;letter-spacing:-.03em;line-height:1;text-align:right}
.ins .brk .v small{font-size:12px;color:var(--ink-3);letter-spacing:0}
.ins .brk .tb{grid-column:1/-1}

/* ===== ranking ===== */
.ins .rank{list-style:none;padding:0}
.ins .rank-h{display:grid;grid-template-columns:52px minmax(0,1fr) 110px 100px;gap:12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:0 14px 10px;border-bottom:1px solid var(--ink)}
.ins .rank-h span:nth-child(3),.ins .rank-h span:nth-child(4){text-align:right;white-space:nowrap}
.ins .rk{display:grid;grid-template-columns:52px minmax(0,1fr) 110px 100px;gap:6px 12px;align-items:center;padding:14px;border-bottom:1px solid var(--rule-2);border-radius:14px;position:relative}
.ins .rk:last-child{border-bottom:0}
.ins .rk .pos{font-size:30px;font-weight:300;letter-spacing:-.04em;color:var(--ink-4);line-height:1;grid-row:1/3}
.ins .rk .who{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;min-width:0}
.ins .rk .who span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ins .rk .you{font-size:10.5px;font-weight:650;color:var(--blue);background:var(--surface);border:1px solid var(--blue-soft);border-radius:99px;padding:1px 8px}
.ins .rk .men{text-align:right;display:flex;align-items:baseline;justify-content:flex-end;gap:8px}
.ins .rk .men b{font-size:26px;font-weight:400;letter-spacing:-.03em;line-height:1}
.ins .rk .men b small{font-size:13px;color:var(--ink-3);margin-left:1px}
.ins .dl{display:inline-flex;align-items:center;gap:1px;font-size:12px;font-weight:600}
.ins .dl .i{width:12px;height:12px;stroke-width:2.2}
.ins .dl.up{color:var(--pos)}.ins .dl.down{color:var(--warm)}.ins .dl.eq{color:var(--ink-4)}
.ins .rk .avg{text-align:right;font-size:15px;color:var(--ink-2)}
.ins .rk .avg small{display:none}
.ins .rk .tb{grid-column:2/4}
.ins .rk.me{background:var(--blue-tint);border-bottom-color:transparent}
.ins .rk.me .pos{color:var(--blue)}

/* ===== deep block: the one place the page breaks its own calm ===== */
.ins .deep{position:relative;overflow:hidden;border-radius:26px;color:#eaf0ff;background:radial-gradient(120% 140% at 0% 0%,#1d4fd6 0%,rgba(29,79,214,0) 55%),linear-gradient(135deg,#0a1633 0%,#0d2257 55%,#123a8f 100%);box-shadow:0 30px 60px -30px rgba(13,34,87,.6);--d-ink:#eaf0ff;--d-ink-2:#b7c7ee;--d-ink-3:#8ea4d8;--d-rule:rgba(255,255,255,.12)}
:root[data-theme="dark"] .ins .deep{border:1px solid rgba(255,255,255,.08)}
.ins .deep .arc{position:absolute;left:-150px;bottom:-170px;width:420px;height:420px;opacity:.3;pointer-events:none}
.ins .deep .arc line{stroke:#8fb2ff;stroke-width:1.4;stroke-linecap:round}
.ins .deep code.p{background:rgba(255,255,255,.1);color:#fff;font-weight:400;padding:1px 6px}
.ins .deep .src{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#dfe8ff}
.ins .deep .src.ia{background:rgba(91,147,255,.18);border-color:rgba(143,178,255,.35);color:#cfe0ff}
.ins .btn.onink{background:#fff;color:#0a1633}
.ins .btn.onink:hover{background:#e6edff}

/* ===== stepper ===== */
.ins .steps{list-style:none;padding:0;position:relative}
.ins .steps li{position:relative}
.ins .steps a{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:14px;align-items:start;padding:12px 10px;border-radius:14px;transition:background var(--d1)}
.ins .steps a:hover{background:rgba(255,255,255,.06)}
.ins .steps .n{width:30px;height:30px;border-radius:50%;border:1px solid var(--d-rule);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--d-ink);background:rgba(255,255,255,.04);position:relative;z-index:1}
.ins .steps li:not(:last-child)::before{content:"";position:absolute;left:25px;top:44px;bottom:-12px;width:1px;background:var(--d-rule)}
.ins .steps .t{font-size:15px;line-height:1.45;color:var(--d-ink)}
.ins .steps .t .src{margin-right:6px;vertical-align:-3px}
.ins .steps .p{font-size:16px;font-weight:600;color:#fff;white-space:nowrap;padding-top:4px}
.ins .steps .p.q{font-size:12.5px;font-weight:500;color:var(--d-ink-3)}

/* ===== list at scale ===== */
.ins .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px}
.ins .search{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--rule);border-radius:99px;flex:1;min-width:200px;max-width:340px;background:var(--surface)}
.ins .search .i{color:var(--ink-3)}
.ins .search input{border:0;outline:0;background:transparent;font:400 14px var(--font);color:var(--ink);flex:1;min-width:0}
.ins .search input::placeholder{color:var(--ink-4)}
.ins .fchips{display:flex;gap:6px;flex-wrap:wrap}
.ins .fchip{height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--rule);font-size:13px;font-weight:550;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;background:var(--surface)}
.ins .fchip .c{font-size:11.5px;color:var(--ink-3)}
.ins .fchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.ins .fchip[aria-pressed="true"] .c{color:inherit;opacity:.7}
.ins .grp{margin-top:28px}
.ins .grp-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.ins .grp-h h3{font-size:17px;font-weight:550;letter-spacing:-.015em}
.ins .grp-h .ct{font-size:12.5px;color:var(--ink-3)}
.ins .grp-h .im{font-size:13px;font-weight:600;color:var(--blue)}
.ins .grp-h .im.q{color:var(--ink-3);font-weight:500}
.ins .grp-h .btn{margin-left:auto}
.ins .grp-d{font-size:13px;color:var(--ink-3);padding-top:8px}
.ins .more{display:flex;align-items:center;gap:6px;height:40px;font-size:13.5px;font-weight:600;color:var(--blue);padding:0 4px}
.ins .more .i{transition:transform var(--d2) var(--std)}
.ins .more[aria-expanded="true"] .i{transform:rotate(180deg)}
.ins .empty-s{padding:40px 16px;text-align:center;color:var(--ink-3);font-size:14px}
.ins .lrow .tt b mark{background:var(--blue-tint);color:inherit;border-radius:3px}

/* ===== focus layer (deck over a whole list) ===== */
.ins .focus{position:fixed;inset:0;z-index:82;background:var(--canvas);display:flex;flex-direction:column;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity var(--d3) var(--std),transform var(--d3) var(--out)}
.ins .focus.on{opacity:1;transform:none;pointer-events:auto}
.ins .focus .fh{display:flex;align-items:center;gap:14px;padding:18px 28px;border-bottom:1px solid var(--rule-2);background:var(--surface)}
.ins .focus .fh .tt{min-width:0;flex:1}
.ins .focus .fh .tt span{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.ins .focus .fh .tt b{font-size:18px;font-weight:500;letter-spacing:-.02em}
.ins .focus .fb{flex:1;overflow-y:auto;padding:24px 28px 60px}
.ins .focus .fb>div{max-width:920px;margin:0 auto}
.ins .focus .ptk button span{display:none}
.ins .focus .ptk{gap:4px}
.ins .focus .ptk button{height:14px}

/* ===== responsive: components ===== */
@media (max-width:1180px){.ins .inst{grid-template-columns:300px 1fr}}
@media (max-width:760px){
 .ins h1{font-size:34px}
 .ins .lead{font-size:16px}
 .ins .sec{margin-top:36px}
 .ins .card-h{padding:16px 16px 0}
 .ins .card-b{padding:14px 16px 18px}
 .ins .alert{flex-wrap:wrap;margin-top:22px}
 .ins .alert .tx{flex-basis:calc(100% - 40px)}
 .ins .inst{grid-template-columns:1fr;margin-top:24px}
 .ins .dialw{border-right:0;border-bottom:1px solid var(--rule);padding:18px 16px 16px}
 .ins .dialbox{max-width:216px}
 .ins .dial-c .big{font-size:64px}
 .ins .inst-r{padding:18px 16px}
 .ins .engs4{grid-template-columns:1fr 1fr}
