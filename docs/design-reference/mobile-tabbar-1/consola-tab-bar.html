/* --- screens/prompts.css --- */
/* ===== side sheet (shared by prompts, competitors, citations; candidate for core) ===== */
.psh-scrim{display:none;position:fixed;inset:0;z-index:76;background:rgba(5,8,15,.28);opacity:0;transition:opacity var(--d3) var(--std)}
.psh-scrim.on{opacity:1}
.psh{position:fixed;top:12px;right:12px;bottom:12px;width:min(580px,calc(100vw - 24px));z-index:77;background:var(--surface);border:1px solid var(--rule);border-radius:24px;box-shadow:0 30px 80px -20px rgba(5,8,15,.45);display:flex;flex-direction:column;transform:translateX(24px);opacity:0;transition:transform var(--d3) var(--out),opacity var(--d3) var(--std);overflow:hidden}
.psh.on{transform:none;opacity:1}
.psh-h{padding:18px 22px 0}
.psh-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:40px}
.psh-h h2{font-size:22px;line-height:1.3;margin-top:10px;letter-spacing:-.02em}
.psh-tabs{padding:16px 22px 0}
.psh-b{flex:1;overflow-y:auto;padding:18px 22px 28px;overscroll-behavior:contain}
.psh-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 22px;border-top:1px solid var(--rule-2)}
.navb.sm{width:32px;height:32px}
.fav.mono-f{background:var(--surface-3);color:var(--ink-2);font:650 11px var(--font);box-shadow:inset 0 0 0 1px var(--rule)}
.fav.xs.mono-f{font-size:9px}

/* ===== Prompts ===== */
.sc-prompts .lead a{cursor:pointer}
.sc-prompts .pills .btn{margin-left:auto}
.pr-sum{margin-top:28px;display:grid;grid-template-columns:300px 1fr;overflow:hidden}
.pr-sum>*{min-width:0}
.pr-sv{padding:22px 24px;border-right:1px solid var(--rule)}
.pr-sv .l{font-size:12.5px;color:var(--ink-3)}
.pr-sv .v{font-size:64px;font-weight:300;letter-spacing:-.05em;line-height:1;margin-top:10px}
.pr-sv .v small{font-size:20px;color:var(--ink-3);letter-spacing:0;margin-left:2px}
.pr-sv p{font-size:13px;color:var(--ink-3);margin-top:8px}
.pr-split{display:flex;gap:3px;height:4px;margin-top:18px}
.pr-split i{display:block;border-radius:2px;background:var(--tick-off)}
.pr-split i:first-child{background:var(--blue)}
.pr-split i.p{background:repeating-linear-gradient(90deg,var(--blue-soft) 0 3px,transparent 3px 6px)}
.pr-lg i.p{background:var(--blue-soft)}
.pr-lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-3);margin-top:10px}
.pr-lg span{display:inline-flex;align-items:center;gap:6px}
.pr-lg i{width:8px;height:2px;background:var(--tick-off)}
.pr-lg i.a{background:var(--blue)}
.pr-eg{display:grid;grid-template-columns:1fr 1fr}
.pr-eg .eng{border-right:1px solid var(--rule)}
.pr-eg .eng:nth-child(2n){border-right:0}
.pr-eg .eng:nth-child(-n+2){border-bottom:1px solid var(--rule)}
.pr-eg .eng .v{margin:10px 0 2px}
.pr-el{font-size:11.5px;color:var(--ink-3);margin-bottom:10px}
.pr-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:44px}
.pr-bar .search{max-width:320px}
.pr-cap{margin-left:auto;font-size:12.5px;color:var(--ink-3)}
#pr-body{margin-top:20px}
.pr-th{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:0 44px 10px 4px;border-bottom:1px solid var(--ink)}
.pr-tp{border-bottom:1px solid var(--rule)}
.pr-tph{display:grid;grid-template-columns:minmax(0,1fr) auto 18px;gap:6px 18px;align-items:center;width:100%;text-align:left;padding:18px 4px 16px}
.pr-tph>.i{color:var(--ink-3);transition:transform var(--d2) var(--std);grid-row:1/3;grid-column:3}
.pr-tp.open .pr-tph>.i{transform:rotate(180deg)}
.pr-tn b{display:block;font-size:17px;font-weight:550;letter-spacing:-.015em}
.pr-tn>span{font-size:12.5px;color:var(--ink-3)}
.pr-tn{grid-column:1;grid-row:1}
.pr-tv{text-align:right;grid-row:1/3;grid-column:2}
.pr-tv b{display:block;font-size:34px;font-weight:300;letter-spacing:-.04em;line-height:1}
.pr-tv b small{font-size:14px;color:var(--ink-3);margin-left:1px;letter-spacing:0}
.pr-tv span{font-size:11px;color:var(--ink-3)}
.pr-tph .tb{grid-column:1;grid-row:2;max-width:420px}
.tpos{color:var(--pos)}.twarm{color:var(--warm)}
.pr-tb{padding:0 0 10px 0}
.pr-row{display:grid;grid-template-columns:22px minmax(0,1fr) auto 16px;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 4px 12px 4px;border-top:1px dashed var(--rule);transition:background var(--d1) var(--std)}
.pr-tb .pr-row{padding-left:14px}
.pr-row:hover{background:var(--surface-2)}
.pr-row>.i{color:var(--ink-4)}
.pr-st{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--pos)}
.pr-st .i{width:14px;height:14px;stroke-width:2.4}
.pr-st i{display:block;width:6px;height:6px;border-radius:50%;background:var(--tick-off)}
.pr-st i.pend{background:var(--blue)}
.pr-t b{display:block;font-size:15px;font-weight:500;letter-spacing:-.005em}
.pr-t b mark{background:var(--blue-tint);color:inherit;border-radius:3px}
.pr-m{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--ink-3);margin-top:3px}
.pr-new{color:var(--blue-ink);font-weight:550}
.pr-e{display:inline-flex;gap:6px}
.pr-e span{display:inline-grid;opacity:.22;filter:grayscale(1)}
.pr-e span.on{opacity:1;filter:none}
.pr-e svg{color:var(--ink)}
.pr-fc{margin-bottom:10px}
.pr-flat{border-top:1px solid var(--ink)}
.pr-flat .pr-row:first-child{border-top:0}

/* sheet: prompt detail */
.prd-sig{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.prd-sig>div{padding:14px 14px 14px 0}
.prd-sig>div:first-child{border-right:1px solid var(--rule);margin-right:14px}
.prd-sig .l{font-size:12.5px;color:var(--ink-3)}
.prd-sig .v{font-size:40px;font-weight:300;letter-spacing:-.04em;line-height:1;margin-top:8px;color:var(--ink-3)}
.prd-sig .ok .v{color:var(--ink)}
.prd-sig .v small{font-size:13px;color:var(--ink-3);letter-spacing:0}
.prd-sec{margin-top:28px}
.prd-sec>.eyebrow{margin-bottom:6px}
.prd-eng{padding:12px 0;border-bottom:1px solid var(--rule-2)}
.prd-eng:last-child{border-bottom:0}
.prd-eng .h{display:flex;align-items:center;gap:8px;font-size:14px}
.prd-eng .h b{font-weight:600}
.pr-sent{margin-left:auto;font-size:12px;font-weight:550;color:var(--ink-3)}
.prd-eng .r{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:14px;align-items:center;font-size:13px;color:var(--ink-2);margin-top:8px}
.prd-eng .r b{font-weight:600;color:var(--ink)}
.prd-rk{display:grid;grid-template-columns:26px 22px auto auto 1fr;grid-template-rows:auto auto;gap:6px 10px;align-items:center;padding:10px 8px;border-radius:12px}
.prd-rk.me{background:var(--blue-tint)}
.prd-rk .pos{font-size:18px;font-weight:300;color:var(--ink-4)}
.prd-rk.me .pos{color:var(--blue)}
.prd-rk b{font-size:14px;font-weight:600}
.prd-rk .you{font-size:10.5px;font-weight:650;color:var(--blue);background:var(--surface);border:1px solid var(--blue-soft);border-radius:99px;padding:1px 8px;justify-self:start}
.prd-rk .v{grid-column:5;justify-self:end;font-size:16px}
.prd-rk .v small{font-size:12px;color:var(--ink-3)}
.prd-rk .tb{grid-column:3/6}
.prd-q{margin:10px 0 0;padding:12px 14px;border-left:2px solid var(--blue);background:var(--surface-2);border-radius:0 12px 12px 0;font-size:14px;color:var(--ink-2)}
.prd-q>span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);margin-bottom:4px}
mark{background:var(--blue-tint);color:var(--ink);border-radius:3px;padding:0 2px}
.prd-src{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule-2);font-size:12.5px;min-width:0}
.prd-src .mono{font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.prd-src .e{margin-left:auto;display:inline-flex;gap:5px;flex:none}
.prd-src .e svg{color:var(--ink)}
.prd-n{font-size:12px;color:var(--ink-3);margin-top:10px}
.prd-pick .seg{max-width:100%}
.prd-pick .seg button{display:inline-flex;align-items:center;gap:6px}
.prd-pick .seg button svg{color:currentColor}
.prd-ans-h{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;margin-top:18px;font-size:12.5px;color:var(--ink-3)}
.prd-ans-h>span:first-child{color:var(--ink);font-weight:600}
.prd-ans{margin-top:12px;padding:16px 18px;border:1px solid var(--rule);border-radius:16px;font-size:14.5px;color:var(--ink-2);display:grid;gap:10px}
.prd-ans ol{padding-left:20px;display:grid;gap:6px}
.prd-ans b{color:var(--ink);font-weight:600}

/* sheet: add prompts */
.ap-steps{display:flex;gap:6px}
.ap-steps span{flex:1;display:grid;gap:6px;font-size:11.5px;color:var(--ink-3);font-weight:550}
.ap-steps i{display:block;height:3px;border-radius:2px;background:var(--tick-off)}
.ap-steps .done i{background:var(--blue)}
.ap-steps .cur{color:var(--ink)}
.ap-steps .cur i{background:var(--ink);height:4px}
.ap-sub{font-size:14px;color:var(--ink-3)}
.ap-back{margin:-6px 0 6px -10px}
.ap-ms{display:grid;gap:10px;margin-top:16px}
.ap-m{display:grid;grid-template-columns:22px 1fr 16px;gap:14px;align-items:center;text-align:left;padding:16px 18px;border:1px solid var(--rule);border-radius:16px;transition:border-color var(--d1),background var(--d1)}
.ap-m:hover{border-color:var(--ink-4);background:var(--surface-2)}
.ap-m>.i:first-child{color:var(--blue)}
.ap-m b{display:block;font-size:15px;font-weight:600}
.ap-m span span{font-size:13px;color:var(--ink-3)}
.ap-m>.i:last-child{color:var(--ink-3)}
.ap-p{font-size:14px;color:var(--ink-2);margin-top:14px}
.ap-lbl{display:block;font-size:12.5px;font-weight:600;margin:16px 0 6px}
.ap-in{display:flex;gap:8px}
.ap-input{flex:1;min-width:0;width:100%;height:40px;border:1px solid var(--rule);border-radius:12px;padding:0 12px;font:400 14px var(--font);color:var(--ink);background:var(--surface)}
textarea.ap-input{height:auto;padding:10px 12px;resize:vertical}
.ap-input:focus{outline:2px solid var(--blue-soft);border-color:var(--blue)}
.ap-cx{display:inline-grid;color:var(--ink-3)}
.ap-rev{display:grid;margin-top:14px;border-top:1px solid var(--ink)}
.ap-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule-2);animation:aprise var(--d3) var(--out)}
.ap-row.ed{grid-template-columns:1fr auto}
.ap-row:not(.ed):has(.ap-t:only-of-type){}
.ap-row>.ap-t:first-child{grid-column:1/3}
@keyframes aprise{from{opacity:0;transform:translateY(6px)}}
.ap-t{font-size:14.5px;color:var(--ink-3)}
.ap-row.on .ap-t{color:var(--ink)}
.ap-t small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.ap-ck{position:relative;width:22px;height:22px;display:grid}
.ap-ck input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.ap-ck span{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--ink-4);display:grid;place-items:center;color:transparent;transition:background var(--d1),border-color var(--d1)}
.ap-ck input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.ap-ck input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.ap-ck input:disabled+span{opacity:.4}
.ap-ck .i{width:13px;height:13px;stroke-width:2.6}
.ap-cap{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--surface-2)}
.ap-cap .l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3)}
.ap-cap .l b{color:var(--ink);font-weight:600}
.ap-capb{position:relative;display:flex;height:4px;border-radius:2px;background:var(--rule);margin-top:10px;overflow:hidden}
.ap-capb i{display:block;height:100%;background:var(--ink-2);transition:width var(--d3) var(--out)}
.ap-capb i.a{background:var(--blue)}
.ap-capl{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);margin-top:8px}
.ap-capl span{display:inline-flex;align-items:center;gap:5px}
.ap-capl i{width:8px;height:2px;background:var(--ink-2)}
.ap-capl i.a{background:var(--blue)}
.ap-capl span:last-child{margin-left:auto}
.ap-top{margin-top:8px;font-size:12.5px;color:var(--warm);font-weight:600}
.psh .think{margin-top:18px}

@media (max-width:1180px){.pr-sum{grid-template-columns:260px 1fr}}
@media (max-width:760px){
 .psh{top:auto;left:0;right:0;bottom:0;width:auto;max-height:92vh;height:92vh;border-radius:22px 22px 0 0;transform:translateY(30px)}
 .psh-h{padding:12px 16px 0}
 .psh-h h2{font-size:19px}
 .psh-tabs{padding:12px 16px 0}
 .psh-b{padding:14px 16px 24px}
 .psh-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
 .psh-f .btn.ink{flex:1}
 body.psh-on .pbar{opacity:0;pointer-events:none}
 .sc-prompts .pills .btn{margin-left:0}
 .pr-sum{grid-template-columns:1fr}
 .pr-sv{border-right:0;border-bottom:1px solid var(--rule);padding:18px 16px}
 .pr-sv .v{font-size:52px}
 .pr-eg .eng{padding:14px 16px 16px}
 .pr-bar{margin-top:36px}
 .pr-bar .search{max-width:none;flex-basis:100%;order:2}
 .pr-cap{margin-left:auto}
 .pr-tph{grid-template-columns:minmax(0,1fr) auto 16px;gap:6px 12px}
 .pr-tv b{font-size:28px}
 .pr-row{grid-template-columns:20px minmax(0,1fr) 14px;gap:10px}
 .pr-row .pr-e{grid-column:2;grid-row:2}
 .pr-row .pr-e.none,.pr-row>span:empty{display:none}
 .pr-row>.i{grid-column:3;grid-row:1/3}
 .pr-tb .pr-row{padding-left:4px}
 .pr-th{padding-right:34px}
 .prd-eng .r{grid-template-columns:minmax(0,1fr) 80px}
 .prd-pick .seg button span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
 .prd-pick .seg button{padding:6px 14px}
 .ap-capl span:last-child{margin-left:0}
 .pr-fc .fchip{flex:none;padding:0 12px}
}

/* ===== compact summary strip (Denis 2026-10-26: metrics on top, very low) ===== */
.sc-prompts .pq-strip{margin-top:24px;display:grid;grid-template-columns:minmax(0,1.5fr) repeat(4,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.pq-strip>div{padding:14px 18px 14px 0;min-width:0}
.pq-strip>div+div{padding-left:18px;border-left:1px solid var(--rule-2)}
.pq-k{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);white-space:nowrap}
.pq-k .new{margin-left:2px}
.pq-all{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:16px;align-items:end}
.pq-all .pq-k{grid-column:1/3}
.pq-v{font-size:38px;font-weight:300;letter-spacing:-.04em;line-height:1;margin-top:6px}
.pq-v small{font-size:15px;color:var(--ink-3);letter-spacing:0;margin-left:1px}
.pq-sp{padding-bottom:4px}
.pq-sp span{display:block;font-size:12px;color:var(--ink-3);margin-top:6px}
.pq-sp .pr-split{margin:0}
.pq-ev{display:flex;align-items:center;gap:10px;margin-top:8px}
.pq-ev b{font-size:22px;font-weight:400;letter-spacing:-.02em}
.pq-ev b small{font-size:12px;color:var(--ink-3);margin-left:1px}
.pq-ev .tb{flex:1;min-width:0}

/* ===== topics with hierarchy: concept → user questions ===== */
.sc-prompts #pr-body{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.pq-tp{background:var(--surface);border:1px solid var(--rule);border-radius:18px;overflow:hidden}
.pq-th{display:grid;grid-template-columns:44px minmax(0,1fr) auto 18px;gap:16px;align-items:center;width:100%;text-align:left;padding:16px 20px;transition:background var(--d1)}
.pq-th:hover{background:var(--surface-2)}
.pq-th>.i{color:var(--ink-3);transition:transform var(--d2) var(--std)}
.pq-tp.open .pq-th>.i{transform:rotate(180deg)}
.pq-ring{position:relative;width:44px;height:44px;display:grid;place-items:center}
.pq-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.pq-ring circle{fill:none;stroke-width:3}
.pq-ring .bg{stroke:var(--rule)}
.pq-ring .fg{stroke:var(--blue);stroke-linecap:round}
.pq-ring .fg.warm{stroke:var(--warm)}
.pq-ring b{position:relative;font-size:13px;font-weight:600}
.pq-tn{display:flex;flex-direction:column;min-width:0}
.pq-tk{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);font-weight:650}
.pq-tn b{font-size:17px;font-weight:600;letter-spacing:-.01em;margin-top:2px}
.pq-tn .num{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.pq-tr{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--ink-3);white-space:nowrap}
.pq-tb{padding:2px 14px 14px 78px;display:flex;flex-direction:column;gap:6px}
.pq-q{display:grid;grid-template-columns:24px minmax(0,1fr) auto 14px;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface-2);border-radius:12px;padding:12px 14px;border:1px solid transparent;transition:border-color var(--d1),background var(--d1)}
.pq-q:hover{border-color:var(--rule);background:var(--surface)}
.pq-q>.i{color:var(--ink-4)}
.pq-qi{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--ink-3);background:var(--surface);border:1px solid var(--rule-2)}
.pq-q.yes .pq-qi{color:var(--blue)}
.pq-qt b{display:block;font-size:14.5px;font-weight:500;line-height:1.4}
.pq-qm{display:flex;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:12px;color:var(--ink-3)}
.pq-qm>span+span::before{content:"·";margin:0 7px;color:var(--ink-4)}

/* --- js/core.js --- */

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

const FAVS={

 librocloud:['#7c4dff','<path fill="#fff" d="M4 6.6c2.7-.7 5.4-.2 7.4 1.4v11c-2-1.5-4.7-2-7.4-1.4z"/><path fill="#fff" fill-opacity=".62" d="M20 6.6c-2.7-.7-5.4-.2-7.4 1.4v11c2-1.5 4.7-2 7.4-1.4z"/>'],
 kontaro:['#e46b2e','<path fill="#fff" d="M6.5 5h3.4v14H6.5z"/><path fill="#fff" d="M18 5h-4l-4.2 7 4.2 7h4l-4.2-7z"/>'],

 comparasaas:['#0ea5e9','<rect x="6" y="9" width="4.6" height="10" rx="1.4" fill="#fff"/><rect x="13.4" y="5" width="4.6" height="14" rx="1.4" fill="#fff" fill-opacity=".7"/>'],

const fav=(k,cls='')=>{const e=FAVS[String(k).toLowerCase().replace(/\..*$/,'')];if(!e)return '';const w=e[0]==='w';return `<span class="fav ${cls}${w?' w':''}"${w?'':` style="background:${e[0]}"`} aria-hidden="true"><svg viewBox="0 0 24 24">${e[1]}</svg></span>`};

/* ---------- text helpers ---------- */
const hiPath=t=>t.replace(/(^|[\s«(])(\/[a-z0-9][a-z0-9\-\/.]*[a-z0-9])/g,'$1<code class="p">$2</code>');
const engNames=e=>{const n=e.map(k=>ENG[k].n);return n.length>1?n.slice(0,-1).join(', ')+' y '+n.at(-1):n[0]};
const fold=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
/* Source chip. Every recommendation carries exactly one: IA, Google or Agentes. */
function srcChip(s){return s==='google'?`<span class="src">${lg('google',11)}Google</span>`:s==='agent'?`<span class="src ag">${ic('cart')}Agentes</span>`:`<span class="src ia">${ic('sparkles')}IA</span>`}

/* ---------- rolling counter ---------- */
function roll(v,cls=''){return `<span class="roll num ${cls}" aria-label="${v}">${String(v).split('').map(ch=>/\d/.test(ch)?`<span class="col" aria-hidden="true"><span data-d="${ch}">${'0123456789'.split('').map(d=>`<i>${d}</i>`).join('')}</span></span>`:`<span class="st" aria-hidden="true">${ch}</span>`).join('')}</span>`}
function setRoll(el,v){if(!el)return;const t=document.createElement('span');t.innerHTML=roll(v);const n=t.firstElementChild;n.className=el.className;const old=$$('.col>span',el).map(s=>+s.dataset.d);el.replaceWith(n);
 $$('.col>span',n).forEach((s,k)=>{s.style.transition='none';s.style.transform=`translateY(-${old[k]??0}em)`;void s.offsetHeight;s.style.transition=RM.matches?'none':'';s.style.transform=`translateY(-${s.dataset.d}em)`});return n}

/* ---------- ticks (dial + accents only) ---------- */
function ticks(n,on,{cls='',id=''}={}){let h='';for(let i=0;i<n;i++)h+=`<i class="${i<on?'on':''}" style="--td:${i*14}ms"></i>`;return `<div class="tk ${cls}" ${id?`id="${id}"`:''} aria-hidden="true">${h}</div>`}

/* ---------- thin bar with end marker ---------- */
function bar(v,{max=100,cls='',color='',delay=0,label=''}={}){const w=Math.max(0,Math.min(100,v/max*100));return `<div class="tb ${cls}" style="--w:${w}%;--bd:${delay}ms${color?`;--c:${color}`:''}" ${label?`role="img" aria-label="${label}"`:'aria-hidden="true"'}><i></i><b></b></div>`}

/* Arms rolls, ticks and bars inside root. animate=false paints the final frame at once. */
function armMotion(root,animate){const now=!animate||RM.matches;
 $$('.roll',root).forEach(r=>$$('.col>span',r).forEach((s,k)=>{const d=+s.dataset.d;if(now){s.style.transition='none';s.style.transform=`translateY(-${d}em)`;return}
  s.style.transition='none';s.style.transform='translateY(0)';s.style.setProperty('--rd',(k*60)+'ms');void s.offsetHeight;s.style.transition='';requestAnimationFrame(()=>requestAnimationFrame(()=>{s.style.transform=`translateY(-${d}em)`}))}));
 const lit=$$('.tk,.dial,.tb',root);
 if(now){lit.forEach(e=>{e.classList.add('lit');e.style.transition='none';$$('*',e).forEach(x=>x.style.transition='none')});requestAnimationFrame(()=>lit.forEach(e=>{e.style.transition='';$$('*',e).forEach(x=>x.style.transition='')}))}
 else requestAnimationFrame(()=>requestAnimationFrame(()=>lit.forEach(e=>e.classList.add('lit'))))}

/* ---------- dial (101 ticks, 270 degrees) ---------- */
function dial(score,{bands=[40,70]}={}){const cx=150,cy=150;let g='';
 for(let i=0;i<=100;i++){const a=(135+i*2.7)*Math.PI/180,mj=i%10===0,zone=bands.includes(i)||i===0||i===100;const r1=140,r0=zone?118:mj?124:129;
  g+=`<line class="t ${i<=score?'on':''} ${mj?'mj':''}" style="--d:${i*9}ms" x1="${(cx+r0*Math.cos(a)).toFixed(2)}" y1="${(cy+r0*Math.sin(a)).toFixed(2)}" x2="${(cx+r1*Math.cos(a)).toFixed(2)}" y2="${(cy+r1*Math.sin(a)).toFixed(2)}"/>`}
 [0,...bands,100].forEach(v=>{const a=(135+v*2.7)*Math.PI/180,r=104;g+=`<text class="lbl" x="${(cx+r*Math.cos(a)).toFixed(1)}" y="${(cy+r*Math.sin(a)+3.5).toFixed(1)}" text-anchor="middle">${v}</text>`});
 const a=(135+score*2.7)*Math.PI/180;g+=`<line class="needle" x1="${(cx+112*Math.cos(a)).toFixed(1)}" y1="${(cy+112*Math.sin(a)).toFixed(1)}" x2="${(cx+148*Math.cos(a)).toFixed(1)}" y2="${(cy+148*Math.sin(a)).toFixed(1)}"/>`;
 return `<svg class="dial" viewBox="0 0 300 300" role="img" aria-label="Puntuación GEO ${score} de 100">${g}</svg>`}
/* small tick ring (accent): e.g. agentic score */
function tickRing(v,label){const cx=60,cy=60;let g='';for(let i=0;i<60;i++){const a=(-90+i*6)*Math.PI/180,on=i<Math.round(v*.6);g+=`<line class="t ${on?'on':''}" style="--d:${i*12}ms" x1="${(cx+44*Math.cos(a)).toFixed(1)}" y1="${(cy+44*Math.sin(a)).toFixed(1)}" x2="${(cx+54*Math.cos(a)).toFixed(1)}" y2="${(cy+54*Math.sin(a)).toFixed(1)}"/>`}

/* thin line chart */
function lineChart(vals,dates,{min=44,max=68,grid=[45,55,65],w=560,h=170,label=''}={}){const L=26,R=14,T=12,B=26;const Y=v=>T+(1-(v-min)/(max-min))*(h-T-B),X=i=>L+i*(w-L-R)/(vals.length-1);
 let s=grid.map(v=>`<line x1="${L}" x2="${w-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule-2)"/><text class="ax" x="${L-8}" y="${Y(v)+3.5}" text-anchor="end">${v}</text>`).join('');

/* four-segment ring: one arc per component, sized by its weight, filled by its points */
function agxRing(size=200,{stroke=12,deep=false}={}){const r=size/2-stroke/2-2,c=size/2,C=2*Math.PI*r,gap=C*.014;let off=0;
 const segs=AGX.comps.map((x,i)=>{const L=C*x.w/100-gap,f=L*x.p/x.w;const warm=x.p/x.w<.5;
  const s=`<circle cx="${c}" cy="${c}" r="${r}" class="trk" stroke-width="${stroke}" stroke-dasharray="${L.toFixed(1)} ${C.toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}"/><circle cx="${c}" cy="${c}" r="${r}" class="fil ${warm?'warm':''}" stroke-width="${stroke}" stroke-dasharray="${f.toFixed(1)} ${C.toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" style="--f:${f.toFixed(1)}px;--C:${C.toFixed(1)}px;--k:${i}"/>`;off+=L+gap;return s}).join('');
 return `<span class="agx-ring blit ${deep?"ondeep":""}" style="width:${size}px;height:${size}px" role="img" aria-label="Visibilidad agéntica ${AGX.score} de 100: ${AGX.comps.map(x=>`${x.n} ${x.p} de ${x.w}`).join(', ')}"><svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><g transform="rotate(-90 ${c} ${c})">${segs}</g></svg><span class="n"><b class="num">${roll(AGX.score)}</b><small>de 100</small></span></span>`}

/* ---------- hero: «Cuadro claro» (Denis 2026-10-27). Bands and the PageSpeed-
   style shapes (triangle, square, circle) people already know. ---------- */
const aghSt=x=>{const r=x.p/x.w;return r>=.75?['ok','Bien']:r>=.5?['mid','Mejorable']:['bad','Se frena']};
const aghPct=x=>Math.round(x.p/x.w*100);
const aghBand=v=>v>=75?['ok','Bien']:v>=50?['mid','Mejorable']:['bad','Se frena'];
const AGH_SHAPE='<i class="sh" aria-hidden="true"></i>';

/* ---------- the cluster: a car-style instrument cluster on the page's own
   surface (Denis asked for more wow, then a lighter version of it).
   On arrival it does an ignition check: every warning light flashes once,
   the big needle sweeps to 100 and settles on the score, then the four
   small dials follow. It plays once per arrival, never in a loop, and has no replay control; with
   reduced motion everything sits in its final state. ---------- */
const CK_SW=270,CK_A0=135;
const ckPt=(cx,cy,r,f)=>{const t=(CK_A0+CK_SW*f)*Math.PI/180;return [cx+r*Math.cos(t),cy+r*Math.sin(t)]};
const ckArc=(cx,cy,r,f0,f1)=>{const [x0,y0]=ckPt(cx,cy,r,f0),[x1,y1]=ckPt(cx,cy,r,f1);return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${(f1-f0)*CK_SW>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`};
const ckDeg=v=>(CK_A0+CK_SW*v/100).toFixed(1)+'deg';
function ckMain(v,to){const c=160,r=118,full=ckArc(c,c,r,0,1);
 const ticks=Array.from({length:51},(_,i)=>{const f=i/50,mj=i%5===0,[x0,y0]=ckPt(c,c,r+14,f),[x1,y1]=ckPt(c,c,r+(mj?26:20),f);return `<line class="${mj?'mj':''} ${i<=v/2?'on':''}" style="--k:${i}" x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}"/>`}).join('');
 const lab=[0,20,40,60,80,100].map(n=>{const [x,y]=ckPt(c,c,r+42,n/100);return `<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle">${n}</text>`}).join('');
 const zone=(a,b,cl)=>`<path class="z ${cl}" d="${ckArc(c,c,r+8,a/100,b/100)}"/>`;
 const [tx,ty]=ckPt(c,c,r+8,to/100),[lx,ly]=ckPt(c,c,r-30,to/100);
 return `<div class="ck-main"><span class="ck-sweep" aria-hidden="true"></span><svg viewBox="0 0 320 300" aria-hidden="true">
  <defs><linearGradient id="ckg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#3d7bff"/><stop offset="1" stop-color="#7fd8ff"/></linearGradient>
  <filter id="ckb" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter></defs>
  <g class="tk">${ticks}</g>${lab}
  ${zone(0,49.4,'bad')}${zone(50.6,74.4,'mid')}${zone(75.6,100,'ok')}
  <path class="trk" d="${full}"/>
  <path class="val gl" d="${full}" pathLength="100" filter="url(#ckb)"/>
  <path class="val" d="${full}" pathLength="100"/>
  <g class="tgt"><circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="4"/><text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle">${to}</text></g>
  <g class="ndl"><line x1="${c}" y1="${c}" x2="${c+r-16}" y2="${c}"/><circle class="tip" cx="${c+r-16}" cy="${c}" r="3.5"/></g>
  <circle class="hub" cx="${c}" cy="${c}" r="11"/><circle class="hub2" cx="${c}" cy="${c}" r="4"/></svg>
  <div class="rd"><b class="num">${v}</b><small>de 100</small><span>Visibilidad agéntica</span></div></div>`}
function ckSmall(x,i){const pc=aghPct(x),[cl,w]=aghSt(x),c=60,r=44,full=ckArc(c,c,r,0,1);
 const ticks=Array.from({length:11},(_,k)=>{const [x0,y0]=ckPt(c,c,r+7,k/10),[x1,y1]=ckPt(c,c,r+12,k/10);return `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}"/>`}).join('');
 return `<a class="ck-sm ${cl}" href="#agaudit" data-act="agxComp" data-arg="${x.k}" style="--v:${pc};--av:${ckDeg(pc)};--d:${(1.5+i*.14).toFixed(2)}s" aria-label="${x.n}: ${pc} de 100, ${w}">
  <span class="dl"><svg viewBox="0 0 120 112" aria-hidden="true"><g class="tk">${ticks}</g><path class="trk" d="${full}"/><path class="val" d="${full}" pathLength="100"/>
  <g class="ndl"><line x1="${c}" y1="${c}" x2="${c+r-8}" y2="${c}"/></g><circle class="hub" cx="${c}" cy="${c}" r="5"/></svg>
  <span class="in"><b class="num">${pc}</b></span></span>
  <b class="nm">${x.n}</b><span class="st">${AGH_SHAPE}${w}</span></a>`}
function ckLights(){const L=[...AGX.comps.map(x=>{const [cl]=aghSt(x),bad=(AGX_CHK[x.k]||[]).find(c=>c[0]!=='ok');return {k:x.k,ico:x.ico,cl,t:x.n,s:bad?bad[1]:'Todo bien'}}),{k:'interop',ico:'plug',cl:'mid',t:'Interoperabilidad',s:'Conexión directa de agentes a tu tienda'}];
 return `<div class="ck-lights" role="list" aria-label="Testigos">${L.map((l,i)=>`<a role="listitem" class="lt ${l.cl}" href="#agaudit" data-act="agxComp" data-arg="${l.k}" style="--i:${i}"><span class="bulb">${ic(l.ico)}</span><span class="tx"><b>${l.t}</b><small>${l.s}</small></span></a>`).join('')}</div>`}
function ckBlock(){const S=AGX.score,T=AGX.to,[sc]=aghBand(S),c=AGX.comps;
 return `<section class="sec" aria-label="Visibilidad agéntica"><div class="card ck blit ck-lt" style="--v:${S};--av:${ckDeg(S)};--a0:${ckDeg(0)};--a100:${ckDeg(100)};--avlo:${ckDeg(S-5)}">
  <span class="agh-tab">${ic('agent','sm')}Visibilidad agéntica</span>
  <div class="ck-clu"><div class="ck-side">${ckSmall(c[0],0)}${ckSmall(c[1],1)}</div>${ckMain(S,T)}<div class="ck-side">${ckSmall(c[2],2)}${ckSmall(c[3],3)}</div></div>
  ${ckLights()}
  <div class="ck-ft"><div><h2>${AGH_H}</h2></div><button class="btn ck-btn" data-route="agaudit">Ver la auditoría${ic('arrowr','sm')}</button></div>
 </div></section>`}
function ckIgnite(root,play){const el=$('.ck',root);if(!el)return;if(!play||RM.matches){el.classList.add('done');return}
 el.classList.remove('go','done');void el.offsetWidth;el.classList.add('go')}

/* ================= SCREEN: Auditoría técnica =================
   Two blocks: «Auditoría GEO» (¿te puede citar la IA?) and «Auditoría SEO»

function auArc(v,to,size=132){const r=size/2-8,c=size/2,C=2*Math.PI*r,span=.75*C;const a=span*v/100,g=span*(to-v)/100;
 return `<span class="sc-au-arc blit" style="width:${size}px;height:${size}px;--a:${a.toFixed(1)};--g:${g.toFixed(1)};--C:${C.toFixed(1)}"><svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><g transform="rotate(135 ${c} ${c})">
  <circle class="tr" cx="${c}" cy="${c}" r="${r}" stroke-dasharray="${span.toFixed(1)} ${C.toFixed(1)}"/>
  <circle class="gh" cx="${c}" cy="${c}" r="${r}" stroke-dasharray="0 ${C.toFixed(1)}" style="stroke-dashoffset:${(-a).toFixed(1)}"/>
  <circle class="now" cx="${c}" cy="${c}" r="${r}" stroke-dasharray="0 ${C.toFixed(1)}"/></g></svg>
  <span class="n"><b class="num">${roll(v)}</b><small>/100</small></span></span>`}

/* ================= SCREENS: entry (login, signup, forgot, MFA) · builder C =================
   The GenScore lockup, then the form, over a quiet animated background.
   Two steps: email, then password. Full screen: the shell hides itself
   with :has(). */
/* Bruma, chosen by Denis 2026-10-27 over nine alternatives: the flowing
   hairlines of Síntesis 4's sign-in, barely there behind the form. The
   effect is ambient: it never claims a measurement and reacts only to the
   form. Typing makes the lines flow a touch faster; opening the account
   tints them blue. It stands still under prefers-reduced-motion, and the
   loop stops when its canvas leaves the page. */
const AU_N=72;
const AUFX={en:0,st:0};
const auLock=()=>`<div class="au-lock"><svg viewBox="0 0 285 292" aria-hidden="true"><use href="#e-gs"/></svg><span>GenScore</span></div>`;
const auCss=(n,d)=>getComputedStyle(document.documentElement).getPropertyValue(n).trim()||d;
function auHex(c){const m=c.match(/^#([0-9a-f]{6})$/i);if(!m)return [120,130,150];const n=parseInt(m[1],16);return [n>>16&255,n>>8&255,n&255]}
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a.toFixed(3)})`;
function auCanvas(cv,draw){const ctx=cv.getContext('2d');let w=0,h=0,dpr=1,t0=performance.now(),k=0,col={};
 const size=()=>{const r=cv.getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);w=r.width;h=r.height;cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};
 const pal=()=>{col={ink:auHex(auCss('--ink','#0b1220')),blue:auHex(auCss('--blue','#2563eb'))}};size();pal();
 const frame=now=>{if(!cv.isConnected)return;const r=cv.getBoundingClientRect();if(Math.abs(r.width-w)>1||Math.abs(r.height-h)>1)size();if(++k%40===0)pal();
  ctx.clearRect(0,0,w,h);draw(ctx,w,h,now-t0,col);AUFX.en*=.965;if(!RM.matches)requestAnimationFrame(frame)};
 requestAnimationFrame(frame)}
function auMist(sc){const cv=$('.au-cv',sc);let ph=0,last=0,tint=0;
 auCanvas(cv,(c,w,h,t,col)=>{const dt=last?Math.min(50,t-last):16;last=t;ph+=dt*.00034*(1+AUFX.en*2.5);tint+=((AUFX.st===2?1:0)-tint)*.04;
  const n=13,amp=Math.min(h,w*1.2),step=8;
  for(let i=0;i<n;i++){const k=i/n;c.beginPath();
   for(let x=0;x<=w+step;x+=step){const u=x/w,y=h*.5+Math.sin(u*3.1+ph+k*2.4)*amp*.15*(1-k*.4)+Math.cos(u*6.6-ph*.7+k*5)*amp*.035+(k-.5)*h*.78;x===0?c.moveTo(x,y):c.lineTo(x,y)}
   const a=(.05+k*.15)*(1+AUFX.en*.6),base=col.ink.map((v,j)=>Math.round(v+(col.blue[j]-v)*Math.max(tint,.18))),g=c.createLinearGradient(0,0,w,0);
   g.addColorStop(0,rgba(base,a*.35));g.addColorStop(.5,rgba(base,a));g.addColorStop(1,rgba(base,a*.45));
   c.strokeStyle=g;c.lineWidth=.6+k*1.05;c.stroke()}})}
/* the form's state: 0 email, 1 email accepted, 2 account opened */
function auSetRing(lit,done){const st=done?2:lit>0?1:0,sc=$('.sc-auth');if(st>AUFX.st)AUFX.en=1;AUFX.st=st;if(sc)sc.dataset.st=st}
const auShell=(inner,{dots=0,cls=''}={})=>`<div class="sc-full sc-auth ${cls}"><canvas class="au-cv" aria-hidden="true"></canvas><div class="au-col">${auLock()}${inner}</div></div>`;

const auEye=`<button type="button" class="au-eye" data-act="cEye" aria-label="Mostrar contraseña" aria-pressed="false">${ic('eye','sm')}</button>`;

/* ---------- evolution chart: average position, 1º at the top ---------- */
function cpEvoSvg(){const m=MOB.matches,W=m?380:760,H=m?260:300,L=m?26:34,Rr=m?92:112,T=14,B=30,X=i=>L+i*(W-L-Rr)/7,Y=v=>T+(v-1)/(5-1)*(H-T-B);
 let g=[1,2,3,4,5].map(v=>`<line x1="${L}" x2="${W-Rr+8}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule-2)"/><text class="ax" x="${L-10}" y="${Y(v)+3.5}" text-anchor="end">${v}º</text>`).join('');
 g+=CP_EVO.dates.map((d,i)=>`<line x1="${X(i)}" x2="${X(i)}" y1="${H-B}" y2="${H-B+5}" stroke="var(--ink-4)"/>${m&&i%2?'':`<text class="ax" x="${X(i)}" y="${H-8}" text-anchor="middle">${d}</text>`}`).join('')+`<line x1="${L}" x2="${W-Rr+8}" y1="${H-B}" y2="${H-B}" stroke="var(--ink-4)"/>`;
 const on=CP_EVO.s.filter(([n])=>!U.cpOff[n]);
 /* end labels, nudged apart so they never collide */
 const lab=on.map(([n,v])=>({n,v:v.at(-1),y:Y(v.at(-1))})).sort((a,b)=>a.y-b.y);for(let i=1;i<lab.length;i++)if(lab[i].y-lab[i-1].y<16)lab[i].y=lab[i-1].y+16;
 on.slice().sort((a,b)=>(a[0]==='Nubaria')-(b[0]==='Nubaria')).forEach(([n,v])=>{const [c,da,w]=CP_STY[n];const pts=v.map((y,i)=>`${X(i).toFixed(1)},${Y(y).toFixed(1)}`).join(' ');const me=n==='Nubaria';
  g+=`<polyline class="cp-ln" points="${pts}" fill="none" stroke="${c}" stroke-width="${w}" ${da?`stroke-dasharray="${da}"`:''} stroke-linejoin="round" stroke-linecap="round"/>`;
  g+=me?v.map((y,i)=>`<circle cx="${X(i)}" cy="${Y(y)}" r="${i===7?4:2.5}" fill="${i===7?c:'var(--surface)'}" stroke="${c}" stroke-width="1.5"/>`).join(''):`<circle cx="${X(7)}" cy="${Y(v.at(-1))}" r="2.5" fill="${c}"/>`});
 lab.forEach(l=>{const me=l.n==='Nubaria';g+=`<text class="cp-el ${me?'me':''}" x="${X(7)+12}" y="${l.y+4}">${l.n} <tspan class="v">${fmtD(l.v)}º</tspan></text>`});
 const sum=on.map(([n,v])=>`${n} del ${fmtD(v[0])}º al ${fmtD(v.at(-1))}º`).join('; ');
 return `<svg class="cp-evo" viewBox="0 0 ${W} ${H}" role="img" aria-label="Puesto medio en los últimos 8 escaneos: ${sum}">${g}</svg>`}

/* ---------- one ranking: mentions and citations side by side (Denis 2026-10-26) ---------- */
function cxRank(cs){const mx=Math.max(...cs.map(c=>c.m)),cx=Math.max(...cs.map(c=>CP_X[c.n].cite));

  <span class="mt"><i>Citas</i><b class="num">${x.cite}<small>%</small></b>${bar(x.cite,{max:cx*1.08,cls:'thin nomark '+(c.you?'':'ink'),delay:i*60+40})}</span>

function cxHeat(cs){return `<div class="cx-hm" role="table" aria-label="Porcentaje de respuestas de cada motor que nombran a cada marca"><div class="cx-hr h" role="row"><span role="columnheader"></span>${EK.map(k=>`<span role="columnheader">${lg(k,14)}<em>${ENG[k].n}</em></span>`).join('')}</div>

/* ---------- share of voice: every number carries its label ---------- */
function cpSov(){const cs=cpComps();const tot=cs.reduce((a,c)=>a+CP_X[c.n].sov,0);
 const seg=cs.map((c,i)=>{const x=CP_X[c.n];const w=x.sov/tot*100;return `<div class="cp-sg ${c.you?'me':''}" style="flex:${x.sov}"><i style="--bd:${i*80}ms"></i><span class="cp-sgl"><b class="num">${x.sov}%</b><span>${c.n}</span></span></div>`}).join('');
 return `<div class="cp-stack" role="img" aria-label="Cuota de voz: ${cs.map(c=>c.n+' '+CP_X[c.n].sov+'%').join(', ')}">${seg}</div>
 <div class="cp-sovt"><div class="cp-sh" aria-hidden="true"><span>Marca</span><span>Mención</span><span>Citas</span><span>Cuota de voz</span><span>vs. escaneo anterior</span></div>
 ${cs.map(c=>{const x=CP_X[c.n];return `<div class="cp-sr2 ${c.you?'me':''}"><span class="who">${aFav(c.n)}<span><b>${c.n}</b>${c.you?'<span class="you">Tú</span>':''}<span class="mono">${x.d}</span></span></span>

  <span class="st d"><i>vs. anterior</i><b class="num ${c.dt>0?'up':c.dt<0?'down':''}">${c.dt>0?'+'+c.dt+' pt':c.dt<0?'−'+(-c.dt)+' pt':'Igual'}</b></span></div>`}).join('')}</div>

   Fiction only (Nubaria and rivals). The b* helpers below are candidates for core.js:

/* ---------- one-shot «lit» for screen-specific motion (.blit) ---------- */
function bLight(root,first){const now=!first||RM.matches;const els=$$('.blit',root);
 if(now){els.forEach(e=>{e.style.transition='none';$$('*',e).forEach(x=>x.style.transition='none');e.classList.add('lit')});requestAnimationFrame(()=>els.forEach(e=>{e.style.transition='';$$('*',e).forEach(x=>x.style.transition='')}));return true}

/* ---------- count a decimal from a to b once (used by the ladder numeral) ---------- */
function bCount(el,a,b,ms=600){if(!el)return;if(RM.matches){el.textContent=bF1(b);return}const t0=performance.now();
 const step=t=>{const k=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-k,3);el.textContent=bF1(a+(b-a)*e);if(k<1&&el.isConnected)requestAnimationFrame(step)};requestAnimationFrame(step)}

/* ---------- thin line chart. invert=true puts 1 at the top (Google positions) ---------- */
function bLine(vals,{min,max,invert=false,w=560,h=170,grid=[],xl=[],label='',fmt=bF1,dash=null,color='var(--blue)'}={}){
 const L=30,Rr=16,T=14,B=xl.length?24:10;const n=vals.length;
 const Y=v=>{const k=(v-min)/(max-min);return T+(invert?k:1-k)*(h-T-B)},X=i=>L+i*(w-L-Rr)/(n-1);
 let s=grid.map(v=>`<line x1="${L}" x2="${w-Rr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--rule-2)"/><text class="ax" x="${L-8}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end">${fmt(v).replace(/,0$/,'')}</text>`).join('');
 xl.forEach(([i,t,a])=>{s+=`<text class="ax" x="${X(i).toFixed(1)}" y="${h-6}" text-anchor="${a||'middle'}">${t}</text>`});
 const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
 if(dash)s+=`<polyline points="${dash.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--ink-4)" stroke-width="1.4" stroke-dasharray="3 4"/>`;
 s+=`<polyline class="ln" points="${pts}" fill="none" stroke="${color}" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/>`;
 if(!dash){s+=vals.map((v,i)=>i===n-1?`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="4" fill="${color}"/>`:'').join('');
  s+=`<text class="ax s" x="${X(n-1).toFixed(1)}" y="${(Y(vals.at(-1))-10).toFixed(1)}" text-anchor="end">${fmt(vals.at(-1))}</text>`}
 return `<svg class="bline" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}">${s}</svg>`}

function gStrip(){const W=560,H=120,L=8,Rr=8;const X=p=>L+(p-1)/29*(W-L-Rr);const pts=[...GQS.map(q=>[q[1],q[3],1]),[3.2,900],[7.5,1400],[9.4,620],[14.8,2100],[16.2,1300],[13.1,3100],[19.5,880],[22.4,1700],[25.1,600],[27.8,420],[23.9,2400],[4.4,300],[15.5,420],[28.6,1100]];
 let s=`<rect x="${X(10.5)}" y="8" width="${X(20.5)-X(10.5)}" height="76" rx="6" fill="var(--blue-tint)"/>`;
 [[1,10.5,'Página 1'],[10.5,20.5,'Página 2'],[20.5,30,'Página 3 o más']].forEach(([a,b,t],k)=>{s+=`<text class="ax ${k===1?'s':''}" x="${(X(a)+X(b))/2}" y="${H-16}" text-anchor="middle">${t}</text>`});

 s+=pts.map(([p,v,k],i)=>`<circle cx="${X(p).toFixed(1)}" cy="${(46+((i*37)%30)-15).toFixed(1)}" r="${(2.5+Math.sqrt(v)/16).toFixed(1)}" fill="${p>10.5&&p<=20.5?'var(--blue)':'var(--ink-4)'}" fill-opacity="${k?.9:.5}"/>`).join('');
 return `<svg class="bline" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tus búsquedas según su puesto: 38% en la página 1, 41% en la página 2 y 21% en la página 3 o más">${s}</svg>`}
function gTable(){const f=U.g.qf,{k,d}=U.g.qs;const idx={q:0,pos:1,clk:2,imp:3}[k];

 const th=(key,l,r)=>{const on=k===key;return `<th class="${r?'r':''} ${key==='q'?'stk':''}" aria-sort="${on?(d>0?'ascending':'descending'):'none'}"><button data-act="gSort" data-arg="${key}">${l}<span class="ar" aria-hidden="true">${on?(d>0?'↑':'↓'):'↕'}</span></button></th>`};

 <div class="sc-g-topics">${GTOPICS.map((t,i)=>`<button class="tp" data-act="gTopic" data-arg="${i}"><span class="n"><b>${t.n}</b><span>${t.kw} palabras · ${t.pg?`<code class="p">${t.pg}</code>`:'Sin página en el Top 20'}</span></span><span class="sp">${gSpark(t.h)}</span><span class="pv num">${t.pos!=null?`<b>${bF1(t.pos)}</b><small>puesto medio</small>`:`<b class="na">·</b><small>sin foto</small>`}</span><span class="dt">${t.pos!=null?gDelta(t.prev,t.pos):''}</span>${ic('chevr','sm')}</button>`).join('')}</div>

/* --- screens/mission.js --- */
/* ================= SCREEN: Primer escaneo (builder C) =================
   Full-screen mission. The counter is the honest part: answers read, per
   engine and in total, like the core scan counter. The pendulums (one per
   engine) are ambient, never progress: core's penObserve stops them off
   screen and with the tab hidden, and reduced motion freezes them. The
   phase names come from the counter, not from a clock. */
let msTimer=null;
const MS_PH=[
 ['En la rampa','Preparando tu primer escaneo','Tú no tienes que hacer nada.'],
 ['Ignición','Motores encendidos','{n} a la vez. Sí, se puede.'],
 ['Ascenso','Preguntando a cada motor','Puedes cerrar esta pestaña. Esto no se cae.'],
 ['En órbita','Leyendo las respuestas','Leemos menciones, puestos y citas.'],
 ['Cerrando la misión','Casi está','Calculando tu Puntuación GEO.']];
function msState(){if(!U.cMs)U.cMs={total:136,engs:4,dom:'nubaria.es',got:0};const m=U.cMs;if(!m.per)m.per=Array(m.engs).fill(0);return m}
const msKeys=m=>EK.slice(0,m.engs);
function msPhase(m){if(m.done)return 5;if(m.got>=m.total)return 4;if(m.got===0)return 0;const f=m.got/m.total;return f<.08?1:f<.5?2:3}
function msPend(keys){const W=keys.length*100;let g=`<line class="rail" x1="10" x2="${W-10}" y1="8" y2="8"/>`;keys.forEach((k,i)=>{const x=50+i*100;g+=`<path class="arc" d="M${x-38} 88 A88 88 0 0 0 ${x+38} 88"/><g id="pd${i}" data-x="${x}"><line class="str" x1="${x}" y1="8" x2="${x}" y2="96"/><circle class="bob" cx="${x}" cy="96" r="13"/><use href="#e-${k}" x="${x-7}" y="89" width="14" height="14" style="color:var(--ink)"/></g><circle cx="${x}" cy="8" r="2" fill="var(--ink-3)"/>`});
 return `<svg viewBox="0 0 ${W} 118" aria-hidden="true">${g}</svg>`}
SCREENS.mission={title:'Primer escaneo',render(){const m=msState(),keys=msKeys(m),ph=msPhase(m),per=m.total/m.engs;
 const P=MS_PH[Math.min(ph,4)];const nW=m.engs===4?'Los cuatro':'Los tres';
 return `<div class="sc-full sc-mission" aria-live="polite">
 <header class="ms-top"><span class="wz-brand ms-brand"><svg aria-hidden="true"><use href="#e-gs"/></svg>GenScore</span><span class="ms-dom">${ic('checkc','sm')}<span class="mono">${m.dom}</span> dado de alta</span><span style="flex:1"></span><a class="btn ghost sm" href="#overview" data-route="overview">Salir${ic('arrowr','sm')}</a></header>
 <div class="ms-body">
  <div class="ms-ey"><span class="pulse"></span><span id="ms-ph">${ph===5?'Misión cumplida':P[0]}</span></div>
  <div class="ms-n" id="ms-n">${roll(m.got)}<span class="of num">de ${m.total}</span></div>
  <div class="ms-u">respuestas leídas</div>
  ${ticks(68,Math.floor(m.got/m.total*68),{id:'ms-tk',cls:'ms-tk'})}
  <p class="ms-s" id="ms-s">${ph===5?'Tu primer escaneo está listo.':ph>=4?`<span class="shimmer">${P[2]}</span>`:P[2].replace('{n}',nW)}</p>
  <div class="card pend ms-pend">${msPend(keys)}<div class="ms-pl" style="grid-template-columns:repeat(${m.engs},1fr)">${keys.map((k,i)=>`<span><b>${ENG[k].n}</b><span class="num" id="ms-e${i}">${m.per[i]} de ${per}</span>${k==='perplexity'?'<span class="new">Nuevo</span>':''}</span>`).join('')}</div></div>
  <ol class="ms-beats" aria-label="Fases">${MS_PH.map((x,i)=>`<li class="${i<ph?'done':i===ph?'on':''}"><i></i>${x[0]}</li>`).join('')}</ol>
  <div class="ms-end" id="ms-end" ${ph===5?'':'hidden'}><a class="btn blue" href="#overview" data-route="overview">Ver tus resultados${ic('arrowr','sm')}</a></div>
  <p class="ms-note">Un escaneo de verdad tarda unos minutos. Puedes cerrar la pestaña: seguimos solos y te avisamos por correo.</p>
 </div></div>`},
 after(){clearInterval(msTimer);const m=msState();if(m.done)return;msTimer=setInterval(msTick,RM.matches?400:1100)}};
function msTick(){if(R.route!=='mission'){clearInterval(msTimer);msTimer=null;return}if(document.hidden)return;
 const m=msState(),keys=msKeys(m),per=m.total/m.engs;const prev=msPhase(m);
 if(m.got>=m.total){if(!m.fin){m.fin=1;return}m.done=1;clearInterval(msTimer);msTimer=null;render(false);return}
 if(m.wait===undefined){m.wait=2;}if(m.wait>0){m.wait--;return}
 let add=1+Math.floor(Math.random()*4);while(add-->0&&m.got<m.total){const open=m.per.map((v,i)=>v<per?i:-1).filter(i=>i>-1);const i=open[Math.floor(Math.random()*open.length)];m.per[i]++;m.got++}
 const n=$('#ms-n .roll');if(n)setRoll(n,m.got);keys.forEach((k,i)=>{const e=$('#ms-e'+i);if(e)e.textContent=`${m.per[i]} de ${per}`});
 const tk=$('#ms-tk');if(tk)$$('i',tk).forEach((x,i)=>x.classList.toggle('on',i<Math.floor(m.got/m.total*68)));
 const ph=msPhase(m);if(ph!==prev){const P=MS_PH[ph];$('#ms-ph').textContent=P[0];$('#ms-s').innerHTML=ph>=4?`<span class="shimmer">${P[2]}</span>`:P[2].replace('{n}',m.engs===4?'Los cuatro':'Los tres');$$('.ms-beats li').forEach((l,i)=>{l.className=i<ph?'done':i===ph?'on':''})}}

 if(a.step===1){b=`<p class="ap-sub">${sub}</p><div class="ap-ms">${AP_M.map(([k,i,t,d])=>`<button class="ap-m" data-act="apm" data-arg="${k}">${ic(i)}<span><b>${t}</b><span>${d}</span></span>${ic('arrowr','sm')}</button>`).join('')}</div>${apCap(0)}`}
 else if(a.step===2){const m=AP_M.find(x=>x[0]===a.m);

   a.m==='kw'?`<label class="ap-lbl" for="ap-kw">Palabras clave</label><div class="ap-in"><input id="ap-kw" class="ap-input" placeholder="p. ej. precios, integraciones" data-autofocus><button class="btn line sm" data-act="apkw">Añadir</button></div><div class="pills">${a.kw.map((k,i)=>`<span class="chip">${esc(k)}<button data-act="apkwdel" data-arg="${i}" aria-label="Quitar ${esc(k)}" class="ap-cx">${ic('x','sm')}</button></span>`).join('')}</div>`:
   `<label class="ap-lbl" for="ap-man">Nuevo prompt</label><textarea id="ap-man" class="ap-input" rows="3" placeholder="Escribe el prompt completo" data-autofocus></textarea><button class="btn line sm" data-act="apmanadd" style="margin-top:10px" ${apFree()-a.man.length<=0?'disabled':''}>${ic('plus','sm')}Añadir a la lista</button>
    ${a.man.length?`<div class="ap-rev" style="margin-top:16px">${a.man.map((t,i)=>`<div class="ap-row on"><span class="ap-t">${esc(t)}</span><button class="navb sm" data-act="apmandel" data-arg="${i}" aria-label="Quitar prompt">${ic('x','sm')}</button></div>`).join('')}</div>`:''}`)+apCap(a.m==='man'?a.man.length:0);
  f=a.m==='man'?`<button class="btn ink" data-act="apaddman" ${a.man.length?'':'disabled'}>Añadir ${a.man.length||''} prompt${a.man.length===1?'':'s'}</button>`:`<button class="btn ink" data-act="apgo" ${a.busy?'disabled':''} ${a.m==='kw'&&!a.kw.length?'disabled':''}>${a.busy?'<span class="shimmer">Generando…</span>':ic('sparkles','sm')+'Generar prompts'}</button>`}

const RES=[['Ya lo tienes','Contenido comparativo','Publica una página comparativa Nubaria vs Factulia','Ya tienes una comparativa con este competidor:','nubaria.es/comparativas/factulia'],['Resuelta sola','Respuesta directa','Publica una página de precios con una tabla clara','Confirmado el 4 oct.'],['Hecha','Técnico','Permite el acceso a GPTBot en robots.txt','Marcada el 2 oct.']];

/* --- screens/recs.js --- */
/* ================= SCREEN: Recomendaciones =================
   Plan of the week as a deck (focus mode), «Más adelante» at real scale:
   lever pills, search, source filters, groups of 3 + «Ver N más», compact
   rows, and «Abrir en foco» for any filtered set. */
Object.assign(U,{recIdx:0,done:{},gen:{},qs:{},ltab:'pend',q:'',f:'all',lever:null,row:null,inl:null,more:{},deck:null,fdeck:null});
const ALLRECS=[...PLAN,...LATER];
const recById=id=>ALLRECS.find(r=>r.id===id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* highlight the search in already-built html, skipping tags and entities */
function markHtml(html,q){if(!q)return html;const fq=fold(q);
 return html.split(/(<[^>]+>|&[a-z]+;)/).map(p=>{if(!p||p[0]==='<'||(p[0]==='&'&&p.endsWith(';')))return p;const f=fold(p);let out='',i=0,j;while((j=f.indexOf(fq,i))>-1){out+=p.slice(i,j)+'<mark>'+p.slice(j,j+fq.length)+'</mark>';i=j+fq.length}return out+p.slice(i)}).join('')}

/* ---------- filtering ---------- */
const matchQ=(x,q)=>!q||fold([x.do,x.why,x.kind].join(' ').replace(/&lt;|&gt;/g,'')).includes(fold(q));
const matchF=(x,f)=>f==='all'||x.src===f;
function filtered({lever=U.lever,q=U.q,f=U.f}={}){return LATER.filter(x=>!U.done[x.id]&&(lever==null||x.lever===lever)&&matchQ(x,q)&&matchF(x,f))}
const impLabel=x=>x.pt?'+'+x.pt+' pt':x.imp;
const sumPt=list=>list.reduce((a,x)=>a+(x.pt||0),0);

/* ---------- shared card (deck and focus) ---------- */
function genBlock(r){const g=U.gen[r.id];
 if(g==='…')return `<div class="think" role="status"><span class="dots"><i></i><i></i><i></i></span><span class="shimmer">Generando…</span></div>`;
 if(g!==1)return '';
 return `<div class="gen"><div class="gh">${ic('sparkles','sm')}${r.genT||r.gen.replace(/^Generar /,'').replace(/^./,c=>c.toUpperCase())}<span style="color:var(--ink-3);font-weight:400">Listo para copiar</span><button class="btn sm line" data-act="copy">${ic('copy','sm')}Copiar</button></div><ol><li>Responde la pregunta en la primera frase, sin introducciones.</li><li>Pon los datos en una tabla o una lista que se pueda citar.</li><li>Enlázala desde una página que ya tenga tráfico.</li></ol><p>Plantilla generada por IA: revísala y adáptala a tu web antes de publicarla.</p></div>`}
function actionsFor(r,{compact=false}={}){const sm=compact?' sm':'';const done=U.done[r.id];
 if(done)return `<div class="donebar">${ic('checkc')}${done}<button class="btn sm ghost" data-act="undo" data-arg="${r.id}">${ic('undo','sm')}Deshacer</button></div>`;
 const gen=r.gen?`<button class="btn line${sm}" data-act="gen" data-arg="${r.id}" ${U.gen[r.id]?'disabled':''}>${ic('sparkles','sm')}${r.gen}</button>`:'';
 const later=`<button class="btn ghost${sm}" data-act="notnow" data-arg="${r.id}">Ahora no</button>`;
 switch(r.type){
  case 'google':return `<button class="btn ink${sm}" data-route="google">Ver en Posición en Google</button>${later}`;
  case 'gaction':return `<button class="btn ink${sm}" data-route="google">Ver en Posición en Google</button>${markBtn(r,compact)}`;
  case 'watch':return `<button class="btn ink${sm}" data-act="watch" data-arg="${r.id}">${ic('eye','sm')}Vigilar prompt</button>${later}`;
  case 'comp':return `<button class="btn ink${sm}" data-act="addcomp" data-arg="${r.id}">${ic('plus','sm')}Añadir ${r.name} a competidores</button>`;
  case 'agent':return `<button class="btn ink${sm}" data-route="agaudit">Ver la auditoría agéntica</button>`;
  case 'third':return gen+markBtn(r,compact);
  default:return gen+markBtn(r,compact)}}
/* compact rows confirm inline; deck cards use slide to confirm */
function markBtn(r,compact){if(!compact)return '';return U.inl===r.id?`<span class="inl">¿Marcarla como hecha?<button class="btn ink" data-act="ldone" data-arg="${r.id}">Sí</button><button class="btn ghost" data-act="inl" data-arg="">No</button></span>`:`<button class="btn sm ghost" data-act="inl" data-arg="${r.id}">${ic('check','sm')}Marcar como hecho</button>`}
/* the user can mark what they do themselves, outreach included (they send the email);
   Google ranking goals are outcomes they cannot execute, so those never get it */
const canSlide=r=>(r.type==='gen'||r.type==='gaction'||r.type==='third')&&!U.done[r.id];
function hintFor(r){if(U.done[r.id])return r.type==='google'?'':`<p class="hint2">${r.type==='third'?'Verás si te incluyen en tu próximo escaneo.':'Lo verás en tu próximo escaneo.'}</p>`;
 if(r.type==='google')return '<p class="hint2">No hace falta marcarla: GenScore sigue el puesto cada semana.</p>';
 if(r.type==='third')return '<p class="hint2">Verás si te incluyen en tu próximo escaneo.</p>';return ''}
function card(r,i){const op=U.qs[r.id];
 const acts=canSlide(r)?`<div class="dk-act">${slideHtml(r.id)}${r.gen?`<button class="btn line" data-act="gen" data-arg="${r.id}" ${U.gen[r.id]?'disabled':''}>${ic('sparkles','sm')}${r.gen}</button>`:''}${r.type==='gaction'?`<button class="btn ghost" data-route="google">Ver en Posición en Google</button>`:''}<button class="btn ghost dk-next" data-act="dknext">Siguiente${ic('arrowr','sm')}</button></div>`:`<div class="dk-act">${actionsFor(r)}<button class="btn ghost dk-next" data-act="dknext">Siguiente${ic('arrowr','sm')}</button></div>`;
 const qs=r.qs||(r.n?Array.from({length:r.n},(_,k)=>['Programa de facturación para autónomos','Software de facturación con Verifactu','Alternativas a Cuentix para pymes','Mejor programa de facturación online','Facturación electrónica para pymes'][k%5]):null);
 return `<div class="in">
  <div class="dk-top"><span class="dk-ix num" aria-hidden="true">${pad(i+1)}</span><div class="dk-ch">${srcChip(r.src)}<span class="k">${r.kind}</span>${r.quick?'<span class="badge b-blue">Victoria rápida</span>':''}${r.third?'<span class="badge b-line">Depende de terceros</span>':''}</div>
   <div class="dk-imp">${r.pt?`<div class="v num">+${r.pt}<small>pt</small></div><div class="t">Puntuación GEO</div>`:`<div class="w">${r.imp}</div>`}</div></div>
  <div class="do-k">Haz esto</div>
  <h3 class="do">${hiPath(r.do)}</h3>
  <p class="why">${r.why}</p>
  ${r.track?goalScale(r.track):''}
  ${qs&&r.e?`<div class="seen ${op?'open':''}"><button data-act="qs" data-arg="${r.id}" aria-expanded="${!!op}"><span>Visto en ${qs.length} ${qs.length===1?'pregunta':'preguntas'}</span><span class="e" aria-label="Motores: ${engNames(r.e)}">${r.e.map(k=>lg(k,14)).join('')}</span>${ic('chevd','sm')}</button>${op?`<ul>${qs.map(q=>`<li>${q}</li>`).join('')}</ul>`:''}</div>`:''}
  ${genBlock(r)}
  ${acts}${hintFor(r)}
 </div>`}

/* ---------- compact list ---------- */
function lrow(x){const op=U.row===x.id;
 return `<div class="lrow ${op?'open':''}"><button data-act="row" data-arg="${x.id}" aria-expanded="${op}"><span class="tt"><span class="ch lq">${pvSrc(x.src)}${x.third?'<span class="tx">Depende de terceros</span>':''}${x.quick?'<span class="tx">Victoria rápida</span>':''}<span class="im-m num">· ${impLabel(x)}</span></span><b>${markHtml(hiPath(x.do),U.q)}</b><span class="w">${markHtml(x.why,U.q)}</span></span><span class="im num ${x.pt?'':'lo'}">${impLabel(x)}</span>${ic('chevd','sm')}</button>
  ${op?`<div class="ex">${x.saw?`<div class="lbl">Lo que vimos</div><p>${x.saw}</p>`:''}${x.e?`<p class="eng-l">${x.e.map(k=>lg(k,13)).join('')}Visto en ${x.n} ${x.n===1?'pregunta':'preguntas'} de ${engNames(x.e)}</p>`:''}${x.track?goalScale(x.track):''}${genBlock(x)}<div class="acts">${actionsFor(x,{compact:true})}</div>${hintFor(x)}</div>`:''}</div>`}
const GROUP_SHOW=3;
function groupHtml(g,items){const all=U.more[g.k]||U.lever===g.k||U.q||items.length<=GROUP_SHOW+1;const shown=all?items:items.slice(0,GROUP_SHOW);const pt=sumPt(items);
 return `<section class="grp" aria-label="${g.l}"><div class="grp-h"><h3>${g.l}</h3><span class="ct num">${items.length} ${items.length===1?'acción':'acciones'}</span><span class="im num ${pt?'':'q'}">${pt?'Hasta +'+pt+' pt':items[0].imp}</span>${U.lever===g.k?'':`<button class="btn sm line" data-act="focusgrp" data-arg="${g.k}">${ic('focus','sm')}Abrir en foco</button>`}</div>
  ${U.lever===g.k?'':`<p class="grp-d">${g.d}</p>`}${shown.map(lrow).join('')}
  ${items.length>GROUP_SHOW+1&&!U.q&&U.lever!==g.k?`<button class="more" data-act="more" data-arg="${g.k}" aria-expanded="${!!U.more[g.k]}">${U.more[g.k]?'Ver menos':`Ver ${items.length-GROUP_SHOW} más`}${ic('chevd','sm')}</button>`:''}</section>`}
function laterList(){if(U.ltab==='res'){const mine=ALLRECS.filter(r=>U.done[r.id]);
  return `${mine.map(r=>`<div class="hist">${ic('checkc')}<div class="b"><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="badge b-blue">${U.done[r.id].replace(/\.$/,'')}</span><span class="badge b-line">${r.kind}</span></div><h4>${hiPath(r.do)}</h4><p>Hoy.</p></div><button class="btn sm ghost" data-act="undo" data-arg="${r.id}">${ic('undo','sm')}Deshacer</button></div>`).join('')}${RES.map(([a,k,t,v,url])=>`<div class="hist">${ic('checkc')}<div class="b"><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="badge ${url||a==='Resuelta sola'?'b-pos':'b-blue'}">${a}</span><span class="badge b-line">${k}</span></div><h4>${url?`<s>${t}</s>`:t}</h4><p>${v}${url?` <span class="mono">${url}</span>`:''}</p></div></div>`).join('')}`}
 const list=filtered();
 if(!list.length)return `<div class="empty-s">Nada con estos filtros.<div style="margin-top:12px"><button class="btn sm line" data-act="clearf">Quitar filtros</button></div></div>`;
 return LEVERS.filter(g=>U.lever==null||g.k===U.lever).map(g=>{const it=list.filter(x=>x.lever===g.k);return it.length?groupHtml(g,it):''}).join('')}
function chipsHtml(){const base=filtered({f:'all'});const c={all:base.length,ia:base.filter(x=>x.src==='ia').length,google:base.filter(x=>x.src==='google').length,agent:base.filter(x=>x.src==='agent').length};
 return [['all','Todas'],['ia','IA'],['google','Google'],['agent','Agentes']].map(([k,l])=>`<button class="stab" data-act="fsrc" data-arg="${k}" aria-pressed="${U.f===k}" ${c[k]||k==='all'?'':'disabled'}>${l}<span class="c num">${c[k]}</span></button>`).join('')}
/* palancas: a quiet text index beside the list (desktop) and a native select (mobile), never pills */
function pillsHtml(){const all=filtered({lever:null});
 const opt=(k,l,n,pt)=>`<button class="lix" data-act="lever" data-arg="${k}" aria-pressed="${(U.lever||'')===k}" ${n||!k?'':'disabled'}><span class="nm">${l}</span>${pt?`<span class="p num">+${pt}</span>`:''}<span class="c num">${n}</span></button>`;
 return `<nav class="lidx" aria-label="Palancas"><div class="lidx-h">Palancas</div>${opt('','Todas',all.length,0)}${LEVERS.map(g=>{const it=filtered({lever:g.k});return opt(g.k,g.l,it.length,sumPt(it))}).join('')}<p class="lidx-f">Los puntos son lo máximo que puede sumar cada palanca.</p></nav>
 <label class="lsel"><span>Palanca</span><select id="lsel" aria-label="Palanca"><option value="">Todas (${all.length})</option>${LEVERS.map(g=>{const n=filtered({lever:g.k}).length;return `<option value="${g.k}" ${U.lever===g.k?'selected':''} ${n?'':'disabled'}>${g.l} (${n})</option>`}).join('')}</select>${ic('chevd','sm')}</label>`}
function rerenderLater(){const b=$('#laterb');if(!b)return;
 const pend=$('#lfilters');if(pend)pend.hidden=U.ltab!=='pend';const lg_=$('#lgrid');if(lg_)lg_.classList.toggle('one',U.ltab!=='pend');
 if(U.ltab==='pend'){$('#fchips').innerHTML=chipsHtml();$('#levers').innerHTML=pillsHtml();const n=filtered().length;$('#lcount').textContent=n;$('#focusall').disabled=!n}
 b.innerHTML=laterList();$('#ltot').textContent=LATER.filter(x=>!U.done[x.id]).length}

/* ---------- screen ---------- */
SCREENS.recs={title:'Recomendaciones',render(){const open=ALLRECS.filter(r=>!U.done[r.id]).length;
 return `<div class="eyebrow bare">Recomendaciones · <span class="mono" style="letter-spacing:0;text-transform:none">nubaria.es</span><span class="badge b-line" style="letter-spacing:0;text-transform:none">${open} acciones</span></div>
 <h1 style="margin-top:14px">Recomendaciones</h1><p class="lead">Cuatro para esta semana. El resto, ordenado por palanca.</p>
 <div class="alert" role="region" aria-label="Bloqueo">${ic('warn')}<div class="tx"><b>Perplexity no puede leer tu web.</b> Tu robots.txt lo bloquea.</div><button class="btn warm sm" data-route="audit">Arreglarlo</button></div>
 <div class="pillars">${[['Presencia',41],['Prominencia',66],['Cuota de voz',34],['Autoridad',18]].map(([l,v],i)=>`<div><div class="l">${l}</div><b class="num">${roll(v)}</b>${bar(v,{cls:'thin '+(v<25?'warm':''),delay:i*80})}</div>`).join('')}</div>
 <button class="wins" data-act="wins">${ic('checkc','sm')}3 resueltas hace poco${ic('arrowr','sm')}</button>
 <div class="focus-h"><h2>Tu plan de esta semana. <b>Hasta +14 pt</b></h2><div class="ctl"><span style="font-size:12.5px;color:var(--ink-3)">← →</span><button class="navb" data-step="-1" aria-label="Acción anterior">${ic('chevl')}</button><button class="navb" data-step="1" aria-label="Acción siguiente">${ic('chevr')}</button></div></div>
 ${progressTicks(PLAN.length)}
 <div class="deck" id="deck" aria-roledescription="mazo" aria-label="Plan de la semana"></div>
 <div class="later-top" id="later"><h2>Más adelante<small class="num" id="ltot">${LATER.filter(x=>!U.done[x.id]).length}</small></h2>${seg('ltabs',[['pend','Pendientes'],['res','Resueltas']],U.ltab,'ltab')}</div>
 <div id="lfilters" ${U.ltab==='pend'?'':'hidden'}>
  <div class="toolbar"><label class="search">${ic('search','sm')}<input id="rq" type="search" placeholder="Busca una acción, una página o un rival" value="${esc(U.q)}" aria-label="Buscar en Más adelante"></label>
   <div class="stabs" id="fchips" role="group" aria-label="Fuente">${chipsHtml()}</div>
   <button class="btn sm line" id="focusall" data-act="focusall">${ic('focus','sm')}<span>Recorrer <span class="num" id="lcount">${filtered().length}</span> en foco</span></button></div></div>
 <div class="lgrid ${U.ltab==='pend'?'':'one'}" id="lgrid"><aside id="levers">${pillsHtml()}</aside><div id="laterb">${laterList()}</div></div>`},
 after(root){U.deck=makeDeck($('#deck',root),PLAN,{card,isDone:id=>!!U.done[id],ptk:$('#ptk',root),nav:$$('.focus-h [data-step]',root),onSlide:confirmDone,start:U.recIdx||0,lastLabel:'Ver el resto'});
  const q=$('#rq',root);q.addEventListener('input',()=>{U.q=q.value;U.row=null;rerenderLater()})}};

/* ---------- actions ---------- */
function eachDeck(fn){[U.deck,U.fdeck].forEach(d=>d&&fn(d))}
function refreshEverywhere(id){eachDeck(d=>d.items.some(r=>r.id===id)&&d.refresh(id));if(LATER.some(x=>x.id===id))rerenderLater()}
function setDone(id,msg){U.done[id]=msg;U.inl=null;if(U.row===id)U.row=null;refreshEverywhere(id);
 toast(msg,msg==='Marcada como hecha.'?(recById(id).type==='third'?'Verás si te incluyen en tu próximo escaneo.':'Lo verás en tu próximo escaneo.'):'','checkc',()=>{delete U.done[id];refreshEverywhere(id)})}
function confirmDone(id){setDone(id,'Marcada como hecha.');const d=U.fdeck&&U.fdeck.items.some(r=>r.id===id)?U.fdeck:U.deck;if(!d)return;const t=d.nextOpen();if(t>-1)setTimeout(()=>d.go(t),RM.matches?0:700)}
ACT.gen=el=>{const id=el.dataset.arg;U.gen[id]='…';refreshEverywhere(id);setTimeout(()=>{U.gen[id]=1;refreshEverywhere(id);toast('Propuesta generada.','La tienes en la tarjeta.','sparkles')},RM.matches?300:1700)};
ACT.copy=()=>toast('Copiado.','','copy');
ACT.undo=el=>{const id=el.dataset.arg;delete U.done[id];refreshEverywhere(id);if(U.ltab==='res')rerenderLater()};
ACT.qs=el=>{const id=el.dataset.arg;U.qs[id]=!U.qs[id];refreshEverywhere(id);const b=$(`.dk[data-id="${id}"] [data-act="qs"]`,$('#focus').hidden?document:$('#focus'));b&&b.focus()};
ACT.notnow=el=>{const id=el.dataset.arg;setDone(id,'La dejamos para más adelante.');const d=U.fdeck||U.deck;d&&d.items.some(r=>r.id===id)&&d.go(d.idx+1)};
ACT.watch=el=>setDone(el.dataset.arg,'Prompt vigilado.');
ACT.addcomp=el=>{const r=recById(el.dataset.arg);setDone(r.id,`${r.name} añadida a tus competidores.`)};
ACT.ldone=el=>setDone(el.dataset.arg,'Marcada como hecha.');

 else if(i===2)m=`<div class="tt-split">${ttMiniDial(48)}<div><div class="tt-k">Puntuación GEO</div><p class="tt-p">Presencia, prominencia, cuota de voz, autoridad y salud técnica, en una cifra de 0 a 100.</p></div></div>`;

function ttFrame(p){const st=$('.tt-stage');if(!st)return;st.style.setProperty('--p',p.toFixed(3));
 $$('[data-tw]',st).forEach(el=>{const t=el.dataset.tw.replace(/\\n/g,'\n');el.textContent=t.slice(0,Math.round(t.length*Math.min(1,p*1.5)))});

 $$('svg[data-to]',st).forEach(s=>{const to=+s.dataset.to*ttEase(p);$$('line',s).forEach(l=>l.classList.toggle('on',+l.dataset.v<=to))});
 $$('.ring',st).forEach(s=>{const ls=$$('line',s),n=Math.round(66*.6*ttEase(p));ls.forEach((l,k)=>l.classList.toggle('on',k<n))})}
