<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Tres marcas dispersas, una de ellas destacada en azul, convergen en una lente hacia una lista ordenada donde la marca destacada aparece en segundo lugar, detrás de otra">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03060e"/>
      <stop offset=".5" stop-color="#070d1e"/>
      <stop offset="1" stop-color="#040712"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#0891b2" stop-opacity=".4"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset=".3" stop-color="#bff4fb" stop-opacity=".9"/>
      <stop offset=".65" stop-color="#22d3ee" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#4F7BFF" stop-opacity=".7"/>
      <stop offset="1" stop-color="#7fe9f5" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#122751" stop-opacity=".97"/>
      <stop offset="1" stop-color="#0a172f" stop-opacity=".93"/>
    </linearGradient>
    <filter id="blurLg" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="blurMd" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <ellipse cx="260" cy="150" rx="260" ry="150" fill="url(#glowBlue)" filter="url(#blurLg)"/>
  <ellipse cx="900" cy="150" rx="240" ry="150" fill="url(#glowCyan)" filter="url(#blurLg)"/>


  <g>
    <rect x="110" y="104" width="130" height="28" rx="9" fill="#101a30" fill-opacity="0.55" stroke="#2a3f6e" stroke-width="1"/>
    <rect x="124" y="114" width="66" height="8" rx="4" fill="#3a4a72"/>
  </g>
  <g>
    <rect x="150" y="146" width="170" height="38" rx="10" fill="#14294f" fill-opacity="0.95" stroke="#4F7BFF" stroke-width="1.6"/>
    <circle cx="172" cy="165" r="8" fill="#4F7BFF"/>
    <rect x="190" y="160" width="92" height="9" rx="4.5" fill="#e7edfb"/>
  </g>
  <g>
    <rect x="272" y="108" width="120" height="26" rx="9" fill="#101a30" fill-opacity="0.5" stroke="#2a3f6e" stroke-width="1"/>
    <rect x="286" y="117" width="56" height="8" rx="4" fill="#3a4a72"/>
  </g>

  <line x1="335" y1="150" x2="565" y2="150" stroke="url(#beam)" stroke-width="3"/>
  <circle cx="600" cy="150" r="46" fill="url(#core)" filter="url(#blurMd)"/>
  <circle cx="600" cy="150" r="30" fill="none" stroke="#bff4fb" stroke-width="1.4" stroke-opacity=".8"/>
  <line x1="635" y1="150" x2="720" y2="150" stroke="url(#beam)" stroke-width="3"/>

  <rect x="730" y="100" width="370" height="100" rx="14" fill="url(#panel)" stroke="#2f5fb8" stroke-width="1.2"/>
  <g>
    <circle cx="762" cy="124" r="10" fill="none" stroke="#7fe9f5" stroke-width="2"/>
    <text x="762" y="128.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#7fe9f5">1</text>
    <rect x="788" y="118" width="230" height="12" rx="6" fill="#7fe9f5" fill-opacity=".85"/>
  </g>
  <g>
    <rect x="746" y="137" width="338" height="26" rx="9" fill="#1d4ed8" fill-opacity=".28" stroke="#4F7BFF" stroke-width="1.4"/>
    <circle cx="762" cy="150" r="10" fill="none" stroke="#4F7BFF" stroke-width="2"/>
    <text x="762" y="154.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#4F7BFF">2</text>
    <rect x="788" y="144" width="150" height="12" rx="6" fill="#4F7BFF"/>
  </g>
  <g>
    <circle cx="762" cy="177" r="10" fill="none" stroke="#3a4a72" stroke-width="2"/>
    <text x="762" y="181.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#5b6b8c">3</text>
    <rect x="788" y="171" width="90" height="12" rx="6" fill="#3a4a72"/>
  </g>
</svg>
