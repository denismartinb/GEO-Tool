<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="A la izquierda, preguntas de pacientes sobre a qué dentista ir; en el centro, un núcleo luminoso; a la derecha, tres motores de IA que recomiendan clínicas distintas: Gemini, sólo independientes; ChatGPT, casi siempre independientes (casi nunca cadenas); Claude, sobre todo cadenas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03060e"/>
      <stop offset=".5" stop-color="#070d1e"/>
      <stop offset="1" stop-color="#040712"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#0891b2" stop-opacity=".4"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset=".3" stop-color="#bff4fb" stop-opacity=".9"/>
      <stop offset=".65" stop-color="#22d3ee" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#4F7BFF" stop-opacity=".7"/>
      <stop offset="1" stop-color="#7fe9f5" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#122751" stop-opacity=".97"/>
      <stop offset="1" stop-color="#0a172f" stop-opacity=".93"/>
    </linearGradient>
    <filter id="blurLg" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="blurMd" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <ellipse cx="260" cy="150" rx="260" ry="150" fill="url(#glowBlue)" filter="url(#blurLg)"/>
  <ellipse cx="900" cy="150" rx="260" ry="150" fill="url(#glowCyan)" filter="url(#blurLg)"/>

  <g font-family="Arial, sans-serif">
    <rect x="80" y="86" width="250" height="38" rx="19" fill="#14294f" fill-opacity="0.92" stroke="#2a3f6e"/>
    <text x="100" y="110" font-size="14" font-weight="600" fill="#e7edfb">¿A qué dentista voy en Madrid?</text>
    <rect x="120" y="134" width="250" height="38" rx="19" fill="#0e2f3a" fill-opacity="0.92" stroke="#2a3f6e"/>
    <text x="140" y="158" font-size="14" font-weight="600" fill="#e7edfb">Implantes en Valencia, ¿dónde?</text>
    <rect x="80" y="182" width="250" height="38" rx="19" fill="#101a30" fill-opacity="0.6" stroke="#2a3f6e"/>
    <text x="100" y="206" font-size="14" font-weight="600" fill="#5b6b8c">Dentista para pacientes con miedo</text>
  </g>

  <line x1="390" y1="150" x2="470" y2="150" stroke="url(#beam)" stroke-width="3"/>
  <circle cx="505" cy="150" r="46" fill="url(#core)" filter="url(#blurMd)"/>
  <circle cx="505" cy="150" r="30" fill="none" stroke="#bff4fb" stroke-width="1.4" stroke-opacity=".8"/>
  <line x1="540" y1="150" x2="610" y2="150" stroke="url(#beam)" stroke-width="3"/>

  <g font-family="Arial, sans-serif">
    <rect x="620" y="70" width="160" height="160" rx="14" fill="url(#panel)" stroke="#2f5fb8" stroke-width="1.2"/>
    <text x="640" y="102" font-size="15" font-weight="700" fill="#eaf1ff">Gemini</text>
    <rect x="640" y="118" width="120" height="22" rx="6" fill="#1f3d78"/><text x="650" y="134" font-size="11.5" fill="#cfe0ff">Independiente</text>
    <rect x="640" y="148" width="120" height="22" rx="6" fill="#1f3d78"/><text x="650" y="164" font-size="11.5" fill="#cfe0ff">Independiente</text>
    <rect x="640" y="178" width="120" height="22" rx="6" fill="#1f3d78"/><text x="650" y="194" font-size="11.5" fill="#cfe0ff">Independiente</text>

    <rect x="800" y="70" width="160" height="160" rx="14" fill="url(#panel)" stroke="#2f5fb8" stroke-width="1.2"/>
    <text x="820" y="102" font-size="15" font-weight="700" fill="#eaf1ff">ChatGPT</text>
    <rect x="820" y="118" width="120" height="22" rx="6" fill="#1f3d78"/><text x="830" y="134" font-size="11.5" fill="#cfe0ff">Independiente</text>
    <rect x="820" y="148" width="120" height="22" rx="6" fill="#1f3d78"/><text x="830" y="164" font-size="11.5" fill="#cfe0ff">Independiente</text>
    <rect x="820" y="178" width="120" height="22" rx="6" fill="#1f3d78"/><text x="830" y="194" font-size="11.5" fill="#cfe0ff">Independiente</text>

    <rect x="980" y="70" width="160" height="160" rx="14" fill="url(#panel)" stroke="#2f5fb8" stroke-width="1.2"/>
    <text x="1000" y="102" font-size="15" font-weight="700" fill="#eaf1ff">Claude</text>
    <rect x="1000" y="118" width="120" height="22" rx="6" fill="#4a2a12"/><text x="1010" y="134" font-size="11.5" fill="#ffd9b0">Cadena dental</text>
    <rect x="1000" y="148" width="120" height="22" rx="6" fill="#4a2a12"/><text x="1010" y="164" font-size="11.5" fill="#ffd9b0">Cadena dental</text>
    <rect x="1000" y="178" width="120" height="22" rx="6" fill="#1f3d78"/><text x="1010" y="194" font-size="11.5" fill="#cfe0ff">Independiente</text>
  </g>
</svg>
