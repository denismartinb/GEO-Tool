<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="A la izquierda, una tarjeta de agencia con una persona y otra de herramienta con un panel de datos; ambas convergen en una lente hacia un panel de decisión con un criterio, no un precio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03060e"/>
      <stop offset=".5" stop-color="#070d1e"/>
      <stop offset="1" stop-color="#040712"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#0891b2" stop-opacity=".4"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset=".3" stop-color="#bff4fb" stop-opacity=".9"/>
      <stop offset=".65" stop-color="#22d3ee" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#4F7BFF" stop-opacity=".7"/>
      <stop offset="1" stop-color="#7fe9f5" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#122751" stop-opacity=".97"/>
      <stop offset="1" stop-color="#0a172f" stop-opacity=".93"/>
    </linearGradient>
    <filter id="blurLg" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="blurMd" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <ellipse cx="260" cy="150" rx="260" ry="150" fill="url(#glowBlue)" filter="url(#blurLg)"/>
  <ellipse cx="900" cy="150" rx="240" ry="150" fill="url(#glowCyan)" filter="url(#blurLg)"/>

  
  <g>
    <rect x="100" y="108" width="175" height="48" rx="10" fill="#3a2414" fill-opacity="0.92" stroke="#2a3f6e" stroke-width="1"/>
    <text x="112" y="129" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#e7edfb">Agencia GEO</text>
    <text x="112" y="148" font-family="Arial, sans-serif" font-size="11" fill="#8fa3d6">estrategia + ejecución</text>
  </g>

  <g>
    <rect x="100" y="178" width="175" height="48" rx="10" fill="#14294f" fill-opacity="0.92" stroke="#2a3f6e" stroke-width="1"/>
    <text x="112" y="199" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#e7edfb">Herramienta GEO</text>
    <text x="112" y="218" font-family="Arial, sans-serif" font-size="11" fill="#8fa3d6">medición continua</text>
  </g>

  <g>
    <rect x="305" y="143" width="155" height="48" rx="10" fill="#101a30" fill-opacity="0.55" stroke="#2a3f6e" stroke-width="1"/>
    <text x="317" y="164" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#5b6b8c">Tu criterio</text>
    <text x="317" y="183" font-family="Arial, sans-serif" font-size="11" fill="#44506b">tamaño, capacidad interna</text>
  </g>

  <line x1="470" y1="150" x2="565" y2="150" stroke="url(#beam)" stroke-width="3"/>
  <circle cx="600" cy="150" r="46" fill="url(#core)" filter="url(#blurMd)"/>
  <circle cx="600" cy="150" r="30" fill="none" stroke="#bff4fb" stroke-width="1.4" stroke-opacity=".8"/>
  <line x1="635" y1="150" x2="720" y2="150" stroke="url(#beam)" stroke-width="3"/>

  <rect x="730" y="95" width="370" height="110" rx="14" fill="url(#panel)" stroke="#2f5fb8" stroke-width="1.2"/>
  <text x="754" y="132" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#eaf1ff">Cuándo cada una</text>
  <text x="754" y="156" font-family="Arial, sans-serif" font-size="12.5" fill="#9fb3e6">Herramienta: medir siempre</text>
  <text x="754" y="176" font-family="Arial, sans-serif" font-size="12.5" fill="#9fb3e6">Agencia: ejecutar sin equipo propio</text>
  <g transform="translate(1068, 118)"><path d="M-7 0l5 5.5 9-10" stroke="#7fe9f5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
</svg>