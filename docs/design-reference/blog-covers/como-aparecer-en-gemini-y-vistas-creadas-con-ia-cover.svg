<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="A la izquierda, tres superficies de IA de Google (Vistas creadas con IA, Modo IA y Gemini) y varias sub-preguntas dispersas; en el centro una lente; a la derecha, un panel con tu página citada como fuente">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03060e"/>
      <stop offset=".5" stop-color="#070d1e"/>
      <stop offset="1" stop-color="#040712"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#0891b2" stop-opacity=".4"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset=".3" stop-color="#bff4fb" stop-opacity=".9"/>
      <stop offset=".65" stop-color="#22d3ee" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#4F7BFF" stop-opacity=".7"/>
      <stop offset="1" stop-color="#7fe9f5" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#122751" stop-opacity=".97"/>
      <stop offset="1" stop-color="#0a172f" stop-opacity=".93"/>
    </linearGradient>
    <filter id="blurLg" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="blurMd" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <ellipse cx="260" cy="150" rx="260" ry="150" fill="url(#glowBlue)" filter="url(#blurLg)"/>
  <ellipse cx="900" cy="150" rx="240" ry="150" fill="url(#glowCyan)" filter="url(#blurLg)"/>

  <g>
    <rect x="110" y="102" width="178" height="40" rx="10" fill="#14294f" fill-opacity="0.92" stroke="#2a3f6e" stroke-width="1"/>
    <text x="122" y="127" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#e7edfb">Vistas creadas con IA</text>
  </g>
  <g>
    <rect x="110" y="152" width="178" height="40" rx="10" fill="#0e2f3a" fill-opacity="0.92" stroke="#2a3f6e" stroke-width="1"/>
    <text x="122" y="177" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#e7edfb">Modo IA</text>
  </g>
  <g>
    <rect x="110" y="202" width="178" height="40" rx="10" fill="#101a30" fill-opacity="0.7" stroke="#2a3f6e" stroke-width="1"/>
    <text x="122" y="227" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#8fa3d6">App de Gemini</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="11.5" fill="#9fb3e6">
    <rect x="320" y="104" width="118" height="26" rx="13" fill="#101a30" fill-opacity="0.75" stroke="#2f5fb8" stroke-opacity=".6"/>
    <text x="333" y="121">¿cuánto cuesta?</text>
    <rect x="336" y="138" width="118" height="26" rx="13" fill="#101a30" fill-opacity="0.75" stroke="#2f5fb8" stroke-opacity=".6"/>
    <text x="349" y="155">¿para quién es?</text>
    <rect x="320" y="172" width="118" height="26" rx="13" fill="#101a30" fill-opacity="0.75" stroke="#2f5fb8" stroke-opacity=".6"/>
    <text x="333" y="189">¿alternativas?</text>
  </g>

  <line x1="462" y1="150" x2="565" y2="150" stroke="url(#beam)" stroke-width="3"/>
  <circle cx="600" cy="150" r="46" fill="url(#core)" filter="url(#blurMd)"/>
  <circle cx="600" cy="150" r="30" fill="none" stroke="#bff4fb" stroke-width="1.4" stroke-opacity=".8"/>
  <line x1="635" y1="150" x2="720" y2="150" stroke="url(#beam)" stroke-width="3"/>

  <rect x="730" y="95" width="360" height="110" rx="14" fill="url(#panel)" stroke="#2f5fb8" stroke-width="1.2"/>
  <text x="754" y="132" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#eaf1ff">Tu página, citada como fuente</text>
  <text x="754" y="156" font-family="Arial, sans-serif" font-size="12.5" fill="#9fb3e6">Indexada y apta para fragmento</text>
  <text x="754" y="176" font-family="Arial, sans-serif" font-size="12.5" fill="#9fb3e6">Responde a cada sub-pregunta</text>
  <g transform="translate(1058, 118)"><path d="M-7 0l5 5.5 9-10" stroke="#7fe9f5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
</svg>
