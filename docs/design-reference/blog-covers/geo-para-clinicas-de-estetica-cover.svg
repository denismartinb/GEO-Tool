<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="30%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#131a3a"/>
      <stop offset="55%" stop-color="#0a0e1f"/>
      <stop offset="100%" stop-color="#05070f"/>
    </radialGradient>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F7BFF" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#2e46ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2e46ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardOn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e2b3a"/>
      <stop offset="100%" stop-color="#0a1f33"/>
    </linearGradient>
    <linearGradient id="panelOn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#122347"/>
      <stop offset="100%" stop-color="#0d1a38"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- ambient dots -->
  <g fill="#3a4a8a" opacity="0.5">
    <circle cx="60" cy="40" r="1.6"/>
    <circle cx="140" cy="255" r="1.6"/>
    <circle cx="1080" cy="45" r="1.6"/>
    <circle cx="1140" cy="230" r="1.6"/>
    <circle cx="980" cy="255" r="1.4"/>
    <circle cx="40" cy="180" r="1.4"/>
  </g>

  <!-- LEFT: grid of clinic cards, mostly dim, two lit -->
  <g transform="translate(70,58)">
    <g>
      <rect x="0" y="0" width="76" height="76" rx="12" fill="url(#cardOn)" stroke="#12a150" stroke-width="1.5"/>
      <path d="M38 24v28M24 38h28" stroke="#5be89a" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(92,0)">
      <rect width="76" height="76" rx="12" fill="#101733" stroke="#26305e" stroke-width="1.2" stroke-dasharray="3 4"/>
      <path d="M38 24v28M24 38h28" stroke="#39406b" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(184,0)">
      <rect width="76" height="76" rx="12" fill="#101733" stroke="#26305e" stroke-width="1.2" stroke-dasharray="3 4"/>
      <path d="M38 24v28M24 38h28" stroke="#39406b" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(0,92)">
      <rect width="76" height="76" rx="12" fill="#101733" stroke="#26305e" stroke-width="1.2" stroke-dasharray="3 4"/>
      <path d="M38 24v28M24 38h28" stroke="#39406b" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(92,92)">
      <rect width="76" height="76" rx="12" fill="url(#cardOn)" stroke="#12a150" stroke-width="1.5"/>
      <path d="M38 24v28M24 38h28" stroke="#5be89a" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(184,92)">
      <rect width="76" height="76" rx="12" fill="#101733" stroke="#26305e" stroke-width="1.2" stroke-dasharray="3 4"/>
      <path d="M38 24v28M24 38h28" stroke="#39406b" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- connecting streaks toward the lens -->
  <g stroke="#3f5bd9" stroke-width="1.4" opacity="0.55">
    <line x1="345" y1="96" x2="520" y2="140"/>
    <line x1="345" y1="150" x2="520" y2="150"/>
    <line x1="345" y1="204" x2="520" y2="160"/>
  </g>

  <!-- CENTER: lens / spark (GenScore analysis) -->
  <circle cx="600" cy="150" r="110" fill="url(#lensGlow)"/>
  <circle cx="600" cy="150" r="46" fill="none" stroke="#4F7BFF" stroke-width="2" opacity="0.85"/>
  <circle cx="600" cy="150" r="30" fill="none" stroke="#09C5D6" stroke-width="2" stroke-dasharray="6 6" opacity="0.8"/>
  <path d="M600 132l6 14 14 6-14 6-6 14-6-14-14-6 14-6z" fill="#eaf1ff"/>

  <!-- streaks from lens to right panel -->
  <g stroke="#3f5bd9" stroke-width="1.4" opacity="0.55">
    <line x1="680" y1="140" x2="800" y2="118"/>
    <line x1="680" y1="150" x2="800" y2="150"/>
    <line x1="680" y1="160" x2="800" y2="182"/>
  </g>

  <!-- RIGHT: AI answer panel with three named rows lit, the rest dim -->
  <g transform="translate(810,66)">
    <rect x="0" y="0" width="330" height="168" rx="16" fill="url(#panelOn)" stroke="#2e46ff" stroke-width="1.4" opacity="0.95"/>
    <text x="20" y="30" font-family="Space Mono, monospace" font-size="11" fill="#8f9ad6" letter-spacing="1">RECOMENDACIÓN IA</text>

    <g transform="translate(20,46)">
      <rect width="290" height="26" rx="7" fill="#12a150" opacity="0.18"/>
      <rect x="0" y="0" width="4" height="26" rx="2" fill="#5be89a"/>
      <text x="14" y="17" font-family="Space Grotesk, sans-serif" font-size="13" fill="#eafff2" font-weight="600">Clínica A</text>
    </g>
    <g transform="translate(20,80)">
      <rect width="290" height="26" rx="7" fill="#12a150" opacity="0.18"/>
      <rect x="0" y="0" width="4" height="26" rx="2" fill="#5be89a"/>
      <text x="14" y="17" font-family="Space Grotesk, sans-serif" font-size="13" fill="#eafff2" font-weight="600">Clínica B</text>
    </g>
    <g transform="translate(20,114)">
      <rect width="290" height="26" rx="7" fill="#12a150" opacity="0.18"/>
      <rect x="0" y="0" width="4" height="26" rx="2" fill="#5be89a"/>
      <text x="14" y="17" font-family="Space Grotesk, sans-serif" font-size="13" fill="#eafff2" font-weight="600">Clínica C</text>
    </g>
    <text x="20" y="158" font-family="Space Mono, monospace" font-size="10.5" fill="#7d84ad">+ el resto, sin mencionar</text>
  </g>
</svg>
