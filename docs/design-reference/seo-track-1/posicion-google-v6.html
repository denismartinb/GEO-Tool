<title>Posicionamiento en Google</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: consola GenScore (dirección F, fondo claro) con menú lateral. «Posición en Google» v5 (SEO-TRACK-1 fase 1): tres pestañas (Resumen, Temas, Descubrir), el detalle de un tema en un panel lateral, la franja de enlaces en el Resumen; sin pestaña Plan (fase 2). Primer uso aparte. Conmutador escritorio/móvil con container queries. */
:root{
  color-scheme:light;
  --font:"Figtree",ui-sans-serif,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --stage:#e8e8ed; --bg:#f5f5f7; --sb:#fbfbfd; --card:#ffffff; --card-2:#f7f7f9; --muted:#f0f0f3; --muted-2:#e6e6eb;
  --border:rgba(60,60,67,.11); --border-2:rgba(60,60,67,.2);
  --fg:#1d1d1f; --fg-2:#424245; --fg-3:#6e6e73; --fg-4:#a1a1a6;
  --primary:#1068e0; --primary-hover:#0b5bc8; --accent-soft:rgba(16,104,224,.09); --accent-soft-2:rgba(16,104,224,.16);
  --pos:#34c759; --pos-soft:rgba(52,199,89,.13); --pos-ink:#1f7a35;
  --warn:#ff9500; --warn-soft:rgba(255,149,0,.14); --warn-ink:#a14a00;
  --neg:#ff3b30; --neg-soft:rgba(255,59,48,.10); --neg-ink:#c9000f;
  --vio:#7a4fd6; --vio-soft:rgba(122,79,214,.11);
  --t1:#34c759; --t2:#4b91ff; --t3:#ffb020; --t4:#c7c7cc;
  --sh-card:0 .5px 1px rgba(0,0,0,.035),0 1px 6px rgba(0,0,0,.04);
  --sh-md:0 2px 6px rgba(0,0,0,.05),0 10px 28px rgba(0,0,0,.08);
  --sh-lg:0 24px 70px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
body{background:var(--stage);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
.topbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
.topbar .ttl{font-weight:700;font-size:15px}
.topbar .ttl span{font-weight:500;color:var(--fg-3);margin-left:8px;font-size:13px}
.seg{display:inline-flex;background:var(--muted-2);border-radius:9px;padding:2px;gap:2px}
.seg button{font-size:13px;padding:6px 12px;border-radius:7px;color:var(--fg-3);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);font-weight:600;box-shadow:var(--sh-card)}
.stagewrap{padding-bottom:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.device{max-width:1320px;margin:0 auto;border-radius:14px;overflow:hidden;box-shadow:var(--sh-lg);background:var(--bg);transition:max-width .25s ease}
.device.mobile{max-width:390px;border-radius:36px;border:9px solid #1d1d1f}
.app{container-type:inline-size;container-name:app;position:relative;min-height:760px}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:760px}

/* sidebar */
.sb{background:var(--sb);border-right:1px solid var(--border);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;padding:2px 10px 14px}
.logo i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#2563eb,#09c5d6);display:block}
.grp{font-size:11px;font-weight:600;color:var(--fg-4);padding:14px 10px 4px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:7px 10px;border-radius:8px;font-size:13.5px;color:var(--fg-2)}
.nav:hover{background:var(--muted)}
.nav.on{background:var(--accent-soft);color:var(--primary);font-weight:600}
.nav.off{color:var(--fg-4);cursor:default}
.nav.off:hover{background:none}
.badge{font-size:11px;font-weight:700;background:var(--primary);color:#fff;border-radius:99px;padding:0 7px;line-height:18px}
.nav.on .badge{background:var(--primary)}

/* main */
.main{min-width:0;display:flex;flex-direction:column}
.mhead{display:none}
.mtabs{display:none}
.view{padding:26px 30px 40px;display:flex;flex-direction:column;gap:18px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.ph .sub{color:var(--fg-3);font-size:13px;margin-top:2px}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--pos-ink);background:var(--pos-soft);border-radius:99px;padding:3px 10px;font-weight:600}
.conn::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pos)}
.card{background:var(--card);border-radius:12px;box-shadow:var(--sh-card);padding:18px 20px;min-width:0}
.card h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.link{color:var(--primary);font-weight:600;font-size:13px}
.link:hover{text-decoration:underline}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13px;border-radius:9px;padding:8px 14px;background:var(--card);box-shadow:inset 0 0 0 1px var(--border-2);color:var(--fg);white-space:nowrap}
.btn:hover{background:var(--card-2)}
.btn.pri{background:var(--primary);color:#fff;box-shadow:none}
.btn.pri:hover{background:var(--primary-hover)}
.btn.ghost{box-shadow:none;color:var(--fg-3)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.c-blue{background:var(--accent-soft);color:var(--primary)}
.c-pos{background:var(--pos-soft);color:var(--pos-ink)}
.c-warn{background:var(--warn-soft);color:var(--warn-ink)}
.c-neg{background:var(--neg-soft);color:var(--neg-ink)}
.c-vio{background:var(--vio-soft);color:var(--vio)}
.c-grey{background:var(--muted);color:var(--fg-3)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--fg-3)}
.faint{color:var(--fg-4)}
.up{color:var(--pos-ink);font-weight:600}.down{color:var(--neg-ink);font-weight:600}

/* resumen */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:stretch}
.verdict{display:flex;flex-direction:column;gap:12px}
.verdict .eyebrow{font-size:12px;font-weight:600;color:var(--fg-3)}
.verdict h2{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.verdict p{margin:0;color:var(--fg-2);font-size:14.5px;max-width:60ch}
.brakes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:4px}
.brake{background:var(--card-2);border-radius:10px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 0 0 1px var(--border)}
.brake:hover{box-shadow:inset 0 0 0 1px var(--border-2)}
.brake .bt{font-size:12.5px;font-weight:600;color:var(--fg-2)}
.brake .bv{font-size:13px;color:var(--fg-3)}
.lvl{display:flex;gap:3px}
.lvl i{flex:1;height:5px;border-radius:99px;background:var(--muted-2)}
.lvl.l3 i{background:var(--neg)}
.lvl.l2 i:nth-child(-n+2){background:var(--warn)}
.lvl.l1 i:nth-child(1){background:var(--pos)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border-radius:12px;box-shadow:var(--sh-card);padding:14px 16px;min-width:0}
.kpi .l{font-size:12px;color:var(--fg-3);font-weight:500}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:12px;color:var(--fg-3)}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
.tierbar{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;margin:6px 0 10px}
.tierbar i{display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--fg-2)}
.legend b{font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

/* tareas */
.tasks{display:flex;flex-direction:column;gap:10px}
.task{background:var(--card);border-radius:12px;box-shadow:var(--sh-card);overflow:hidden}
.task-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px 18px;width:100%;text-align:left}
.task-row:hover{background:var(--card-2)}
.tn{font-family:var(--mono);font-size:12px;color:var(--fg-4);padding-top:3px}
.tt{font-weight:700;font-size:14.5px}
.tm{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--fg-3);margin-top:5px;align-items:center}
.tg{text-align:right;font-size:12px;color:var(--fg-3);white-space:nowrap}
.tg b{display:block;color:var(--pos-ink);font-size:14px;font-variant-numeric:tabular-nums}
.task-body{padding:0 18px 16px 58px;display:flex;flex-direction:column;gap:12px}
.why{font-size:13.5px;color:var(--fg-2);background:var(--card-2);border-radius:9px;padding:10px 12px}
.why b{color:var(--fg)}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.steps li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;font-size:13.5px;color:var(--fg-2)}
.steps li::before{content:"";width:14px;height:14px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--fg-4);margin-top:3px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.done-note{font-size:13px;color:var(--pos-ink);background:var(--pos-soft);border-radius:9px;padding:9px 12px}
.result{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
.result b{font-variant-numeric:tabular-nums}
.empty{color:var(--fg-3);font-size:13.5px;padding:18px;text-align:center}

/* palabras clave */
.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font-size:12.5px;border-radius:99px;padding:4px 12px;box-shadow:inset 0 0 0 1px var(--border-2);color:var(--fg-2)}
.filters button[aria-pressed="true"]{background:var(--fg);color:#fff;box-shadow:none}
.kt{width:100%;border-collapse:collapse;font-size:13.5px}
.kt th{font-size:11.5px;font-weight:600;color:var(--fg-4);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
.kt td{padding:11px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.kt tbody tr{cursor:pointer}
.kt tbody tr:hover td{background:var(--card-2)}
.kt tr:last-child td{border-bottom:0}
.kt .r{text-align:right}
.pos{display:inline-flex;align-items:center;gap:6px}
.pos b{font-variant-numeric:tabular-nums;font-size:15px}
.next{color:var(--primary);font-weight:600;font-size:13px;white-space:nowrap}
.kcards{display:none}
.kc{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--border);text-align:left;width:100%}
.kc:last-child{border-bottom:0}
.kc .r1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.kc .r2{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12.5px;color:var(--fg-3);align-items:center}

/* detalle */
.back{align-self:flex-start;color:var(--fg-3);font-size:13px;font-weight:500}
.back:hover{color:var(--fg)}
.kp4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.gap-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 70px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.gap-row:last-of-type{border-bottom:0}
.meter{height:6px;border-radius:99px;background:var(--muted);overflow:hidden}
.meter i{display:block;height:100%;background:var(--fg-3);border-radius:99px}
.yn{font-size:12.5px;font-weight:600;text-align:right}
.yn.no{color:var(--neg-ink)}.yn.si{color:var(--pos-ink)}
.sr{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--border);font-size:13px}
.sr:last-child{border-bottom:0}
.sr .p{font-family:var(--mono);font-size:12px;color:var(--fg-4);text-align:right}
.sr .d{font-weight:600;min-width:0}
.sr .d small{display:block;font-weight:400;color:var(--fg-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr.you{background:var(--accent-soft);border-radius:8px;border-bottom-color:transparent}
.sr.you .d{color:var(--primary)}
.spark{width:100%;height:90px;display:block}

/* enlaces */
.bars .row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 44px;gap:12px;align-items:center;padding:7px 0;font-size:13.5px}
.bars .row b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opp{border-bottom:1px solid var(--border)}
.opp:last-child{border-bottom:0}
.opp-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 2px;width:100%;text-align:left}
.opp-row:hover{background:var(--card-2)}
.opp-body{padding:0 2px 14px;display:flex;flex-direction:column;gap:10px}

/* salud técnica */
.score{display:flex;align-items:center;gap:18px}
.ring{width:96px;height:96px;flex:none}
.issue{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.issue:last-child{border-bottom:0}
.sev{width:8px;height:8px;border-radius:50%}

/* modal y cajón */
.overlay{position:absolute;inset:0;background:rgba(29,29,31,.32);display:flex;align-items:center;justify-content:center;padding:24px;z-index:40}
.modal{background:var(--card);border-radius:16px;box-shadow:var(--sh-lg);width:min(820px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;overflow:hidden}
.mh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 0}
.mh h2{margin:0;font-size:18px;font-weight:800}
.mb{padding:14px 20px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.mf{border-top:1px solid var(--border);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--fg-3);font-weight:500;min-width:0}
.inp{font:inherit;font-size:14px;color:var(--fg);border-radius:9px;border:0;box-shadow:inset 0 0 0 1px var(--border-2);padding:9px 11px;background:var(--card);width:100%}
textarea.inp{min-height:110px;resize:vertical}
.frow{display:grid;grid-template-columns:minmax(0,1fr) 180px auto;gap:10px;align-items:end}
.res{width:100%;border-collapse:collapse;font-size:13px}
.res th{font-size:11.5px;font-weight:600;color:var(--fg-4);text-align:left;padding:7px 8px;border-bottom:1px solid var(--border)}
.res td{padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.res tr:last-child td{border-bottom:0}
.res .r{text-align:right}
.cb{width:16px;height:16px;accent-color:var(--primary);vertical-align:middle;cursor:pointer}
.diff{display:inline-flex;gap:2px;vertical-align:middle}
.diff i{width:6px;height:11px;border-radius:2px;background:var(--muted-2)}
.diff.d1 i:nth-child(1),.diff.d2 i:nth-child(-n+2){background:var(--pos)}
.diff.d3 i:nth-child(-n+3){background:var(--warn)}
.diff.d4 i{background:var(--neg)}
.loading{display:flex;align-items:center;gap:10px;color:var(--fg-3);padding:22px 4px;font-size:13.5px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted-2);border-top-color:var(--primary);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.device{transition:none}}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--card);box-shadow:var(--sh-lg);z-index:41;display:flex;flex-direction:column}
.draft{font-size:14px;color:var(--fg-2);display:flex;flex-direction:column;gap:10px}
.draft h3{margin:6px 0 0;font-size:16px;color:var(--fg)}
.draft p{margin:0}
.example{font-size:12px;color:var(--warn-ink);background:var(--warn-soft);border-radius:8px;padding:6px 10px;align-self:flex-start;font-weight:600}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:var(--fg);color:#fff;font-size:13px;font-weight:500;border-radius:10px;padding:10px 16px;z-index:50;box-shadow:var(--sh-md);max-width:calc(100% - 32px)}

/* móvil (por ancho del contenedor, sirve igual para el conmutador y para un teléfono real) */
@container app (max-width:760px){
  .shell{grid-template-columns:1fr}
  .sb{display:none}
  .mhead{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 16px;background:var(--sb);border-bottom:1px solid var(--border)}
  .mhead b{font-size:15px}
  .mtabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--sb);border-bottom:1px solid var(--border);scrollbar-width:none}
  .mtabs::-webkit-scrollbar{display:none}
  .mtabs button{font-size:13px;border-radius:99px;padding:6px 12px;white-space:nowrap;color:var(--fg-2);box-shadow:inset 0 0 0 1px var(--border-2)}
  .mtabs button.on{background:var(--fg);color:#fff;box-shadow:none}
  .view{padding:16px 14px 32px;gap:14px}
  .ph h1{font-size:22px}
  .hero,.two{grid-template-columns:1fr}
  .verdict h2{font-size:20px}
  .brakes{grid-template-columns:1fr}
  .brake{flex-direction:row;align-items:center;justify-content:space-between}
  .brake .lvl{width:70px}
  .kp4{grid-template-columns:1fr 1fr}
  .kt{display:none}
  .kcards{display:block}
  .task-row{grid-template-columns:minmax(0,1fr) auto;padding:13px 14px}
  .tn{display:none}
  .task-body{padding:0 14px 14px}
  .gap-row{grid-template-columns:minmax(0,1fr) 62px}
  .gap-row .meter{display:none}
  .frow{grid-template-columns:1fr}
  .overlay{padding:0;align-items:flex-end}
  .modal{border-radius:18px 18px 0 0;max-height:92%}
  .res .hide-m{display:none}
  .bars .row{grid-template-columns:minmax(0,110px) minmax(0,1fr) 36px}
  .opp-row{grid-template-columns:minmax(0,1fr) auto}
  .opp-row .hide-m{display:none}
  .card{padding:15px 16px}
}

/* v2: objetivo, temas, descubrir */
.brakeline{display:flex;gap:12px;align-items:center;font-size:13.5px;color:var(--fg-2);flex-wrap:wrap}
.brakeline .chip{flex:none}
.goal{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:center}
.goal .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.goal .big span{font-size:18px;color:var(--fg-3);font-weight:700}
.prog{height:10px;border-radius:99px;background:var(--muted);overflow:hidden;margin:12px 0 8px}
.prog i{display:block;height:100%;background:var(--primary);border-radius:99px}
.pace{font-size:13px;font-weight:600}
.vis .row{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.vis .row:last-child{border-bottom:0}
.vis .row.h{font-size:11.5px;color:var(--fg-4);font-weight:600;padding-top:0}
.vis .row .r{text-align:right;font-variant-numeric:tabular-nums}
.vis .row.me{color:var(--primary);font-weight:700}

      <span class="r num">${fmt(d.vol)}<small>búsq./mes</small></span>
      <span class="sel-wrap"><select class="sel-inp" aria-label="Tema de ${esc(d.k)}">${topicOpts("new")}</select></span></div>`}).join(""):""}
    <p class="quota" style="margin:10px 0 0">Te quedan ${state.gapLeft} de 5 búsquedas hoy, compartidas con «Las de tus rivales». Búsquedas al mes: DataForSEO, con datos de Google Ads.</p>`;
  }else if(f==="near"){
    body=`<p class="muted" style="font-size:13px;margin:12px 0 4px">Búsquedas de tu Search Console en las que ya sales entre los puestos 4 y 20 y que todavía no vigilas. No gastan búsquedas.</p>
    ${near.map(d=>{const id="n:"+d.k;return `<div class="dk2"><input type="checkbox" class="cb" data-pick="${esc(id)}" ${state.sel[id]?"checked":""} aria-label="Vigilar ${esc(d.k)}">
      <span><b>${esc(d.k)}</b><small>Puesto ${d.pos} en Search Console</small></span>
      <span class="r num">${fmt(d.imp)}<small>impresiones</small></span>
      <span class="sel-wrap"><select class="sel-inp" aria-label="Tema de ${esc(d.k)}">${topicOpts(d.topic)}</select></span></div>`}).join("")||`<p class="muted">Ya vigilas todas.</p>`}`;
  }else{
    body=`<p class="muted" style="font-size:13px;margin:12px 0 8px">Palabras que traen visitas a ${rivals.map(r=>r.d).join(", ")} y en las que tú no sales en el Top 20.</p>
    ${!state.gapRan&&!state.loading?`<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn pri" data-gap ${state.gapLeft?"":"disabled"}>Buscar en tus rivales</button><span class="quota">Te quedan ${state.gapLeft} de 5 búsquedas hoy, compartidas con «A partir de una palabra».</span></div>`:""}
    ${state.loading?`<div class="loading"><span class="spin"></span>Buscando palabras de tus rivales…</div>`:""}
    ${state.gapRan&&!state.loading?gap.map(d=>{const id="g:"+d.k;return `<div class="dk2"><input type="checkbox" class="cb" data-pick="${esc(id)}" ${state.sel[id]?"checked":""} aria-label="Vigilar ${esc(d.k)}">
      <span><b>${esc(d.k)}</b><small>La tiene ${esc(d.who)}</small></span>
      <span class="r num">${fmt(d.vol)}<small>búsq./mes</small></span>
      <span class="sel-wrap"><select class="sel-inp" aria-label="Tema de ${esc(d.k)}">${topicOpts(d.topic)}</select></span></div>`}).join("")+`<p class="quota" style="margin:10px 0 0">Te quedan ${state.gapLeft} de 5 búsquedas hoy. Búsquedas al mes: DataForSEO, con datos de Google Ads.</p>`:""}`;
  }
  return head("Descubrir palabras","Palabras que todavía no vigilas, para añadirlas a tus temas")+subnav()+`
  <div class="card">
    <div class="filters" role="group" aria-label="Fuente"><button data-disc="seed" aria-pressed="${f==="seed"}">A partir de una palabra</button><button data-disc="near" aria-pressed="${f==="near"}">Ya casi</button><button data-disc="gap" aria-pressed="${f==="gap"}">Las de tus rivales</button></div>
    ${body}
    <div class="sticky-add"><span class="quota">${n} de ${CAP} palabras vigiladas${over?` · <b style="color:var(--neg-ink)">Tu plan llega a ${CAP}</b>`:""}</span><button class="btn pri" data-addsel ${picked&&!over?"":"disabled style=\"opacity:.45\""}>Vigilar ${picked} ${picked===1?"palabra":"palabras"}</button></div>
  </div>`;
}

function vSetup(){
  const P=PROPOSAL;const kwOn=P.topics.reduce((a,t)=>a+t.kws.filter(k=>k[2]).length,0);const rvOn=P.rivals.filter(r=>r.on).length;
  return head("Empieza a vigilar tus palabras","Te proponemos rivales, temas y palabras. Marca, edita o descarta antes de guardar.")+`
  <div class="card">
    <div class="setup-step"><span class="n">1</span><h2 style="margin:0;font-size:15px">Tus rivales en Google</h2></div>
    <p class="muted" style="font-size:13px;margin:0 0 6px">Las webs que más se repiten en el Top 10 de tus búsquedas. Hemos quitado las que no compiten contigo, como YouTube, Wikipedia o los directorios generales. Tu plan permite 3.</p>
    ${P.rivals.map((r,i)=>`<div class="rv-row"><input type="checkbox" class="cb" data-prv="${i}" ${r.on?"checked":""} ${!r.on&&rvOn>=3?"disabled":""} aria-label="Elegir ${esc(r.d)}"><span><b>${esc(r.d)}</b><small>${esc(r.why)}</small></span><span></span></div>`).join("")}
    <div class="frow" style="grid-template-columns:minmax(0,1fr) auto;margin-top:10px"><label class="field">Añadir otro dominio<input class="inp" placeholder="ejemplo.es"></label><button class="btn" data-toast="En el producto, el dominio se comprueba y entra en la lista.">Añadir</button></div>
  </div>
  <div class="card">
    <div class="setup-step"><span class="n">2</span><h2 style="margin:0;font-size:15px">Temas y palabras</h2></div>
    <p class="muted" style="font-size:13px;margin:0 0 6px">Salen de tu Search Console y de lo que tienen tus rivales. Puedes cambiar el nombre de cada tema.</p>
    ${P.topics.map((t,ti)=>`<div style="padding:12px 0;border-bottom:1px solid var(--border)">
      <input class="tname" value="${esc(t.name)}" aria-label="Nombre del tema">
      ${t.kws.map((k,ki)=>`<div class="rv-row"><input type="checkbox" class="cb" data-pkw="${ti}:${ki}" ${k[2]?"checked":""} aria-label="Vigilar ${esc(k[0])}"><span>${esc(k[0])}<small>${esc(k[1])}</small></span><span></span></div>`).join("")}
    </div>`).join("")}
    <div class="sticky-add"><span class="quota">${rvOn} ${rvOn===1?"rival":"rivales"} · ${kwOn} de ${CAP} palabras</span><button class="btn pri" data-save-setup ${kwOn?"":"disabled"}>Guardar y empezar</button></div>
  </div>`;
}

function render(){
  renderNav();const v=state.mode==="first"?"setup":state.view;
  $("#view").innerHTML=v==="setup"?vSetup():v==="resumen"?vResumen():v==="temas"?vTemas():v==="descubrir"?vDescubrir():vResumen();
  if(v==="temas"&&state.topic){if(!$("#layer").innerHTML||$("#layer").dataset.k==="topic"){$("#layer").innerHTML=vTopic();$("#layer").dataset.k="topic"}}
  else if($("#layer").dataset.k==="topic"){$("#layer").innerHTML="";$("#layer").dataset.k=""}
}

function closeLayer(){$("#layer").innerHTML=""}
function openRivals(){
  $("#layer").innerHTML=`<div class="overlay" data-close-bg><div class="modal" role="dialog" aria-modal="true" aria-labelledby="rt" style="width:min(520px,100%)">
    <div class="mh"><h2 id="rt">Tus rivales en Google</h2><button class="btn ghost sm" data-close aria-label="Cerrar">✕</button></div>
    <div class="mb">
      <p class="muted" style="font-size:13px;margin:0 0 12px">Hasta 3 dominios. Comparamos tus enlaces con los suyos y los marcamos en cada Top 10.</p>
      ${[0,1,2].map(i=>`<label class="field" style="margin-bottom:10px">Rival ${i+1}<input class="inp" id="rv-${i}" value="${esc(rivals[i]?rivals[i].d:"")}" placeholder="ejemplo.es"></label>`).join("")}
      <p class="muted" style="font-size:12px;margin:0">No vale tu propio dominio. Los enlaces de un rival nuevo se miden en la pasada del lunes.</p>
    </div>
    <div class="mf"><span></span><button class="btn pri" data-rsave>Guardar</button></div>
  </div></div>`;
  setTimeout(()=>$("#rv-0")&&$("#rv-0").focus(),0);
}
function toast(msg){const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.textContent=msg;$("#app").appendChild(el);setTimeout(()=>el.remove(),3200)}

document.addEventListener("click",e=>{
  const g=s=>e.target.closest(s);let el;
  if(el=g("[data-nav]")){nav(el.dataset.nav);return}
  if(el=g("[data-close-topic]")){state.topic=null;render();return}
  if(el=g("[data-topic]")){const t=topics.find(x=>x.id===el.dataset.topic);let i=0;if(el.dataset.kwname)i=Math.max(0,t.kws.findIndex(k=>k.k===el.dataset.kwname));openTopic(t.id,i);return}
  if(el=g("[data-seed]")){if(!state.gapLeft)return;state.seedQ=($("#seed-in").value||"").trim()||"endodoncia";state.loading=true;state.gapLeft--;render();setTimeout(()=>{state.loading=false;state.seedRan=true;render()},900);return}
  if(el=g("[data-act]")){const [id,i]=el.dataset.act.split(":");const a=ACTS[id][+i];a.done=!a.done;const dr=document.querySelector(".drawer"),st=dr?dr.scrollTop:0,db=document.querySelector(".db"),sb=db?db.scrollTop:0;$("#layer").innerHTML=vTopic();render();const d2=document.querySelector(".drawer");if(d2)d2.scrollTop=st;const b2=document.querySelector(".db");if(b2)b2.scrollTop=sb;toast(a.done?"Hecho. Lo verás en las próximas fotos del lunes.":"Vuelve a la lista.");return}
  if(el=g("[data-kw]")){state.kw=+el.dataset.kw;$("#layer").innerHTML=vTopic();return}
  if(el=g("[data-untrack]")){const t=topics.find(x=>x.id===state.topic);const k=t.kws[+el.dataset.untrack];if(t.kws.length<=1){toast("Un tema necesita al menos una palabra.");return}t.kws.splice(+el.dataset.untrack,1);state.kw=0;$("#layer").innerHTML=vTopic();render();toast(`Ya no vigilas «${k.k}». Su historial se guarda por si vuelves a vigilarla.`);return}
  if(el=g("[data-disc]")){state.disc=el.dataset.disc;render();return}
  if(el=g("[data-gap]")){if(!state.gapLeft)return;state.loading=true;state.gapLeft--;render();setTimeout(()=>{state.loading=false;state.gapRan=true;render()},900);return}
  if(el=g("[data-pick]")){state.sel[el.dataset.pick]=el.checked;render();return}
  if(el=g("[data-addsel]")){if(el.disabled)return;let n=0;
    Object.entries(state.sel).forEach(([id,on])=>{if(!on)return;const [src,k]=[id.slice(0,1),id.slice(2)];const d=(src==="n"?NEAR:src==="s"?SEED:GAP).find(x=>x.k===k);if(!d)return;d.added=true;n++;
      const tp=topics.find(t=>t.id===d.topic);if(tp)tp.kws.push({k:d.k,pos:src==="n"?d.pos:null,prev:null,url:src==="n"?"/":null});else if(d.topic==="new"||!d.topic){}});
    state.sel={};render();toast(`Vigilas ${n} ${n===1?"palabra":"palabras"} más. Su primera foto llega el lunes.`);return}
  if(el=g("[data-rivals]")){openRivals();return}
  if(el=g("[data-rsave]")){const v=[0,1,2].map(i=>($("#rv-"+i).value||"").trim().toLowerCase()).filter(Boolean);
    if(v.includes(OWN)){toast("Tu propio dominio no puede ser un rival.");return}
    rivals=v.map(d=>rivals.find(r=>r.d===d)||{d,rd:0});closeLayer();render();toast("Rivales guardados. Los enlaces de un rival nuevo llegan el lunes.");return}
  if(el=g("[data-prv]")){PROPOSAL.rivals[+el.dataset.prv].on=el.checked;render();return}
  if(el=g("[data-pkw]")){const [a,b]=el.dataset.pkw.split(":").map(Number);PROPOSAL.topics[a].kws[b][2]=el.checked;render();return}
  if(el=g("[data-save-setup]")){state.mode="use";state.firstWeek=true;state.view="resumen";setMode();render();toast("Guardado. Tu primera foto de Google llega el lunes.");return}
  if(el=g("[data-toast]")){toast(el.dataset.toast);return}
  if(el=g("[data-close]")){closeLayer();return}
  if(e.target.matches("[data-close-bg]")){closeLayer();return}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&state.topic){state.topic=null;render();return}
  if(e.key==="Escape"&&$("#layer").innerHTML)closeLayer();
  if((e.key==="Enter"||e.key===" ")&&e.target.matches("tr[data-kw]")){e.preventDefault();state.kw=+e.target.dataset.kw;$("#layer").innerHTML=vTopic();const r=document.querySelector(`tr[data-kw="${state.kw}"]`);r&&r.focus()}
});
function setDevice(m){$("#device").classList.toggle("mobile",m);$("#bt-mob").setAttribute("aria-pressed",m);$("#bt-desk").setAttribute("aria-pressed",!m)}
function setMode(){$("#bt-use").setAttribute("aria-pressed",state.mode==="use");$("#bt-first").setAttribute("aria-pressed",state.mode==="first")}
$("#bt-desk").onclick=()=>setDevice(false);$("#bt-mob").onclick=()=>setDevice(true);
$("#bt-use").onclick=()=>{state.mode="use";state.firstWeek=false;setMode();render()};
$("#bt-first").onclick=()=>{state.mode="first";setMode();render()};
render();
</script>
