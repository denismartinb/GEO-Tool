<title>Panel en reposo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: three Chrome window corners side by side (toolbar + side panel), stacked on phones */
:root{
  --bg:#eef1f6; --chrome:#dfe3ea; --chrome-2:#ffffff; --chrome-ink:#5f6672;
  --panel:#ffffff; --ink:#0b1426; --ink-2:#3b4759; --ink-3:#5f6b7e; --rule:#e3e7ee;
  --blue:#2563eb; --blue-ink:#1b4fd6; --blue-tint:#ecf2ff; --cyan:#22c3e6;
  --font:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0f1a; --chrome:#1f232b; --chrome-2:#2b3039; --chrome-ink:#aab1bd;
  --panel:#0f1625; --ink:#eef2f8; --ink-2:#bcc6d6; --ink-3:#8c97aa; --rule:#222c3d;
  --blue:#5b93ff; --blue-ink:#8db4ff; --blue-tint:#13224a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f1a; --chrome:#1f232b; --chrome-2:#2b3039; --chrome-ink:#aab1bd;
  --panel:#0f1625; --ink:#eef2f8; --ink-2:#bcc6d6; --ink-3:#8c97aa; --rule:#222c3d;
  --blue:#5b93ff; --blue-ink:#8db4ff; --blue-tint:#13224a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:32px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--ink-3);font-size:14px;margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px;justify-items:center}
figure{margin:0;display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
figcaption{display:flex;gap:10px;align-items:baseline}
figcaption b{font-size:15px}
figcaption span{color:var(--ink-3);font-size:13px}
.tag{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--blue-tint);color:var(--blue-ink);font-size:12px;font-weight:700;flex:none;transform:translateY(-1px)}

/* the window corner */
.win{width:100%;border-radius:14px;overflow:hidden;background:var(--panel);box-shadow:0 1px 0 var(--rule),0 18px 40px -22px rgba(11,20,38,.45);border:1px solid var(--rule)}
.tb{height:42px;background:var(--chrome);display:flex;align-items:center;gap:6px;padding:0 8px 0 10px}
.url{flex:1;height:28px;border-radius:99px;background:var(--chrome-2);color:var(--chrome-ink);font-size:12px;display:flex;align-items:center;padding:0 12px;white-space:nowrap;overflow:hidden;min-width:0}
.tbi{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--chrome-ink);position:relative;flex:none}
.tbi svg{display:block}
.gsi{background:transparent}
.badge{position:absolute;right:1px;bottom:2px;width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 2px var(--chrome)}
.badge::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--blue);opacity:0;animation:ping 1.8s var(--o,0s) infinite cubic-bezier(.2,.7,.3,1)}
.avatar{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#9aa4b3,#5f6b7e)}

.panel{height:520px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.ph{display:flex;align-items:center;gap:8px;padding:14px 16px 0;font-weight:700;font-size:15px}
.ph .sp{flex:1}
.enter{font-size:12.5px;font-weight:600;border:1px solid var(--rule);border-radius:99px;padding:6px 12px;color:var(--ink)}
.body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 24px;text-align:center}
.body h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em}
.kbd{display:flex;gap:4px;align-items:center;color:var(--ink-3);font-size:12px}
kbd{font-family:var(--font);font-size:11.5px;font-weight:600;color:var(--ink-2);border:1px solid var(--rule);border-bottom-width:2px;border-radius:6px;padding:2px 6px;background:var(--panel)}
.auto{width:100%;padding:18px 16px 22px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:8px;align-items:center}
.rv{display:flex;align-items:center;gap:8px;width:100%;height:50px;border:0;border-radius:99px;padding:0 14px;color:#fff;font:600 13.5px/1 var(--font);white-space:nowrap;letter-spacing:-.01em;cursor:pointer;
  background:radial-gradient(120% 160% at 0% 0%,#3b74ff 0%,rgba(59,116,255,0) 60%),linear-gradient(135deg,#1b4fd6,#0b1f5c);box-shadow:0 10px 26px -12px rgba(27,79,214,.75)}
.rv span{flex:1;text-align:left}
.rv:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.tiny{margin:0;font-size:12px;color:var(--ink-3);line-height:1.45}
.foot{display:flex;align-items:center;gap:8px;padding:0 16px 14px;font-size:12px;color:var(--ink-3)}
.sw{width:26px;height:16px;border-radius:99px;background:var(--rule);position:relative}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--panel)}

/* A · arrow */
.arrowA{position:absolute;right:30px;top:4px;width:150px;height:62px;color:var(--blue);pointer-events:none}
.arrowA path.l{stroke-dasharray:6 7;animation:dash 1.2s linear infinite}
.arrowA g{animation:bob 1.6s ease-in-out infinite;transform-origin:center}
.mini{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--blue-tint);vertical-align:-8px;margin:0 2px}

/* B · mini toolbar with a cursor */
.minibar{position:relative;display:flex;align-items:center;gap:6px;width:190px;height:38px;padding:0 6px 0 10px;border-radius:12px;background:var(--chrome);}
.minibar .u{flex:1;height:20px;border-radius:99px;background:var(--chrome-2)}
.minibar .tbi{width:24px;height:24px}
.minibar .hit{position:absolute;right:35px;top:7px;width:24px;height:24px;border-radius:50%;border:2px solid var(--blue);opacity:0;animation:hit 2.8s infinite}
.cursor{position:absolute;right:20px;top:20px;width:18px;height:22px;animation:cur 2.8s infinite cubic-bezier(.4,0,.2,1)}
.up{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--blue-ink)}

/* C · beam from the top edge */
.beam{position:absolute;right:-12px;top:-30px;width:110px;height:260px;pointer-events:none;
  background:radial-gradient(50% 55% at 50% 0%,color-mix(in srgb,var(--blue) 30%,transparent),transparent 72%);animation:breathe 2.6s ease-in-out infinite}
.chev{position:absolute;right:33px;top:10px;display:flex;flex-direction:column;align-items:center;color:var(--blue);pointer-events:none}
.chev svg{display:block;margin-top:-6px;animation:rise 1.4s infinite}
.chev svg:nth-child(2){animation-delay:.18s}.chev svg:nth-child(3){animation-delay:.36s}
.lead{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--ink-2)}

@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@keyframes dash{to{stroke-dashoffset:-26}}
@keyframes bob{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-6px)}}
@keyframes cur{0%{transform:translate(30px,26px);opacity:0}15%{opacity:1}45%{transform:translate(0,0)}52%{transform:translate(0,0) scale(.86)}60%{transform:translate(0,0) scale(1)}85%{opacity:1}100%{transform:translate(0,0);opacity:0}}
@keyframes hit{0%,48%{opacity:0;transform:scale(.6)}55%{opacity:1;transform:scale(1)}80%,100%{opacity:0;transform:scale(1.7)}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes rise{0%{opacity:0;transform:translateY(8px)}40%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.cursor{transform:none;opacity:1}.minibar .hit{opacity:1}.chev svg{opacity:1}}
.note{max-width:62ch;color:var(--ink-3);font-size:13px;margin:32px 0 0;line-height:1.5}
</style>

<div class="wrap">
  <h1>Panel en reposo</h1>
  <p class="sub">Tres maneras de llevar al icono. Un solo botón: el automático.</p>

  <div class="grid">
    <!-- A -->
    <figure>
      <figcaption><span class="tag">A</span><b>Flecha</b><span>Señala el icono desde el panel.</span></figcaption>
      <div class="win">
        <div class="tb"><div class="url">alberdiderma.es</div><span class="tbi"><svg width="18" height="18"><use href="#puz"/></svg></span><span class="tbi gsi"><svg width="17" height="18"><use href="#e-gs"/></svg><i class="badge"></i></span><span class="avatar"></span></div>
        <div class="panel">
          <svg class="arrowA" viewBox="0 0 150 62" aria-hidden="true"><g><path class="l" d="M10 54 C 60 56, 118 46, 136 10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M126 14 L137 6 L142 19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
          <div class="ph" style="padding-top:64px"><svg width="20" height="21"><use href="#e-gs"/></svg>GenScore<span class="sp"></span><span class="enter">Entrar</span></div>
          <div class="body">
            <h2>Pulsa <span class="mini"><svg width="16" height="17"><use href="#e-gs"/></svg></span> arriba</h2>
            <div class="kbd">o <kbd>Alt</kbd>+<kbd>Mayús</kbd>+<kbd>G</kbd></div>
          </div>
          <div class="auto">
            <button class="rv" type="button"><svg width="17" height="17"><use href="#eye"/></svg><span>Escanear automáticamente las páginas</span></button>
            <p class="tiny">Chrome te pedirá permiso para leer las webs.</p>
          </div>
          <div class="foot"><i class="sw"></i>Cuenta de ejemplo</div>
        </div>
      </div>
    </figure>

    <!-- B -->
    <figure>
      <figcaption><span class="tag">B</span><b>Barra en miniatura</b><span>Enseña el gesto.</span></figcaption>
      <div class="win">
        <div class="tb"><div class="url">alberdiderma.es</div><span class="tbi"><svg width="18" height="18"><use href="#puz"/></svg></span><span class="tbi gsi"><svg width="17" height="18"><use href="#e-gs"/></svg><i class="badge" style="--o:.4s"></i></span><span class="avatar"></span></div>
        <div class="panel">
          <div class="ph"><svg width="20" height="21"><use href="#e-gs"/></svg>GenScore<span class="sp"></span><span class="enter">Entrar</span></div>
          <div class="body">
            <div class="minibar" aria-hidden="true"><i class="u"></i><span class="tbi"><svg width="15" height="15"><use href="#puz"/></svg></span><span class="tbi"><svg width="14" height="15"><use href="#e-gs"/></svg></span><i class="avatar" style="width:16px;height:16px"></i><i class="hit"></i>
              <svg class="cursor" viewBox="0 0 18 22"><path d="M1.5 1.5v16l4.3-4 3 6.6 3-1.4-3-6.4h6z" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.4" stroke-linejoin="round"/></svg>
            </div>
            <h2>Pulsa el icono</h2>
            <div class="kbd">o <kbd>Alt</kbd>+<kbd>Mayús</kbd>+<kbd>G</kbd></div>
          </div>
          <div class="auto">
            <button class="rv" type="button"><svg width="17" height="17"><use href="#eye"/></svg><span>Escanear automáticamente las páginas</span></button>
            <p class="tiny">Chrome te pedirá permiso para leer las webs.</p>
          </div>
          <div class="foot"><i class="sw"></i>Cuenta de ejemplo</div>
        </div>
      </div>
    </figure>

    <!-- C -->
    <figure>
      <figcaption><span class="tag">C</span><b>Foco</b><span>Luz bajo el icono, casi sin texto.</span></figcaption>
      <div class="win">
        <div class="tb"><div class="url">alberdiderma.es</div><span class="tbi"><svg width="18" height="18"><use href="#puz"/></svg></span><span class="tbi gsi"><svg width="17" height="18"><use href="#e-gs"/></svg><i class="badge" style="--o:.8s"></i></span><span class="avatar"></span></div>
        <div class="panel">
          <i class="beam" aria-hidden="true"></i>
          <div class="chev" aria-hidden="true">
            <svg width="22" height="12" viewBox="0 0 22 12"><path d="M3 10 L11 3 L19 10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg width="22" height="12" viewBox="0 0 22 12"><path d="M3 10 L11 3 L19 10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg width="22" height="12" viewBox="0 0 22 12"><path d="M3 10 L11 3 L19 10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="ph" style="padding-top:64px"><svg width="20" height="21"><use href="#e-gs"/></svg>GenScore<span class="sp"></span><span class="enter">Entrar</span></div>
          <div class="body">
            <div class="lead">Pulsa el icono para escanear</div>
            <div class="kbd"><kbd>Alt</kbd>+<kbd>Mayús</kbd>+<kbd>G</kbd></div>
          </div>
          <div class="auto">
            <button class="rv" type="button"><svg width="17" height="17"><use href="#eye"/></svg><span>Escanear automáticamente las páginas</span></button>
            <p class="tiny">Chrome te pedirá permiso para leer las webs.</p>
          </div>
          <div class="foot"><i class="sw"></i>Cuenta de ejemplo</div>
        </div>
      </div>
    </figure>
  </div>

  <p class="note">La animación vive dentro del panel: Chrome no deja dibujar sobre su barra. Lo que sí deja es el punto azul que late en el icono, que sale en las tres.</p>
</div>
