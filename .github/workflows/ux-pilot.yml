name: Agentic User Pilot

# Runs the read-only user pilot against every Vercel preview deployment, so the
# gate no longer depends on which kind of session the founder happens to be
# working from. Claude Code's remote/web sessions cannot reach *.vercel.app
# (egress policy), but GitHub's runners can — the agent then downloads the
# screenshots artifact and does the visual judging.
#
# Verified against this repo: Vercel publishes real GitHub Deployments with
# environment "Preview" and the preview URL in `environment_url`, so no comment
# scraping is needed.
#
# Deliberately NOT triggered by `pull_request_target`: this job holds the pilot
# account's credentials, and pull_request_target would expose them to code from
# any fork.
#
# VERCEL-COST-1 Fase 5 (2026-08-31): **ya no corre solo.** Hasta hoy se
# disparaba con `deployment_status`, es decir una pasada completa —75 pantallas
# x 3 anchuras, ~6.750 peticiones HTTP contra el preview— por cada despliegue,
# hubiera o no algo que mirar. Medido en la factura real de agosto: 6,6M de
# Edge Requests y 15,1M de Observability Events ($18,09), con el grueso
# atribuible a este barrido, sobre un producto en beta privada sin tráfico
# orgánico. El fundador (2026-08-31) pidió decidir él cada pasada: "muchas
# veces no es necesario o no hay nada que probar en UI".
#
# **La premisa que sostiene retirarlo, y qué se rompe si falla.** El piloto
# sigue siendo obligatorio antes del Human Gate (CLAUDE.md); lo que cambia es
# quién lo lanza. La premisa es que el Director PREGUNTA antes de cada Human
# Gate y el fundador decide. Si esa premisa falla —una sesión que no pregunta,
# o un "no" por prisa— un PR llega al Human Gate sin ninguna verificación
# visual y **nada lo señala**, porque ya no queda ninguna señal automática que
# eche de menos. Antes, la ausencia de piloto era visible (no había check);
# ahora la ausencia es el estado por defecto. Ese es el precio, y se paga a
# cambio de ~$18/mes y de dejar de barrer 20 artículos de blog que no han
# cambiado.
#
# Efecto colateral bueno: desaparece la carrera de `deployment_status` que
# publicaba checks verdes sin haber pilotado nada cuando el deploy se creaba
# antes que el PR (log §115, y visto dos veces el 2026-08-30 en el PR #511).
# Con un número de PR de entrada no hay nada que resolver ni que pueda fallar
# en silencio.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Número del PR a pilotar (su preview tiene que estar ya desplegado)"
        required: true

permissions:
  # `contents: write` is needed only to publish screenshots to a
  # `pilot-evidence/**` branch — see "Publish screenshots" below. This job never
  # pushes to main and never touches product branches.
  contents: write
  pull-requests: write

concurrency:
  group: ux-pilot-pr-${{ github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    # 2026-08-12: era 20 y el barrido de PR #388 tardó 19m04s, así que el job
    # murió en el paso del veredicto justo al cumplirse el minuto 20. El
    # barrido crece con cada pieza de contenido —53 pantallas x 3 anchuras a
    # esa fecha—, así que un tope pegado al tiempo real de la pasada estaba
    # garantizado que se cruzara. No se sube "por si acaso": se sube porque el
    # margen medido era de 56 segundos (log §65).
    #
    # PR #391 (NOT-FOUND-ROCKET-1) chocó con el mismo síntoma un día antes,
    # de forma independiente: 20 min contra 19.3 min de tests, mismo efecto
    # (verdict impreso en el log, job cancelado antes de publicar). Confirma
    # que el tope pegado al tiempo real de la pasada es una fuente de fallos
    # recurrente, no un caso aislado — motivo de más para que 35 no sea el
    # último ajuste que haga falta.
    timeout-minutes: 35

    steps:
      # El PR viene dado por la entrada del dispatch, así que aquí no queda
      # nada que "resolver" y por tanto nada que pueda fallar en silencio: se
      # acabó la clase de fallo del log §115 (índice commit→PR que devuelve
      # vacío y el job publica verde sin haber pilotado). Lo que sí hay que
      # localizar es el preview YA desplegado de ese PR, y eso sí puede no
      # existir — y cuando no existe, este job se cae con un mensaje claro en
      # vez de pasar de puntillas: pilotar "lo que haya" es exactamente cómo se
      # juzga una pantalla que no es la del commit.
      - name: Resolve the pull request and its preview deployment
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          set -euo pipefail

          sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [ -z "$sha" ] || [ "$sha" = "null" ]; then
            echo "::error::No se pudo leer el head del PR #${PR_NUMBER}. ¿Existe?" >&2
            exit 1
          fi
          echo "PR #${PR_NUMBER} → head ${sha}"

          # El despliegue de preview de ESE commit, no el último del proyecto.
          # `environment_url` sale del estado `success`, que es el único que
          # lleva la URL ya servible.
          url=""
          for attempt in 1 2 3; do
            for dep in $(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${sha}&per_page=100" \
                          --jq '.[] | select(.environment == "Preview") | .id' 2>/dev/null); do
              url="$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${dep}/statuses?per_page=100" \
                      --jq 'map(select(.state == "success")) | .[0].environment_url // empty' 2>/dev/null)"
              [ -n "$url" ] && break
            done
            [ -n "$url" ] && break
            if [ "$attempt" -lt 3 ]; then
              echo "Todavía sin preview desplegado para ${sha} (intento ${attempt}/3); reintentando."
              sleep $((attempt * 15))
            fi
          done

          if [ -z "$url" ]; then
            echo "::error::No hay ningún preview de Vercel desplegado con éxito para ${sha} (PR #${PR_NUMBER}). Espera a que termine el despliegue y vuelve a lanzar el piloto." >&2
            exit 1
          fi

          echo "Preview: ${url}"
          {
            echo "number=${PR_NUMBER}"
            echo "sha=${sha}"
            echo "url=${url}"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the pilot
        id: run
        continue-on-error: true
        env:
          PILOT_EMAIL: ${{ secrets.PILOT_EMAIL }}
          PILOT_PASSWORD: ${{ secrets.PILOT_PASSWORD }}
          PILOT_PROJECT_ID: ${{ secrets.PILOT_PROJECT_ID }}
          PILOT_COMMIT_SHA: ${{ steps.pr.outputs.sha }}
          PILOT_PR_NUMBER: ${{ steps.pr.outputs.number }}
          # Optional. Only needed if Vercel Deployment Protection stays enabled
          # for preview deployments.
          PILOT_VERCEL_BYPASS: ${{ secrets.PILOT_VERCEL_BYPASS }}
        run: |
          set +e
          node scripts/pilot.mjs \
            --url "${{ steps.pr.outputs.url }}" \
            --summary-md .pilot/summary.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload screenshots and signals
        uses: actions/upload-artifact@v4
        with:
          name: pilot-screenshots
          path: |
            .pilot/screens/
            .pilot/findings.jsonl
            .pilot/interactions.jsonl
            .pilot/report.json
            .pilot/summary.md
          # Long enough to review a PR, short enough not to accumulate. These
          # are screenshots of a logged-in session's screens.
          retention-days: 14
          if-no-files-found: warn

      # Actions artifacts are served from *.blob.core.windows.net, which agent
      # sandboxes cannot reach (verified: the egress proxy 403s the CONNECT).
      # The artifact above is for humans; this branch is how an agent session
      # gets the screenshots, because git already works through that proxy.
      #
      # Force-pushed as a single orphan commit per PR, so evidence is replaced
      # rather than accumulated and old blobs become unreachable for GC.
      # Runs even when the pilot failed before capturing journey screenshots:
      # a login failure is exactly when the evidence matters most, and job logs
      # are served from a host agent sandboxes cannot reach either.
      - name: Publish screenshots to an evidence branch
        if: hashFiles('.pilot/**') != ''
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          branch="pilot-evidence/pr-${PR_NUMBER}"
          staging="$(mktemp -d)"
          cp -r .pilot/screens "$staging/screens" 2>/dev/null || true
          # Playwright's own failure screenshots and traces live here; they are
          # the only evidence when the run died before any journey ran.
          cp -r .pilot/output "$staging/output" 2>/dev/null || true
          cp .pilot/findings.jsonl "$staging/" 2>/dev/null || true
          cp .pilot/interactions.jsonl "$staging/" 2>/dev/null || true
          cp .pilot/summary.md "$staging/" 2>/dev/null || true
          printf 'Pilot evidence for PR #%s at commit %s\n\nGenerated by .github/workflows/ux-pilot.yml. Force-pushed each run.\n' \
            "$PR_NUMBER" "$SHA" > "$staging/README.md"
          # This branch has no package.json, so without this Vercel tries a
          # Next.js build against a directory of screenshots and JSONL, fails,
          # and emails the founder a "Failed preview deployment" for every
          # single pilot run — one push per pilot pass, forever, on top of
          # whatever's already open. static ignoreCommand, no script to keep
          # green: this branch is never anything but evidence.
          printf '{\n  "ignoreCommand": "exit 0"\n}\n' > "$staging/vercel.json"

          cd "$staging"
          git init -q
          git checkout -q -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "pilot evidence: PR #${PR_NUMBER} @ ${SHA}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            "$branch"
          echo "Evidence pushed to ${branch}"

      - name: Post the verdict on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PILOT_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          if [ ! -f .pilot/summary.md ]; then
            printf '%s\n' \
              '<!-- agentic:ux-pilot-result -->' \
              '## Agentic User Pilot — PILOT INCONCLUSIVE' \
              '' \
              'El runner terminó sin producir un resumen. Revisa los logs del workflow.' \
              '' \
              '---' \
              '_Generated by [Claude Code](https://claude.ai/code)_' > .pilot/summary.md
          fi
          # PRELAUNCH-HARDENING-1 Fase Q5 — hacer VISIBLE la ausencia de CI.
          #
          # `ci.yml` se dispara de forma intermitente en los push a un PR ya
          # abierto: tres pushes sin y dos con, misma rama y misma tarde
          # (log §54). Se le añadió `workflow_dispatch` para reponerlo a mano,
          # pero eso sólo sirve si alguien se da cuenta — y ahí está el
          # problema real: **un piloto verde se ve; un CI que no existe, no**.
          # El 2026-08-15 estuvo a punto de mergearse un PR cuya única señal
          # era este comentario.
          #
          # Este bloque no arregla la intermitencia (no está en nuestra mano) y
          # NO es la puerta: la puerta de verdad es una required status check
          # en la protección de rama, que es un ajuste del repositorio y no
          # código. Lo que hace es que la ausencia deje de ser invisible en el
          # único sitio que el fundador mira.
          #
          # `|| true` en todo: este aviso jamás puede tumbar la publicación del
          # veredicto del piloto, que es lo que de verdad importa de este paso.
          ci_runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${PILOT_SHA}&per_page=1" --jq '.total_count' 2>/dev/null || echo "")"
          # Si la sonda misma falla, `ci_runs` queda vacío y el aviso NO sale.
          # Callar es la dirección correcta —avisar de una ausencia que no hemos
          # comprobado sería ruido— pero una sonda que falla en silencio no se
          # distingue de una que dice «todo bien», que es justo el fallo que este
          # bloque existe para impedir un escalón más abajo. Queda anotado en el
          # log del job (`.claude/rules/scan.md`, «el fallo de una alerta tiene
          # que ser diagnosticable donde ya trabajas»).
          if [ -z "$ci_runs" ]; then
            echo "::warning::No se pudo comprobar si existe CI para ${PILOT_SHA}: la llamada a la API de Actions falló. El aviso de ausencia de CI NO se ha evaluado en esta pasada."
          fi
          if [ "$ci_runs" = "0" ]; then
            printf '\n---\n\n> ⚠️ **No hay ninguna ejecución de CI (`tests · typecheck · lint`) para el commit `%s`.**\n> El evento `pull_request` se pierde de vez en cuando (log §54). Este veredicto del piloto NO sustituye a los tests: repón CI antes de mergear con\n> `gh workflow run ci.yml --ref <rama>`, o desde la pestaña Actions.\n' \
              "${PILOT_SHA}" >> .pilot/summary.md
          fi

          gh pr comment "$PR_NUMBER" --body-file .pilot/summary.md

      - name: Fail the check unless the pilot passed
        env:
          EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        run: |
          set -euo pipefail
          case "$EXIT_CODE" in
            0)
              echo "PILOT PASS"
              ;;
            78)
              # An INCONCLUSIVE run must never show up as a green check. The
              # whole point of this gate is that "verified" means verified.
              echo "PILOT INCONCLUSIVE — the pilot never saw the product." >&2
              exit 1
              ;;
            *)
              echo "PILOT FAIL — see the PR comment and the pilot-screenshots artifact." >&2
              exit 1
              ;;
          esac

      # El paso de arriba es el que convierte un FAIL en check rojo, y en un job
      # cancelado NO se ejecuta: GitHub salta todo lo que no lleve `cancelled()`
      # o `always()`. Eso deja el peor estado posible — una pasada que no llegó
      # a juzgarse, indistinguible a simple vista de una que pasó, porque el
      # comentario de PASS puede haberse publicado ya (PR #388: el veredicto
      # salió y el paso siguiente murió un segundo después).
      #
      # Este paso existe para que eso no vuelva a ser silencioso. Un job
      # cancelado deja su propio comentario diciendo que el veredicto anterior,
      # si lo hay, no pasó por la puerta. Es la misma regla que ya rige el
      # código de escaneo: una garantía que no se puede ver fallar no es una
      # garantía (log §65).
      - name: Announce a run that was cut off before it could gate
        if: cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            '<!-- agentic:ux-pilot-result -->' \
            '## Agentic User Pilot — PILOT INCONCLUSIVE (pasada cortada)' \
            '' \
            'El job se canceló antes de llegar al paso que decide el veredicto, así' \
            'que **esta pasada no ha juzgado nada**. Si más arriba hay un comentario' \
            'de PASS de esta misma pasada, no cuenta: se publicó sin que el check' \
            'llegara a ejecutarse.' \
            '' \
            "Causa habitual: se agotó \`timeout-minutes\`. Revisa [el run](${RUN_URL})" \
            'y vuelve a lanzarlo.' \
            '' \
            '---' \
            '_Generated by [Claude Code](https://claude.ai/code)_' > cancelled.md
          gh pr comment "$PR_NUMBER" --body-file cancelled.md
