name: CI

# The unit tests, the typechecker and the linter, on every pull request.
#
# Until PRELAUNCH-HARDENING-1 Fase 0 this did not exist: `pnpm test` ran only
# where a session happened to run it by hand, so the ~1.800 Vitest cases were
# advisory — a PR that broke every one of them still showed a green tick and
# could reach the Human Gate. The only automated per-PR signals were the Vercel
# build and the agentic pilot, and neither one runs a single unit test.
#
# Deliberately NOT running `pnpm run build` (i.e. not the whole `validate`
# script): Vercel already builds a preview for every push that touches product
# code, so a second `next build` here would double the slowest step of CI and
# buy no new signal. The paths `scripts/vercel-should-build.sh` skips
# (`docs/`, `.claude/`, `.github/`, `tests/` except `tests/pilot/`, `agents/`,
# root prose) are all paths that cannot break a Next.js build. `tsc --noEmit`
# is meanwhile *broader* than the build's own check, because tsconfig includes
# the test files that `next build` never compiles.

on:
  pull_request:
  push:
    branches:
      - main
  # A demanda. No es comodidad: el 2026-08-10, en una misma rama y en la misma
  # tarde, tres pushes (`3bdc8ae`, `47b2d39`, `1257700`) **no dispararon** esta
  # comprobación y dos (`bf95b9b`, `fda1a2b`) sí. Es intermitente, no
  # sistemático, y eso lo empeora: la cabeza de un PR puede llegar al Human
  # Gate sin puerta y sin que nada lo diga, unas veces sí y otras no. Un evento
  # perdido es recuperable; una puerta que sólo puede dispararla ese evento
  # perdido, no.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per PR (or per branch on push). A second push supersedes the first
  # instead of queueing behind it — CI minutes are a real budget here
  # (BUILD-BUDGET-1).
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: tests · typecheck · lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Three separate steps on purpose: when this check goes red, the step
      # name in the Actions UI already says which of the three broke, without
      # opening the log.
      - name: Unit tests
        run: pnpm test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint
