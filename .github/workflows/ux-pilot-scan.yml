name: Agentic User Pilot (scan)

# UX-PILOT-3 — the pilot launches real scans, and only when the founder says so.
#
# This is the only workflow in the harness that spends money: a full-project
# scan runs every active prompt across every active engine against Gemini,
# OpenAI and Anthropic, and writes to the production Supabase project.
#
# It exists because some states cannot be reached by looking harder. After a
# scoring change there is, by construction, no run anywhere carrying the new
# shape of data — details_json holds whatever the code that scored THAT run
# wrote, and there is no backfill. PR #308 hit exactly that: six acceptance
# criteria, including the entire trend chart, had no qualifying data on any
# project the pilot could reach.
#
# NO SECRET GATES THIS. Founder, 2026-08-03: "tiene que dar al botón como si le
# diera yo, sin claves ni secretos." An earlier design required an extra
# authorization secret; it was dropped because anyone able to set a repository
# secret can already dispatch this workflow, so it bought no access control —
# only a setup step that made the capability harder to use than pressing the
# button by hand.
#
# WHAT STILL HOLDS, in code rather than by convention:
#   1. workflow_dispatch only. There is no deployment_status trigger, so no
#      preview deploy can ever start this.
#   2. --journeys scan. scripts/pilot.mjs includes the `scan` Playwright
#      project only for that explicit flag; the per-deploy workflow passes
#      --journeys read (the default) and cannot reach these files.
#   3. The target is never discovered. project_id is a required input with no
#      default, and tests/pilot/support/scan-authorization.ts refuses without
#      it, and refuses above the hard cap of 2 instead of clamping.
#
# WHAT NO LONGER HOLDS, said plainly: nothing distinguishes a human pressing
# "Run workflow" from an agent dispatching it with a repository token. That is
# the point — the pilot is meant to be able to do this itself. What remains is
# that it takes repository write access, and that every run states in the PR
# comment exactly what it spent.
#
# Same fork-safety reasoning as the other two pilot workflows: no
# pull_request_target — this job holds real credentials and spends real money.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number whose preview to scan against"
        required: true
        type: number
      project_id:
        description: "Project id to scan. Required, no default — the pilot never picks one to spend money on."
        required: true
        type: string
      scan_count:
        description: "How many scans to launch (1 unlocks the position list, 2 unlocks the trend chart). Hard cap is 2."
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Global, not per-PR: every run scans the SAME dedicated project. Two at once
  # would race on its "one active run" precondition, and the second would spend
  # money only to find the button disabled. Queue rather than cancel —
  # cancelling mid-run abandons a scan that is already being paid for.
  group: ux-pilot-scan
  cancel-in-progress: false

jobs:
  pilot-scan:
    runs-on: ubuntu-latest
    # Two full-project scans in sequence, each bounded by the journey's own
    # 7-minute settle timeout, plus setup.
    timeout-minutes: 40

    steps:
      - name: Resolve the pull request and its deployed commit
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [ -z "$sha" ] || [ "$sha" = "null" ]; then
            echo "::error::Could not resolve a head commit for PR #${PR_NUMBER}."
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Resolve the Preview deployment for that commit
        id: deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          deployment_id="$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${SHA}&environment=Preview&per_page=1" \
            --jq '.[0].id // empty')"
          if [ -z "$deployment_id" ]; then
            echo "::error::No Preview deployment found for commit ${SHA}. Has Vercel finished deploying this PR?"
            exit 1
          fi
          url="$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses?per_page=1" \
            --jq '.[0] | select(.state == "success") | .environment_url // empty')"
          if [ -z "$url" ]; then
            echo "::error::Latest status for deployment ${deployment_id} is not a successful Preview. Wait for it to finish."
            exit 1
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      # Fails before installing anything, so a run triggered without a target
      # says why immediately instead of spending five minutes on setup and then
      # skipping silently. `required: true` already stops the UI, but the API
      # accepts a dispatch with an empty string.
      - name: Refuse without an explicit target project
        env:
          TARGET: ${{ inputs.project_id }}
        run: |
          set -euo pipefail
          if [ -z "${TARGET// /}" ]; then
            echo "::error::project_id is empty. The project to scan must be named explicitly — the pilot will not pick one to spend money on."
            exit 1
          fi

      - name: Check out the deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Launch the authorized scans
        id: run
        continue-on-error: true
        env:
          PILOT_EMAIL: ${{ secrets.PILOT_EMAIL }}
          PILOT_PASSWORD: ${{ secrets.PILOT_PASSWORD }}
          PILOT_SCAN_PROJECT_ID: ${{ inputs.project_id }}
          PILOT_SCAN_COUNT: ${{ inputs.scan_count }}
          PILOT_COMMIT_SHA: ${{ steps.pr.outputs.sha }}
          PILOT_PR_NUMBER: ${{ inputs.pr_number }}
          PILOT_VERCEL_BYPASS: ${{ secrets.PILOT_VERCEL_BYPASS }}
        run: |
          set +e
          node scripts/pilot.mjs \
            --url "${{ steps.deploy.outputs.url }}" \
            --journeys scan \
            --summary-md .pilot/summary.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload screenshots and signals
        uses: actions/upload-artifact@v4
        with:
          name: pilot-scan-screenshots
          path: |
            .pilot/screens/
            .pilot/output/
            .pilot/findings.jsonl
            .pilot/report.json
            .pilot/summary.md
          retention-days: 14
          if-no-files-found: warn

      # Its own branch suffix, so a scan run never clobbers the read-only
      # pilot's evidence or the write pilot's.
      - name: Publish screenshots to an evidence branch
        if: hashFiles('.pilot/**') != ''
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          branch="pilot-evidence/pr-${PR_NUMBER}-scan"
          staging="$(mktemp -d)"
          cp -r .pilot/screens "$staging/screens" 2>/dev/null || true
          cp -r .pilot/output "$staging/output" 2>/dev/null || true
          cp .pilot/findings.jsonl "$staging/" 2>/dev/null || true
          cp .pilot/summary.md "$staging/" 2>/dev/null || true
          printf 'Scan-pilot evidence for PR #%s at commit %s\n\nGenerated by .github/workflows/ux-pilot-scan.yml. Force-pushed each run.\n' \
            "$PR_NUMBER" "$SHA" > "$staging/README.md"

          cd "$staging"
          git init -q
          git checkout -q -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "scan-pilot evidence: PR #${PR_NUMBER} @ ${SHA}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            "$branch"
          echo "Evidence pushed to ${branch}"

      - name: Post the outcome on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if [ ! -f .pilot/summary.md ]; then
            printf '%s\n' \
              '<!-- agentic:ux-pilot-scan-result -->' \
              '## Agentic User Pilot — Escaneo autorizado (UX-PILOT-3) — PILOT INCONCLUSIVE' \
              '' \
              'El runner terminó sin producir un resumen. Revisa los logs del workflow' \
              'y comprueba en la pantalla de Escaneos si algún escaneo llegó a lanzarse —' \
              'el coste puede haberse producido igualmente.' \
              '' \
              '---' \
              '_Generated by [Claude Code](https://claude.ai/code)_' > .pilot/summary.md
          fi
          gh pr comment "$PR_NUMBER" --body-file .pilot/summary.md

      - name: Fail the run unless the scans completed
        env:
          EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        run: |
          set -euo pipefail
          case "$EXIT_CODE" in
            0)
              echo "Scans completed. The evidence is captures, not a verdict — the ux-pilot agent still has to judge them."
              ;;
            78)
              echo "::error::PILOT INCONCLUSIVE (scan) — the journey never reached the product. Check whether money was spent anyway."
              exit 1
              ;;
            *)
              echo "::error::PILOT FAIL (scan) — see the PR comment and the pilot-scan-screenshots artifact."
              exit 1
              ;;
          esac
