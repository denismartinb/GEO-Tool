name: Weekly Post PR

# GROWTH-3 Fase A2 — la red de seguridad de la publicación semanal.
#
# POR QUÉ EXISTE. La Fase A1 dejó el encargo escrito (`docs/agentic-weekly-
# post.md`) y un disparador que despierta una sesión nueva cada lunes. Esa PR
# ya avisó de un riesgo sin resolver: al crear la rutina, el sistema advirtió
# de que las sesiones disparadas podrían correr **sin las herramientas MCP de
# GitHub**. Si eso se cumple, el agente semanal escribe el artículo, valida,
# empuja la rama... y ahí se queda. Sin PR, sin preview, sin pilot, y sin que
# nadie se entere hasta que alguien mire las ramas a mano.
#
# El 2026-08-04 se intentó comprobarlo y no se pudo: las herramientas de
# rutinas piden una aprobación interactiva que una sesión remota no puede
# conceder. Esa es justamente la señal — lo que necesita una aprobación
# interactiva no está garantizado en una sesión headless.
#
# Así que este workflow no pregunta si el MCP estará: hace que dé igual.
#
# QUÉ GARANTIZA, en código y no por convención:
#   1. Que exista un PR abierto para toda rama `claude/weekly-post/**`.
#   2. Que el fundador reciba un aviso real de GitHub por ese PR (review
#      request → email nativo), sin secretos nuevos ni servicios de terceros.
#
# ES IDEMPOTENTE A PROPÓSITO. Si la sesión semanal SÍ tenía MCP y abrió el PR
# ella misma, este job lo encuentra y no crea nada — sólo se asegura de que la
# petición de revisión esté puesta. Los dos caminos convergen en el mismo
# estado final, que es lo que hace que no haya que saber de antemano cuál se
# tomó.
#
# LO QUE NO HACE: no mergea, no aprueba, no toca `main`, no publica nada. El
# Human Gate sigue siendo manual (CLAUDE.md). El check de portada seguirá en
# rojo a propósito (`lib/blog/covers.test.ts`, log §14) — este workflow no lo
# esquiva.
#
# DOS COSAS QUE HAY QUE SABER, dichas aquí para que no se descubran un lunes:
#
#   a) Requiere que esté activado en el repo "Allow GitHub Actions to create
#      and approve pull requests" (Settings → Actions → General → Workflow
#      permissions). Sin eso, `gh pr create` devuelve 403. El paso falla con
#      un mensaje que dice exactamente esto, en vez de morir en un error de
#      API sin contexto.
#
#   b) Un PR creado con GITHUB_TOKEN **no dispara** workflows de
#      `pull_request` / `pull_request_target`. Aquí no rompe nada: el pilot
#      (`ux-pilot.yml`) dispara con `deployment_status`, o sea con el deploy
#      de Vercel, que sí ocurre porque lo hace la GitHub App de Vercel al
#      empujar la rama. Lo que sí queda inerte es el handoff automático de
#      etiquetas de `claude-qa-handoff.yml` — irrelevante, porque CLAUDE.md
#      ya declara superseded esa vía: la QA la corre el subagente `qa`.

on:
  push:
    branches:
      - "claude/weekly-post/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: weekly-post-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ensure-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Necesitamos el mensaje del último commit completo: el asunto es el
          # título del PR y el cuerpo es el cuerpo del PR. Ese es todo el
          # contrato entre el agente y este workflow — sin ficheros temporales
          # que ensucien la rama del artículo.
          fetch-depth: 2

      - name: Ensure an open PR exists, and that the founder is asked to review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          REVIEWER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            echo "El PR #$existing ya está abierto para $BRANCH — la sesión semanal pudo abrirlo ella misma."
          else
            title="$(git log -1 --pretty=%s)"
            body_file="$(mktemp)"
            git log -1 --pretty=%b > "$body_file"

            # Un cuerpo vacío deja un PR mudo justo cuando más contexto hace
            # falta. Preferimos decir que falta a fingir que no.
            if [ ! -s "$body_file" ]; then
              printf '_El commit semanal no traía cuerpo de mensaje, así que este PR no tiene descripción. Ver el diff._\n' > "$body_file"
            fi

            printf '\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' >> "$body_file"

            if ! gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$title" \
              --body-file "$body_file"
            then
              echo "::error::No se pudo crear el PR. Causa más probable: falta activar 'Allow GitHub Actions to create and approve pull requests' en Settings → Actions → General → Workflow permissions."
              exit 1
            fi

            existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          fi

          # El aviso. Pedir revisión al dueño del repo hace que GitHub le mande
          # su email nativo, sin claves nuevas ni servicios de terceros. Es la
          # capa que funciona siempre, incluso si la sesión semanal murió justo
          # después de empujar la rama.
          #
          # `|| true`: no se puede pedir revisión a quien ya es autor del PR.
          # Si la sesión semanal lo abrió con la cuenta del fundador, esto
          # falla, y fallar aquí sería tirar un job que ya ha hecho su trabajo.
          gh pr edit "$existing" --add-assignee "$REVIEWER" || true
          gh pr ready "$existing" || true
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${existing}/requested_reviewers" \
            -X POST -f "reviewers[]=$REVIEWER" > /dev/null 2>&1 \
            || echo "No se pidió revisión (lo normal si el fundador es el autor del PR). El PR queda asignado igualmente."

          # Los `|| true` de arriba ignoran el código de salida, pero NO
          # comprueban el efecto. Y el efecto es justamente el aviso: si no se
          # asigna ni se pide revisión, el fundador no recibe el email de
          # GitHub y no se entera de que hay un artículo esperándole. Un job en
          # verde significaría "entregado" cuando en realidad no lo avisó nadie
          # (hallazgo de QA en la PR #318).
          #
          # No se falla el job: el PR existe y eso ya es progreso real. Pero se
          # deja un ::warning:: visible, para que "verde" deje de poder
          # significar "puede que nadie se haya enterado".
          notified="$(gh pr view "$existing" --json assignees,reviewRequests \
            --jq '[(.assignees | length), (.reviewRequests | length)] | add')"
          if [ "${notified:-0}" -eq 0 ]; then
            echo "::warning::El PR #${existing} quedó SIN asignado y SIN revisor: no se ha enviado ningún aviso por GitHub. Revísalo a mano — el artículo está, pero nadie ha sido notificado."
          fi

          echo "PR listo: $(gh pr view "$existing" --json url --jq .url)"
