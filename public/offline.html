<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sin conexión · GenScore</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#fff;color:#0b1426;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  main{max-width:320px}
  h1{margin:0 0 8px;font-size:22px;letter-spacing:-.01em}
  p{margin:0 0 20px;color:#5b6577}
  button{height:44px;padding:0 22px;border:0;border-radius:12px;background:#0b1426;color:#fff;font:600 15px inherit;font-family:inherit}
  @media (prefers-color-scheme:dark){body{background:#0b1426;color:#f4f6fa}p{color:#9aa5b8}button{background:#f4f6fa;color:#0b1426}}
</style>
</head>
<body>
<main>
  <h1>Sin conexión</h1>
  <p>No hemos podido cargar GenScore. Comprueba tu conexión e inténtalo de nuevo.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
