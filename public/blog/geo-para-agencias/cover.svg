<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Una capa de respuestas muy ancha frente a un hilo mínimo de clics que llega a una web">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081223"/>
      <stop offset="1" stop-color="#0f1c33"/>
    </linearGradient>
    <radialGradient id="glowE" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".50"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowF" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb020" stop-opacity=".26"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg3)"/>
  <circle cx="300" cy="180" r="340" fill="url(#glowE)"/>
  <circle cx="980" cy="500" r="260" fill="url(#glowF)"/>

  <!-- La capa de respuesta: ancha, en todas partes -->
  <text x="120" y="128" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="600" fill="#09c5d6">Donde ya se responde sin ti</text>
  <g transform="translate(120 154)">
    <g fill="#2563eb">
      <rect x="0" y="0" width="118" height="34" rx="10" opacity=".85"/>
      <rect x="132" y="0" width="86" height="34" rx="10" opacity=".7"/>
      <rect x="232" y="0" width="140" height="34" rx="10" opacity=".8"/>
      <rect x="386" y="0" width="98" height="34" rx="10" opacity=".6"/>
      <rect x="498" y="0" width="126" height="34" rx="10" opacity=".75"/>
      <rect x="638" y="0" width="90" height="34" rx="10" opacity=".55"/>
      <rect x="742" y="0" width="150" height="34" rx="10" opacity=".7"/>
      <rect x="0" y="48" width="96" height="34" rx="10" opacity=".62"/>
      <rect x="110" y="48" width="146" height="34" rx="10" opacity=".78"/>
      <rect x="270" y="48" width="104" height="34" rx="10" opacity=".55"/>
      <rect x="388" y="48" width="132" height="34" rx="10" opacity=".72"/>
      <rect x="534" y="48" width="88" height="34" rx="10" opacity=".5"/>
      <rect x="636" y="48" width="142" height="34" rx="10" opacity=".68"/>
      <rect x="792" y="48" width="100" height="34" rx="10" opacity=".52"/>
      <rect x="0" y="96" width="134" height="34" rx="10" opacity=".55"/>
      <rect x="148" y="96" width="92" height="34" rx="10" opacity=".7"/>
      <rect x="254" y="96" width="150" height="34" rx="10" opacity=".48"/>
      <rect x="418" y="96" width="110" height="34" rx="10" opacity=".64"/>
      <rect x="542" y="96" width="128" height="34" rx="10" opacity=".45"/>
      <rect x="684" y="96" width="94" height="34" rx="10" opacity=".6"/>
      <rect x="792" y="96" width="100" height="34" rx="10" opacity=".42"/>
    </g>
  </g>

  <!-- El hilo de clics: mínimo. Sin cifras: la portada ilustra la forma, el
       número exacto vive en el StatGrid del cuerpo, con su fuente. -->
  <g transform="translate(120 398)">
    <text x="0" y="20" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" fill="#98a2b3">La respuesta está en todas partes.</text>
    <text x="0" y="42" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" fill="#98a2b3">La visita, casi en ninguna.</text>
    <path d="M4 80 C 260 80, 470 100, 700 112" stroke="#ffb020" stroke-width="2.5" fill="none" opacity=".9"/>
    <circle cx="4" cy="80" r="6" fill="#ffb020"/>

    <!-- La web del cliente -->
    <g transform="translate(716 52)">
      <rect width="180" height="120" rx="16" fill="#0d1a30" stroke="#24344f" stroke-width="1.5"/>
      <rect x="22" y="26" width="136" height="11" rx="5.5" fill="#3b4759"/>
      <rect x="22" y="49" width="96" height="11" rx="5.5" fill="#3b4759" opacity=".7"/>
      <rect x="22" y="72" width="120" height="11" rx="5.5" fill="#3b4759" opacity=".5"/>
      <rect x="22" y="95" width="72" height="11" rx="5.5" fill="#2563eb"/>
    </g>
  </g>
</svg>
