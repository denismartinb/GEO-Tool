<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Una capa de respuestas muy ancha frente a un hilo mínimo de clics que llega a una web">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081223"/>
      <stop offset="1" stop-color="#0f1c33"/>
    </linearGradient>
    <radialGradient id="glowE" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".5"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowF" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb020" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg3)"/>
  <circle cx="220" cy="150" r="230" fill="url(#glowE)"/>
  <circle cx="1040" cy="150" r="200" fill="url(#glowF)"/>

  <!-- Contenido con valor dentro de y≈108-192: la única franja que sobrevive
       al recorte real del contenedor (1124×96 en desktop). Sin cifras: el
       número exacto vive en el StatGrid del cuerpo, con su fuente — ver
       docs/brand/design-decisions-log.md §31. -->

  <!-- La capa de respuesta: ancha -->
  <g transform="translate(90 116)" fill="#2563eb">
    <rect x="0" y="0" width="86" height="26" rx="8" opacity=".85"/>
    <rect x="96" y="0" width="64" height="26" rx="8" opacity=".65"/>
    <rect x="170" y="0" width="102" height="26" rx="8" opacity=".78"/>
    <rect x="282" y="0" width="72" height="26" rx="8" opacity=".55"/>
    <rect x="364" y="0" width="94" height="26" rx="8" opacity=".7"/>
    <rect x="0" y="34" width="68" height="26" rx="8" opacity=".6"/>
    <rect x="78" y="34" width="106" height="26" rx="8" opacity=".75"/>
    <rect x="194" y="34" width="76" height="26" rx="8" opacity=".5"/>
    <rect x="280" y="34" width="96" height="26" rx="8" opacity=".68"/>
    <rect x="386" y="34" width="72" height="26" rx="8" opacity=".45"/>
  </g>

  <!-- El hilo de clics: mínimo, hacia la web del cliente -->
  <g transform="translate(560 129)">
    <path d="M0 0 C 90 0, 140 20, 200 34" stroke="#ffb020" stroke-width="2.5" fill="none" opacity=".9"/>
    <circle cx="0" cy="0" r="5" fill="#ffb020"/>
  </g>
  <g transform="translate(770 116)">
    <rect width="150" height="66" rx="14" fill="#0d1a30" stroke="#24344f" stroke-width="1.5"/>
    <rect x="16" y="16" width="100" height="9" rx="4.5" fill="#3b4759"/>
    <rect x="16" y="32" width="72" height="9" rx="4.5" fill="#3b4759" opacity=".7"/>
    <rect x="16" y="48" width="56" height="9" rx="4.5" fill="#2563eb"/>
  </g>

  <text x="90" y="182" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" fill="#98a2b3">La respuesta está en todas partes. La visita, casi en ninguna.</text>
</svg>
