<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Una capa de respuestas muy ancha frente a un hilo mínimo de clics que llega a una web">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081223"/>
      <stop offset="1" stop-color="#0f1c33"/>
    </linearGradient>
    <radialGradient id="glowE" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".5"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowF" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb020" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg3)"/>
  <circle cx="220" cy="150" r="230" fill="url(#glowE)"/>
  <circle cx="1040" cy="150" r="200" fill="url(#glowF)"/>

  <!-- Sin texto (misma razón que las otras dos): el hilo y la web del
       cliente, que son el elemento con más significado, van centrados en
       (600,150) para sobrevivir a la ventana más agresiva medida (tarjeta de
       /blog en móvil, ~560px centrados). La franja de respuesta se abre a
       los lados, decorativa fuera de esa ventana. -->

  <!-- La capa de respuesta: ancha, a los lados -->
  <g fill="#2563eb">
    <rect x="90" y="118" width="76" height="26" rx="8" opacity=".8"/>
    <rect x="176" y="118" width="56" height="26" rx="8" opacity=".6"/>
    <rect x="90" y="152" width="60" height="26" rx="8" opacity=".55"/>
    <rect x="160" y="152" width="92" height="26" rx="8" opacity=".68"/>
    <rect x="972" y="118" width="76" height="26" rx="8" opacity=".72"/>
    <rect x="1058" y="118" width="56" height="26" rx="8" opacity=".5"/>
    <rect x="964" y="152" width="92" height="26" rx="8" opacity=".62"/>
    <rect x="1066" y="152" width="60" height="26" rx="8" opacity=".42"/>
  </g>

  <!-- El hilo de clics: mínimo, hacia el centro -->
  <g transform="translate(430 108)">
    <path d="M0 42 C 60 42, 90 42, 130 42" stroke="#ffb020" stroke-width="3" fill="none" opacity=".9"/>
    <circle cx="0" cy="42" r="6" fill="#ffb020"/>
  </g>
  <g transform="translate(560 108)">
    <rect width="150" height="84" rx="16" fill="#0d1a30" stroke="#24344f" stroke-width="2"/>
    <rect x="18" y="20" width="100" height="10" rx="5" fill="#3b4759"/>
    <rect x="18" y="40" width="72" height="10" rx="5" fill="#3b4759" opacity=".7"/>
    <rect x="18" y="60" width="56" height="10" rx="5" fill="#2563eb"/>
  </g>
</svg>
