<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Un mapa de barrio con tres locales marcados, y uno de ellos resaltado como la recomendación elegida, con sus tres señales: datos consistentes, reseñas recientes y contenido específico">
  <defs>
    <linearGradient id="bgPyme" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081223"/>
      <stop offset="1" stop-color="#0f1c33"/>
    </linearGradient>
    <radialGradient id="glowPymeA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".5"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPymeB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#09c5d6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#09c5d6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bgPyme)"/>
  <circle cx="150" cy="150" r="220" fill="url(#glowPymeA)"/>
  <circle cx="1060" cy="150" r="210" fill="url(#glowPymeB)"/>

  <!-- Trazado de calles, abstracto, sin referencia a ningún mapa real. -->
  <g stroke="#1e3a6b" stroke-width="2" opacity="0.6">
    <path d="M0 90 H1200" />
    <path d="M0 200 H1200" />
    <path d="M260 0 V300" />
    <path d="M600 0 V300" />
    <path d="M900 0 V300" />
  </g>

  <!-- Dos locales sin resaltar. -->
  <g>
    <circle cx="130" cy="145" r="16" fill="#0d1830" stroke="#3b62b8" stroke-width="2.5"/>
    <circle cx="130" cy="145" r="5" fill="#3b62b8"/>
  </g>
  <g>
    <circle cx="420" cy="240" r="16" fill="#0d1830" stroke="#3b62b8" stroke-width="2.5"/>
    <circle cx="420" cy="240" r="5" fill="#3b62b8"/>
  </g>
  <g>
    <circle cx="1030" cy="70" r="16" fill="#0d1830" stroke="#3b62b8" stroke-width="2.5"/>
    <circle cx="1030" cy="70" r="5" fill="#3b62b8"/>
  </g>

  <!-- El local recomendado: resaltado, con las tres señales alrededor. -->
  <g>
    <circle cx="740" cy="150" r="28" fill="#0b1a33" stroke="#5de6f2" stroke-width="3"/>
    <circle cx="740" cy="150" r="9" fill="#5de6f2"/>

    <!-- Tres marcas de comprobación en torno al local elegido: datos, reseñas, contenido. -->
    <g transform="translate(740 150)">
      <g transform="rotate(-55)">
        <line x1="0" y1="-46" x2="0" y2="-70" stroke="#2b4d8f" stroke-width="2"/>
        <circle cx="0" cy="-82" r="15" fill="#0d1830" stroke="#5de6f2" stroke-width="2"/>
        <path transform="translate(0 -82) rotate(55)" d="M-5 0 l3.5 4 l7 -8.5" fill="none" stroke="#5de6f2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="rotate(0)">
        <line x1="0" y1="-46" x2="0" y2="-70" stroke="#2b4d8f" stroke-width="2"/>
        <circle cx="0" cy="-82" r="15" fill="#0d1830" stroke="#5de6f2" stroke-width="2"/>
        <path transform="translate(0 -82)" d="M-5 0 l3.5 4 l7 -8.5" fill="none" stroke="#5de6f2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="rotate(55)">
        <line x1="0" y1="-46" x2="0" y2="-70" stroke="#2b4d8f" stroke-width="2"/>
        <circle cx="0" cy="-82" r="15" fill="#0d1830" stroke="#5de6f2" stroke-width="2"/>
        <path transform="translate(0 -82) rotate(-55)" d="M-5 0 l3.5 4 l7 -8.5" fill="none" stroke="#5de6f2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>
