<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Una respuesta redactada con tres afirmaciones, cada una anclada a una cita numerada que enlaza a una fuente distinta">
  <defs>
    <linearGradient id="bgPplx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081223"/>
      <stop offset="1" stop-color="#0f1c33"/>
    </linearGradient>
    <radialGradient id="glowPplxA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".5"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPplxB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#09c5d6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#09c5d6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bgPplx)"/>
  <circle cx="150" cy="150" r="220" fill="url(#glowPplxA)"/>
  <circle cx="1060" cy="150" r="210" fill="url(#glowPplxB)"/>

  <!-- Tarjeta de respuesta, a la izquierda: tres líneas de texto, cada una
       terminando en un chip de cita numerada. Sin logotipos ni tipografía de
       ningún motor real: es una ilustración genérica del patrón "respuesta
       con citas ancladas", el mismo criterio que las demás portadas del blog
       (sin capturas reales, sin marcas de terceros). -->
  <g>
    <rect x="96" y="56" width="560" height="188" rx="14" fill="#0d1830" stroke="#1e3a6b" stroke-width="2"/>

    <rect x="126" y="90" width="360" height="10" rx="5" fill="#3b62b8"/>
    <rect x="494" y="86" width="26" height="18" rx="5" fill="#0b1a33" stroke="#5de6f2" stroke-width="1.5"/>
    <text x="507" y="99" font-family="ui-monospace, monospace" font-size="11" fill="#5de6f2" text-anchor="middle">1</text>

    <rect x="126" y="122" width="300" height="10" rx="5" fill="#3b62b8"/>
    <rect x="434" y="118" width="26" height="18" rx="5" fill="#0b1a33" stroke="#5de6f2" stroke-width="1.5"/>
    <text x="447" y="131" font-family="ui-monospace, monospace" font-size="11" fill="#5de6f2" text-anchor="middle">2</text>

    <rect x="126" y="154" width="392" height="10" rx="5" fill="#3b62b8"/>
    <rect x="526" y="150" width="26" height="18" rx="5" fill="#0b1a33" stroke="#5de6f2" stroke-width="1.5"/>
    <text x="539" y="163" font-family="ui-monospace, monospace" font-size="11" fill="#5de6f2" text-anchor="middle">3</text>

    <rect x="126" y="186" width="220" height="10" rx="5" fill="#1e3a6b"/>
  </g>

  <!-- Flecha hacia el panel de fuentes. -->
  <path d="M690 150 h44" stroke="#2b4d8f" stroke-width="3" stroke-linecap="round"/>
  <path d="M724 141 l11 9 l-11 9" fill="none" stroke="#2b4d8f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Panel de fuentes, a la derecha: tres tarjetas, cada una con su número
       de cita y una barra de "dominio", para que el par número→fuente se lea
       de un vistazo. -->
  <g>
    <rect x="784" y="66" width="336" height="52" rx="10" fill="#0d1830" stroke="#1e3a6b" stroke-width="2"/>
    <circle cx="812" cy="92" r="13" fill="#0b1a33" stroke="#5de6f2" stroke-width="2"/>
    <text x="812" y="97" font-family="ui-monospace, monospace" font-size="12" fill="#5de6f2" text-anchor="middle">1</text>
    <rect x="840" y="82" width="248" height="9" rx="4.5" fill="#3b62b8"/>
    <rect x="840" y="98" width="160" height="7" rx="3.5" fill="#1e3a6b"/>

    <rect x="784" y="128" width="336" height="52" rx="10" fill="#0d1830" stroke="#1e3a6b" stroke-width="2"/>
    <circle cx="812" cy="154" r="13" fill="#0b1a33" stroke="#5de6f2" stroke-width="2"/>
    <text x="812" y="159" font-family="ui-monospace, monospace" font-size="12" fill="#5de6f2" text-anchor="middle">2</text>
    <rect x="840" y="144" width="248" height="9" rx="4.5" fill="#3b62b8"/>
    <rect x="840" y="160" width="190" height="7" rx="3.5" fill="#1e3a6b"/>

    <rect x="784" y="190" width="336" height="52" rx="10" fill="#0d1830" stroke="#1e3a6b" stroke-width="2"/>
    <circle cx="812" cy="216" r="13" fill="#0b1a33" stroke="#5de6f2" stroke-width="2"/>
    <text x="812" y="221" font-family="ui-monospace, monospace" font-size="12" fill="#5de6f2" text-anchor="middle">3</text>
    <rect x="840" y="206" width="248" height="9" rx="4.5" fill="#3b62b8"/>
    <rect x="840" y="222" width="130" height="7" rx="3.5" fill="#1e3a6b"/>
  </g>
</svg>
