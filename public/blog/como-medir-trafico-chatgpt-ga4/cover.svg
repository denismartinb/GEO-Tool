      <stop offset="0" stop-color="#09c5d6" stop-opacity=".3"/>
      <stop offset="1" stop-color="#09c5d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dotOn" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#2563eb"/>
    </radialGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".15"/>
      <stop offset="1" stop-color="#09c5d6" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="barAI" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#09c5d6"/>
    </linearGradient>
  </defs>

