<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Una respuesta de IA con solo tres huecos de marca: dos ocupados y uno vacío">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081223"/>
      <stop offset="1" stop-color="#0f1c33"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#09c5d6" stop-opacity=".40"/>
      <stop offset="1" stop-color="#09c5d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f7bff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="215" cy="140" r="330" fill="url(#glowA)"/>
  <circle cx="1010" cy="530" r="300" fill="url(#glowB)"/>

  <!-- Tarjeta de respuesta generativa -->
  <g transform="translate(190 128)">
    <rect width="820" height="374" rx="22" fill="#0d1a30" stroke="#24344f" stroke-width="1.5"/>

    <!-- Cabecera: la pregunta del comprador -->
    <g transform="translate(44 44)">
      <circle cx="11" cy="11" r="11" fill="#09c5d6" opacity=".9"/>
      <rect x="34" y="4" width="420" height="14" rx="7" fill="#5b6b82" opacity=".75"/>
      <rect x="34" y="28" width="250" height="14" rx="7" fill="#5b6b82" opacity=".45"/>
    </g>

    <line x1="44" y1="126" x2="776" y2="126" stroke="#24344f" stroke-width="1.5"/>

    <!-- Hueco 1: ocupado -->
    <g transform="translate(44 156)">
      <rect width="732" height="56" rx="14" fill="#12203a"/>
      <text x="26" y="35" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="700" fill="#98a2b3">1</text>
      <rect x="56" y="19" width="150" height="18" rx="9" fill="url(#pill)"/>
      <rect x="222" y="22" width="330" height="12" rx="6" fill="#3b4759"/>
    </g>

    <!-- Hueco 2: ocupado -->
    <g transform="translate(44 226)">
      <rect width="732" height="56" rx="14" fill="#12203a"/>
      <text x="26" y="35" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="700" fill="#98a2b3">2</text>
      <rect x="56" y="19" width="118" height="18" rx="9" fill="#09c5d6"/>
      <rect x="190" y="22" width="300" height="12" rx="6" fill="#3b4759"/>
    </g>

    <!-- Hueco 3: vacío. Aquí es donde no estás. -->
    <g transform="translate(44 296)">
      <rect width="732" height="56" rx="14" fill="none" stroke="#ffb020" stroke-width="2" stroke-dasharray="9 8" opacity=".85"/>
      <text x="26" y="35" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="700" fill="#ffb020">3</text>
      <rect x="56" y="19" width="150" height="18" rx="9" fill="#ffb020" opacity=".22"/>
      <rect x="222" y="22" width="240" height="12" rx="6" fill="#ffb020" opacity=".14"/>
    </g>
  </g>

  <!-- No hay segunda página -->
  <g transform="translate(190 546)">
    <rect width="6" height="6" rx="3" fill="#98a2b3" opacity=".55"/>
    <rect x="18" width="6" height="6" rx="3" fill="#98a2b3" opacity=".35"/>
    <rect x="36" width="6" height="6" rx="3" fill="#98a2b3" opacity=".18"/>
    <text x="62" y="9" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" fill="#98a2b3">No hay segunda página</text>
  </g>
</svg>
