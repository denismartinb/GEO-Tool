<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Una respuesta de IA con solo tres huecos de marca: dos ocupados y uno vacío">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081223"/>
      <stop offset="1" stop-color="#0f1c33"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".5"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#09c5d6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#09c5d6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="150" cy="150" r="230" fill="url(#glowA)"/>
  <circle cx="1060" cy="150" r="210" fill="url(#glowB)"/>

  <!-- Todo el contenido con valor vive en la franja central (y≈75-225), que
       es la única zona que sobrevive al recorte real: el contenedor del
       artículo mide 1124×96px, así que object-fit:cover solo enseña una
       franja centrada de este lienzo. Ver docs/brand/design-decisions-log.md
       §31 (hallazgo del ux-pilot en el PR #351). -->

  <!-- Tres huecos en horizontal: dos ocupados, uno vacío -->
  <g transform="translate(90 108)">
    <g fill="#3b4759">
      <rect x="0" y="0" width="280" height="84" rx="16" opacity=".28"/>
      <rect x="308" y="0" width="280" height="84" rx="16" opacity=".28"/>
    </g>
    <rect x="0" y="0" width="280" height="84" rx="16" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <rect x="308" y="0" width="280" height="84" rx="16" fill="none" stroke="#09c5d6" stroke-width="2.5"/>
    <rect x="616" y="0" width="280" height="84" rx="16" fill="none" stroke="#ffb020" stroke-width="2.5" stroke-dasharray="10 8"/>

    <text x="34" y="30" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="700" fill="#2563eb">1</text>
    <rect x="34" y="46" width="180" height="13" rx="6.5" fill="#5b6b82" opacity=".8"/>

    <text x="342" y="30" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="700" fill="#09c5d6">2</text>
    <rect x="342" y="46" width="180" height="13" rx="6.5" fill="#5b6b82" opacity=".8"/>

    <text x="650" y="30" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="700" fill="#ffb020">3</text>
    <text x="650" y="55" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#ffb020" opacity=".9">Este eres tú</text>
  </g>
</svg>
