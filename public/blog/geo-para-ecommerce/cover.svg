<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Una respuesta de IA con solo tres huecos de marca: dos ocupados y uno vacío">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081223"/>
      <stop offset="1" stop-color="#0f1c33"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".5"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#09c5d6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#09c5d6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="150" cy="150" r="230" fill="url(#glowA)"/>
  <circle cx="1060" cy="150" r="210" fill="url(#glowB)"/>

  <!-- Sin texto: cada recorte de contenedor (artículo/tarjeta, cualquier
       ancho) parte de un centro distinto, y el texto alineado a la izquierda
       es justo lo que se rompe ahí (ux-pilot, PR #351, segunda vuelta). Sólo
       forma, centrada en (600,150) con margen amplio para sobrevivir a la
       ventana más agresiva medida: la tarjeta de /blog en móvil, ~560px
       centrados. Ver docs/brand/design-decisions-log.md §31. -->

  <!-- Dos huecos ocupados a los lados, el vacío (la marca ausente) en el centro -->
  <g>
    <rect x="120" y="110" width="220" height="80" rx="16" fill="#3b4759" opacity=".3"/>
    <rect x="120" y="110" width="220" height="80" rx="16" fill="none" stroke="#2563eb" stroke-width="3"/>

    <rect x="490" y="106" width="220" height="88" rx="18" fill="none" stroke="#ffb020" stroke-width="3" stroke-dasharray="11 9"/>

    <rect x="860" y="110" width="220" height="80" rx="16" fill="#3b4759" opacity=".3"/>
    <rect x="860" y="110" width="220" height="80" rx="16" fill="none" stroke="#09c5d6" stroke-width="3"/>
  </g>
</svg>
