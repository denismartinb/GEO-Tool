<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Una secuencia de preguntas anónimas que desemboca en una petición de demo">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081223"/>
      <stop offset="1" stop-color="#0f1c33"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".50"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowD" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#09c5d6" stop-opacity=".38"/>
      <stop offset="1" stop-color="#09c5d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f7bff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg2)"/>
  <circle cx="170" cy="520" r="320" fill="url(#glowC)"/>
  <circle cx="1050" cy="120" r="280" fill="url(#glowD)"/>

  <!-- Cuatro preguntas previas: ninguna nombra a un proveedor -->
  <g transform="translate(150 108)">
    <g>
      <rect width="470" height="72" rx="18" fill="#0d1a30" stroke="#24344f" stroke-width="1.5"/>
      <circle cx="36" cy="36" r="9" fill="#09c5d6" opacity=".85"/>
      <rect x="62" y="22" width="330" height="13" rx="6.5" fill="#5b6b82" opacity=".8"/>
      <rect x="62" y="43" width="210" height="13" rx="6.5" fill="#5b6b82" opacity=".5"/>
    </g>
    <g transform="translate(60 96)">
      <rect width="470" height="72" rx="18" fill="#0d1a30" stroke="#24344f" stroke-width="1.5"/>
      <circle cx="36" cy="36" r="9" fill="#09c5d6" opacity=".7"/>
      <rect x="62" y="22" width="290" height="13" rx="6.5" fill="#5b6b82" opacity=".7"/>
      <rect x="62" y="43" width="248" height="13" rx="6.5" fill="#5b6b82" opacity=".42"/>
    </g>
    <g transform="translate(120 192)">
      <rect width="470" height="72" rx="18" fill="#0d1a30" stroke="#24344f" stroke-width="1.5"/>
      <circle cx="36" cy="36" r="9" fill="#09c5d6" opacity=".55"/>
      <rect x="62" y="22" width="316" height="13" rx="6.5" fill="#5b6b82" opacity=".6"/>
      <rect x="62" y="43" width="180" height="13" rx="6.5" fill="#5b6b82" opacity=".34"/>
    </g>
    <g transform="translate(180 288)">
      <rect width="470" height="72" rx="18" fill="#0d1a30" stroke="#24344f" stroke-width="1.5"/>
      <circle cx="36" cy="36" r="9" fill="#09c5d6" opacity=".4"/>
      <rect x="62" y="22" width="252" height="13" rx="6.5" fill="#5b6b82" opacity=".5"/>
      <rect x="62" y="43" width="300" height="13" rx="6.5" fill="#5b6b82" opacity=".28"/>
    </g>

    <!-- Aquí es donde tu empresa se entera. La lista corta ya está hecha. -->
    <path d="M712 60 L712 372" stroke="#ffb020" stroke-width="2" stroke-dasharray="8 9" opacity=".7"/>
    <text x="726" y="52" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="600" fill="#ffb020" opacity=".95">Aquí te enteras tú</text>

    <g transform="translate(726 176)">
      <rect width="196" height="82" rx="20" fill="url(#gate)"/>
      <text x="98" y="49" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="700" fill="#f7f8fb">Demo</text>
    </g>
  </g>

  <text x="150" y="556" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" fill="#98a2b3">Ninguna de esas preguntas menciona todavía a un proveedor</text>
</svg>
