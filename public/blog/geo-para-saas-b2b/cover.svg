<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Una secuencia de preguntas anónimas que desemboca en una petición de demo">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081223"/>
      <stop offset="1" stop-color="#0f1c33"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".5"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowD" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#09c5d6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#09c5d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f7bff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg2)"/>
  <circle cx="140" cy="150" r="220" fill="url(#glowC)"/>
  <circle cx="1080" cy="150" r="210" fill="url(#glowD)"/>

  <!-- Contenido con valor dentro de y≈108-192: la única franja que sobrevive
       al recorte real del contenedor del artículo (1124×96 en desktop). Ver
       docs/brand/design-decisions-log.md §31. -->

  <!-- Cuatro preguntas anónimas, en fila -->
  <g transform="translate(90 118)">
    <g fill="#09c5d6">
      <circle cx="6" cy="6" r="6" opacity=".9"/>
      <circle cx="164" cy="6" r="6" opacity=".72"/>
      <circle cx="322" cy="6" r="6" opacity=".55"/>
      <circle cx="480" cy="6" r="6" opacity=".4"/>
    </g>
    <g fill="#5b6b82">
      <rect x="24" y="0" width="118" height="12" rx="6" opacity=".78"/>
      <rect x="182" y="0" width="118" height="12" rx="6" opacity=".62"/>
      <rect x="340" y="0" width="118" height="12" rx="6" opacity=".48"/>
      <rect x="498" y="0" width="118" height="12" rx="6" opacity=".36"/>
    </g>

    <path d="M0 40 L 630 40" stroke="#ffb020" stroke-width="2" stroke-dasharray="7 7" opacity=".65"/>
    <text x="0" y="66" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" fill="#ffb020">Aquí te enteras tú — la lista corta ya está hecha</text>
  </g>

  <g transform="translate(818 116)">
    <rect width="176" height="68" rx="18" fill="url(#gate)"/>
    <text x="88" y="42" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="21" font-weight="700" fill="#f7f8fb">Demo</text>
  </g>
</svg>
